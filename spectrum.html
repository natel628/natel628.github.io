        }

            background: #0066cc;
            border-color: #0066cc;
            color: #ffffff;

        }

            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
        }
        .channel-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 24px rgba(0, 60, 130, 0.12);
            border-color: #b0c8e0;
        }

            justify-content: center;

            max-height: 100%;
            object-fit: contain;
        }

            font-weight: 700;
            color: #0066cc;
            background: #e6f0ff;

            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;

        /* ============================================================
           BUILD GRIDS
           ============================================================ */
        function buildGrid(pkgKey, containerId) {
            const container = document.getElementById(containerId);
            const filtered = CHANNELS.filter(ch => ch.pkg.includes(pkgKey));
            filtered.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.dataset.chId = ch.id;
                card.innerHTML = `
                    <div class="logo-wrap">
                        <img src="${ch.logo}" alt="${ch.name} logo" loading="lazy"
                             onerror="this.parentElement.innerHTML='<span style=\\'font-size:1.8rem;font-weight:800;color:#0066cc;\\'>${ch.name.charAt(0)}</span>'">
                    </div>
                    <span class="chnum">Ch ${ch.num}</span>
                    <span class="chname">${ch.name}</span>
                `;
                card.addEventListener('click', () => openModal(ch, pkgKey));
                container.appendChild(card);
            });
        }

        buildGrid('signature', 'grid-signature');
        buildGrid('plus', 'grid-plus');
        buildGrid('platinum', 'grid-platinum');

        /* ============================================================
           TABS
           ============================================================ */
        const tabBtns = document.querySelectorAll('.tab-btn');
        const grids = {
            signature: document.getElementById('grid-signature'),
            plus: document.getElementById('grid-plus'),
            platinum: document.getElementById('grid-platinum')
        };

        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const pkg = btn.dataset.pkg;
                Object.keys(grids).forEach(k => {
                    grids[k].style.display = (k === pkg) ? 'grid' : 'none';
                });
            });
        });

        /* ============================================================
           MODAL
           ============================================================ */
        const overlay = document.getElementById('modalOverlay');
        const modalLogo = document.getElementById('modalLogo');
        const modalName = document.getElementById('modalName');
        const modalChnum = document.getElementById('modalChnum');
        const modalDesc = document.getElementById('modalDesc');
        const modalPkg = document.getElementById('modalPkg');
        const modalCategory = document.getElementById('modalCategory');
        const modalClose = document.getElementById('modalClose');

        function pkgLabel(key) {
            return {
                signature: 'TV Select Signature',
                plus: 'TV Select Plus',
                platinum: 'TV Platinum'
            }[key] || key;
        }

        function openModal(ch, pkgKey) {
            modalLogo.src = ch.logo;
            modalLogo.alt = ch.name + ' logo';
            modalName.textContent = ch.name;
            modalChnum.textContent = 'Channel ' + ch.num;
            modalDesc.innerHTML = ch.desc;
            modalPkg.textContent = pkgLabel(pkgKey);
            modalCategory.textContent = ch.cat;
            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            overlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        modalClose.addEventListener('click', closeModal);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
        });
    </script>
