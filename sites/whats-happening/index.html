<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1, viewport-fit=cover'>
<title>What's Happening? - what to watch, attend and experience</title>
<meta name='description' content='A personalized discovery dashboard for comedy, concerts, sports, ski and outdoor events, and scheduled livestreams - near you, online, and around the world.'>
<meta name='color-scheme' content='dark'>
<meta name='theme-color' content='#0a0b0e'>
<link rel='stylesheet' href='css/app.css'>
<link rel='stylesheet' href='css/weather.css'>
<link rel='stylesheet' href='css/diag.css'>
<link rel='stylesheet' href='css/location.css'>
<link rel='icon' href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23ff6b3d'/><path d='M12 4l2 6 6 2-6 2-2 6-2-6-6-2 6-2z' fill='%23fff'/></svg>">
<style>
.sb__close{display:none}
@media (max-width:980px){.sb__close{display:grid}}
#boot-error{position:fixed;left:16px;right:16px;bottom:16px;z-index:9999;background:#2a1410;border:1px solid #ff6b3d;border-radius:10px;padding:12px 14px;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#ffd9cc;white-space:pre-wrap;box-shadow:0 18px 40px -20px #000}
#boot-error b{color:#fff}
</style>
<script>
(function () {
  function show(html) {
    var box = document.getElementById('boot-error');
    if (!box) {
      box = document.createElement('div');
      box.id = 'boot-error';
      document.body.appendChild(box);
    }
    box.innerHTML = html;
  }
  window.addEventListener('error', function (e) {
    show('<b>Script error - the page could not start.</b>\n' +
      (e.message || 'unknown error') + '\n' +
      String(e.filename || '').split('/').pop() + ':' + (e.lineno || '?'));
  });
  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () {
      var m = document.getElementById('main');
      if (m && !m.textContent.trim() && !document.getElementById('boot-error')) {
        show('<b>Nothing rendered.</b>\nThe page loaded but the discovery view produced no content. Open the browser console for details.');
      }
    }, 2500);
  });
})();
</script>
</head>
<body>
<a class='skip' href='#main'>Skip to content</a>

<div class='app'>
  <aside class='sb' id='sidebar' aria-label='Sections'>
    <div class='sb__top'>
      <a class='brand' href='#/discover'>
        <span class='brand__mark' data-icon='spark'></span>
        <span class='brand__name'>What&rsquo;s Happening?<span>One calendar</span></span>
      </a>
      <button class='iconbtn sb__close' data-action='close-nav' aria-label='Close navigation' data-icon='close'></button>
    </div>
    <nav class='sb__nav'>
      <p class='sb__label'>Browse</p>
      <a class='navitem' href='#/discover'><span data-icon='compass'></span>Discover</a>
      <a class='navitem' href='#/near'><span data-icon='pin'></span>Near me</a>
      <a class='navitem' href='#/comedy'><span data-icon='mic'></span>Comedy</a>
      <a class='navitem' href='#/concerts'><span data-icon='music'></span>Concerts</a>
      <a class='navitem' href='#/sports'><span data-icon='trophy'></span>Sports</a>
      <a class='navitem' href='#/outdoor'><span data-icon='mountain'></span>Ski &amp; Outdoor</a>
      <a class='navitem' href='#/online'><span data-icon='play'></span>Online &amp; Livestreams</a>
      <p class='sb__label'>Your calendar</p>
      <a class='navitem' href='#/calendar'><span data-icon='calendar'></span>Calendar</a>
      <a class='navitem' href='#/watchlist'><span data-icon='bookmark'></span>My Watchlist</a>
      <a class='navitem' href='#/settings'><span data-icon='settings'></span>Settings</a>
    </nav>
    <div class='sb__foot'>
      <a class='citycard' href='#/settings'>
        <b>Search radius &amp; interests</b>
        <span>Adjust your location in Settings</span>
      </a>
    </div>
  </aside>

  <div class='shell'>
    <header class='tb'>
      <button class='iconbtn tb__menu' data-action='open-nav' aria-label='Open navigation' data-icon='menu'></button>
      <div class='tb__date'><strong id='tb-date'>Today</strong><span id='tb-city'>Greenville, SC</span></div>
      <form class='search' id='search-form' role='search'>
        <span data-icon='search'></span>
        <input id='q' type='search' placeholder='Search events, comedians, teams, venues' aria-label='Search events' autocomplete='off'>
      </form>
      <div class='tb__actions'>
        <button class='iconbtn' data-action='notifications' aria-label='Notifications' title='Notifications'>
          <span data-icon='bell'></span><span class='dot' id='notif-dot' hidden></span>
        </button>
        <a class='iconbtn' href='#/settings' aria-label='Settings' title='Settings' data-icon='settings'></a>
      </div>
    </header>
    <main id='main' class='main' tabindex='-1'></main>
  </div>
</div>

<nav class='tabbar' aria-label='Quick navigation'>
  <a class='tab' href='#/discover'><span data-icon='compass'></span>Discover</a>
  <a class='tab' href='#/near'><span data-icon='pin'></span>Near</a>
  <a class='tab' href='#/online'><span data-icon='play'></span>Online</a>
  <a class='tab' href='#/calendar'><span data-icon='calendar'></span>Calendar</a>
  <a class='tab' href='#/watchlist'><span data-icon='bookmark'></span>Saved</a>
</nav>
<div id='modal' class='modal' hidden></div>
<div id='toasts' class='toasts' aria-live='polite'></div>

<noscript>
  <p style='padding:24px;font-family:system-ui,sans-serif;color:#e9ebf0'>This dashboard needs JavaScript to show events, filters and your calendar.</p>
</noscript>

<script src='data.js'></script>
<script src='js/core.js'></script>
<script src='js/views.js'></script>
<script src='js/views2.js'></script>
<script src='js/location.js'></script>
<script src='js/app.js'></script>
<script src='js/weather.js'></script>
<script src='js/diag.js'></script>
</body>
</html>
