<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- stash: diamond shape with coin -->
  <symbol id="pin-stash" viewBox="0 0 30 38">
    <path d="M15 2L28 15L15 28L2 15Z" fill="var(--pin-color,#f0a35e)" stroke="var(--pin-border,rgba(0,0,0,.4))" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="4.5" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="1.5"/>
    <line x1="15" y1="11" x2="15" y2="19" stroke="rgba(0,0,0,.5)" stroke-width="1.5"/>
    <line x1="12" y1="14" x2="18" y2="14" stroke="rgba(0,0,0,.5)" stroke-width="1.5"/>
  </symbol>

  <!-- collectible: teardrop with star -->
  <symbol id="pin-collectible" viewBox="0 0 30 38">
    <path d="M15 2C9 2 4 7 4 13C4 22 15 36 15 36C15 36 26 22 26 13C26 7 21 2 15 2Z" fill="var(--pin-color,#b18cf0)" stroke="var(--pin-border,rgba(0,0,0,.4))" stroke-width="1.5"/>
    <path d="M15 7L16.5 11.5H21L17.3 14.2L18.8 18.8L15 16L11.2 18.8L12.7 14.2L9 11.5H13.5Z" fill="rgba(0,0,0,.45)"/>
  </symbol>

  <!-- easter-egg: teardrop with question mark -->
  <symbol id="pin-easter-egg" viewBox="0 0 30 38">
    <path d="M15 2C9 2 4 7 4 13C4 22 15 36 15 36C15 36 26 22 26 13C26 7 21 2 15 2Z" fill="var(--pin-color,#ff5c8a)" stroke="var(--pin-border,rgba(0,0,0,.4))" stroke-width="1.5"/>
    <text x="15" y="19" text-anchor="middle" font-size="13" font-weight="700" font-family="sans-serif" fill="rgba(0,0,0,.5)">?</text>
  </symbol>

  <!-- vehicle: teardrop with a car silhouette -->
  <symbol id="pin-vehicle" viewBox="0 0 30 38">
    <path d="M15 2C9 2 4 7 4 13C4 22 15 36 15 36C15 36 26 22 26 13C26 7 21 2 15 2Z" fill="var(--pin-color,#5eead4)" stroke="var(--pin-border,rgba(0,0,0,.4))" stroke-width="1.5"/>
    <path d="M10.5 15.5h9l1.5 3.5h-12z" fill="rgba(0,0,0,.45)"/>
    <rect x="8.5" y="18.5" width="13" height="4" rx="1.2" fill="rgba(0,0,0,.45)"/>
    <circle cx="11.6" cy="23" r="1.6" fill="rgba(0,0,0,.55)"/>
    <circle cx="18.4" cy="23" r="1.6" fill="rgba(0,0,0,.55)"/>
  </symbol>

  <!-- secret-mission: teardrop with exclamation -->
  <symbol id="pin-secret-mission" viewBox="0 0 30 38">
    <path d="M15 2C9 2 4 7 4 13C4 22 15 36 15 36C15 36 26 22 26 13C26 7 21 2 15 2Z" fill="var(--pin-color,#8fd14f)" stroke="var(--pin-border,rgba(0,0,0,.4))" stroke-width="1.5"/>
    <text x="15" y="19" text-anchor="middle" font-size="14" font-weight="700" font-family="sans-serif" fill="rgba(0,0,0,.5)">!</text>
  </symbol>

  <!-- weapon: diamond with crosshair -->
  <symbol id="pin-weapon" viewBox="0 0 30 38">
    <path d="M15 2L28 15L15 28L2 15Z" fill="var(--pin-color,#e8536b)" stroke="var(--pin-border,rgba(0,0,0,.4))" stroke-width="1.5"/>
    <circle cx="15" cy="15" r="4.5" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="1.5"/>
    <line x1="15" y1="10" x2="15" y2="20" stroke="rgba(0,0,0,.5)" stroke-width="1.5"/>
    <line x1="10" y1="15" x2="20" y2="15" stroke="rgba(0,0,0,.5)" stroke-width="1.5"/>
  </symbol>

  <!-- landmark: teardrop with eye/camera -->
  <symbol id="pin-landmark" viewBox="0 0 30 38">
    <path d="M15 2C9 2 4 7 4 13C4 22 15 36 15 36C15 36 26 22 26 13C26 7 21 2 15 2Z" fill="var(--pin-color,#7fd1ff)" stroke="var(--pin-border,rgba(0,0,0,.4))" stroke-width="1.5"/>
    <rect x="9" y="10" width="12" height="9" rx="2" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="1.5"/>
    <circle cx="15" cy="14.5" r="2.5" fill="rgba(0,0,0,.45)"/>
    <path d="M12 10 L10 8 L20 8 L18 10" fill="rgba(0,0,0,.45)" stroke="none"/>
  </symbol>

  <!-- safehouse: shield with roof/house -->
  <symbol id="pin-safehouse" viewBox="0 0 30 38">
    <path d="M15 2L27 9V21C27 28 15 36 15 36C15 36 3 28 3 21V9Z" fill="var(--pin-color,#5ad48a)" stroke="var(--pin-border,rgba(0,0,0,.4))" stroke-width="1.5"/>
    <path d="M10 21V16H20V21" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M8 16L15 10L22 16" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="12.5" y="17.5" width="5" height="3.5" fill="rgba(0,0,0,.45)"/>
  </symbol>

  <!-- activity: shield with flag -->
  <symbol id="pin-activity" viewBox="0 0 30 38">
    <path d="M15 2L27 9V21C27 28 15 36 15 36C15 36 3 28 3 21V9Z" fill="var(--pin-color,#ffd166)" stroke="var(--pin-border,rgba(0,0,0,.4))" stroke-width="1.5"/>
    <line x1="13" y1="10" x2="13" y2="22" stroke="rgba(0,0,0,.5)" stroke-width="1.5"/>
    <path d="M13 10L21 13L13 16Z" fill="rgba(0,0,0,.45)"/>
  </symbol>

  <!-- shop: teardrop with bag -->
  <symbol id="pin-shop" viewBox="0 0 30 38">
    <path d="M15 2C9 2 4 7 4 13C4 22 15 36 15 36C15 36 26 22 26 13C26 7 21 2 15 2Z" fill="var(--pin-color,#8fb3d9)" stroke="var(--pin-border,rgba(0,0,0,.4))" stroke-width="1.5"/>
    <rect x="10" y="13" width="10" height="8" rx="1.5" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="1.5"/>
    <path d="M12 13V11.5C12 9.6 18 9.6 18 11.5V13" fill="none" stroke="rgba(0,0,0,.5)" stroke-width="1.5"/>
  </symbol>

  <!-- custom pin: circle with plus -->
  <symbol id="pin-custom" viewBox="0 0 30 38">
    <circle cx="15" cy="15" r="12" fill="var(--pin-color,#ff3d7f)" stroke="rgba(255,255,255,.4)" stroke-width="1.5" stroke-dasharray="4 2"/>
    <line x1="15" y1="10" x2="15" y2="20" stroke="rgba(255,255,255,.8)" stroke-width="2"/>
    <line x1="10" y1="15" x2="20" y2="15" stroke="rgba(255,255,255,.8)" stroke-width="2"/>
  </symbol>

  <!-- position marker: circle with crosshair rings -->
  <symbol id="pin-position" viewBox="0 0 30 30">
    <circle cx="15" cy="15" r="12" fill="none" stroke="var(--pin-color,#28e0cb)" stroke-width="2"/>
    <circle cx="15" cy="15" r="4" fill="var(--pin-color,#28e0cb)"/>
    <line x1="15" y1="2"  x2="15" y2="7"  stroke="var(--pin-color,#28e0cb)" stroke-width="2"/>
    <line x1="15" y1="23" x2="15" y2="28" stroke="var(--pin-color,#28e0cb)" stroke-width="2"/>
    <line x1="2"  y1="15" x2="7"  y2="15" stroke="var(--pin-color,#28e0cb)" stroke-width="2"/>
    <line x1="23" y1="15" x2="28" y2="15" stroke="var(--pin-color,#28e0cb)" stroke-width="2"/>
  </symbol>

  <!-- cluster icon: ring with count (used as template via JS) -->
  <symbol id="pin-cluster" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="17" fill="var(--pin-color,#ff3d7f)" fill-opacity=".25" stroke="var(--pin-color,#ff3d7f)" stroke-width="2.5"/>
  </symbol>
</svg>
