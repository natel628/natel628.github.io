          <div style="font-size:0.85rem;color:var(--text-muted)">In Watchlist</div>
        </div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center">
          <div style="font-size:2.5rem;font-weight:700;color:#1a6ef5">${movieCount}</div>
          <div style="font-size:0.85rem;color:var(--text-muted)">Movies Rated</div>

        <div style="display:flex;gap:12px;flex-wrap:wrap">

      </div>
      ` : ''}

      ${topGenres.length > 0 ? `
      <div>
        <div style="font-size:1rem;font-weight:700;margin-bottom:12px">Top Genres</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          ${topGenres.map(g => `
            <span class="genre-tag">${g.name} (${g.count})</span>
          `).join('')}
        </div>
      </div>
      ` : ''}

      ${totalRatings === 0 && totalWatchlist === 0 ? `
      <div class="empty-state">
        <div class="icon">📊</div>
        <p>No stats yet! Start rating and adding items to your watchlist.</p>
      </div>
      ` : ''}

      <div style="margin-top:24px;padding-top:24px;border-top:1px solid var(--border)">
        <div style="font-size:1rem;font-weight:700;margin-bottom:12px">Data Management</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <button class="modal-btn" onclick="exportData()">📥 Export Data</button>
          <button class="modal-btn" onclick="document.getElementById('import-file').click()">📤 Import Data</button>
          <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(this)" />
        </div>
      </div>
    </div>
  `;
}

function exportData() {
  const data = {
    ratings: state.ratings,
    watchlist: state.watchlist,
    mediaDetails: state.mediaDetails,
    genreAffinity: LS.get('genre_affinity') || {},
    exportDate: new Date().toISOString(),
    version: '1.0'
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `media-calendar-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Data exported successfully');
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm(`Import ${Object.keys(data.ratings || {}).length} ratings and ${Object.keys(data.watchlist || {}).length} watchlist items? This will merge with existing data.`)) return;

      // Merge data
      state.ratings = { ...state.ratings, ...(data.ratings || {}) };
      state.watchlist = { ...state.watchlist, ...(data.watchlist || {}) };
      state.mediaDetails = { ...state.mediaDetails, ...(data.mediaDetails || {}) };
      if (data.genreAffinity) {
        const existing = LS.get('genre_affinity') || {};
        Object.entries(data.genreAffinity).forEach(([k, v]) => {
          existing[k] = (existing[k] || 0) + v;
        });
        LS.set('genre_affinity', existing);
      }

      saveRatings();
      saveWatchlist();
      saveMediaDetails();
      toast('Data imported successfully');
      renderView();
    } catch (err) {
      toast('Failed to import: Invalid file format');
      console.error(err);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

/* ─────────────────────────────────────────────────────────────────────
   HELPERS — row builder, filter, skeletons
   ───────────────────────────────────────────────────────────────────── */
async function filterResults(items) {
  const filtered = items.filter(i => {
    if (state.filterType !== 'all' && i.media_type !== state.filterType) return false;
    if (state.genre && !(i.genre_ids || []).includes(parseInt(state.genre))) return false;
    return true;
  });

  // Apply content rating filter if set
  if (state.contentRating) {
    const withRatings = await Promise.all(filtered.map(async (item) => {
      if (item._contentRating) return item;
      const rating = await getContentRating(item.media_type, item.id);
      item._contentRating = rating;
      return item;
    }));
    return withRatings.filter(i => i._contentRating === state.contentRating);
  }

  // Apply year filter if set
  if (state.year) {
    return filtered.filter(i => {
      const date = i.release_date || i.first_air_date;
      return date && date.startsWith(state.year);
    });
  }

  return filtered;
}

function renderRow(container, title, items, recBadge = false) {
  const sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = `
    <div class="section-header"><span class="section-title">${title}</span></div>
    <div class="row-wrap">
      <button class="row-scroll-btn left" aria-label="Scroll left">&#8249;</button>
      <div class="card-row"></div>
      <button class="row-scroll-btn right" aria-label="Scroll right">&#8250;</button>
    </div>`;

  const row  = sec.querySelector('.card-row');
  const btnL = sec.querySelector('.row-scroll-btn.left');
  const btnR = sec.querySelector('.row-scroll-btn.right');

  // Scroll by ~4 cards worth
  const scrollAmt = () => (parseInt(getComputedStyle(document.documentElement).getPropertyValue('--card-w')) || 160) * 4 + 56;
  btnL.addEventListener('click', () => row.scrollBy({ left: -scrollAmt(), behavior: 'smooth' }));
  btnR.addEventListener('click', () => row.scrollBy({ left:  scrollAmt(), behavior: 'smooth' }));

  if (!items.length) {
    sec.querySelector('.row-wrap').outerHTML = `<p style="color:var(--text-muted);font-size:.85rem">No results found.</p>`;
  } else {
    items.forEach(item => {
      const card = buildCard(item);
      if (recBadge) {
        const badge = document.createElement('span');
        badge.className = 'rec-badge';
        badge.style.cssText = 'position:absolute;top:6px;right:6px;';
        badge.textContent = 'For You';
        card.appendChild(badge);
      }
      row.appendChild(card);
    });
  }
  container.appendChild(sec);
}

function addSkeletonRow(container, title) {
  const sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = `<div class="section-header"><span class="section-title">${title}</span></div>
  <div class="card-row">${[...Array(6)].map(() => `<div class="skel-card skeleton"></div>`).join('')}</div>`;
  container.appendChild(sec);
}

/* ─────────────────────────────────────────────────────────────────────
   FILTER EVENTS
   ───────────────────────────────────────────────────────────────────── */
document.querySelectorAll('[data-filter-type]').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('[data-filter-type]').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    state.filterType = chip.dataset.filterType;
    if (['trending','upcoming'].includes(state.view)) renderView();
  });
});
document.getElementById('genre-filter').addEventListener('change', e => {
  state.genre = e.target.value;
  if (['trending','upcoming'].includes(state.view)) renderView();
});
document.getElementById('sort-filter').addEventListener('change', e => {
  state.sort = e.target.value;
  if (['trending','upcoming'].includes(state.view)) renderView();
});
document.getElementById('provider-filter').addEventListener('change', e => {
  state.provider = e.target.value;
  if (['trending','upcoming'].includes(state.view)) renderView();
});
document.getElementById('rating-filter').addEventListener('change', e => {
  state.contentRating = e.target.value;
  if (['trending','upcoming'].includes(state.view)) renderView();
});

// Populate year filter
const yearFilter = document.getElementById('year-filter');
const currentYear = new Date().getFullYear();
for (let y = currentYear; y >= 1950; y--) {
  const opt = document.createElement('option');
  opt.value = y;
  opt.textContent = y;
  yearFilter.appendChild(opt);
}
document.getElementById('year-filter').addEventListener('change', e => {
  state.year = e.target.value;
  if (['trending','upcoming'].includes(state.view)) renderView();
});

// Populate genre filter from GENRE_MAP
const genreFilter = document.getElementById('genre-filter');
Object.entries(GENRE_MAP)
  .sort(([,a], [,b]) => a.localeCompare(b))
  .forEach(([id, name]) => {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = name;
    genreFilter.appendChild(opt);
  });

/* ─────────────────────────────────────────────────────────────────────
   NAV EVENTS
   ───────────────────────────────────────────────────────────────────── */
document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    state.view = tab.dataset.view;
    renderView();
  });
});

/* ─────────────────────────────────────────────────────────────────────
   INIT
   ───────────────────────────────────────────────────────────────────── */
// Check Simkl activities and re-sync if anything changed since last sync
async function refreshSimklIfNeeded() {
  if (!state.simklToken) return;
  try {
    const lastSync = LS.get('simkl_last_sync') || '2000-01-01T00:00:00.000Z';
    const activities = await simklGet('/sync/activities');
    // Check if any TV/movie activity is newer than our last sync
    const latest = [
      activities?.tv?.all,
      activities?.movies?.all,
      activities?.tv?.rated_at,
      activities?.movies?.rated_at,
    ].filter(Boolean).sort().pop();

    if (latest && latest > lastSync) {
      console.log('Simkl changes detected, resyncing…');
      await syncSimklLibrary();
      LS.set('simkl_last_sync', new Date().toISOString());
    }
  } catch(e) {
    console.warn('Simkl activity check failed:', e);
  }
}

(async function init() {
  // Initialize theme
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('theme-toggle').textContent = state.theme === 'dark' ? '🌙' : '☀️';

  // Hide Simkl connect button when running from local filesystem
  const isLocal = window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  if (isLocal) {
    const btn  = document.getElementById('simkl-btn');
    const user = document.getElementById('simkl-user');
    btn.textContent   = 'Simkl (deploy to enable)';
    btn.style.opacity = '0.4';
    btn.style.cursor  = 'not-allowed';
    btn.onclick       = () => toast('Connect Simkl after deploying to GitHub Pages');
    user.textContent  = '⚠ Running locally';
    user.style.color  = 'var(--text-muted)';
  } else {
    updateSimklUI();
    await handleSimklCallback();
    // Auto-refresh Simkl library if anything changed since last visit
    await refreshSimklIfNeeded();
  }

  renderView();
})();
</script>
