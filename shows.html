async function renderCalendar(main, token) {
  main.innerHTML = `
    <div class="section">
      <div class="cal-month-nav">
        <button onclick="calPrev()">◀ Prev</button>
        <span id="cal-month-label"></span>
        <button onclick="calNext()">Next ▶</button>
        <button onclick="calToday()">Today</button>
        <label class="cal-toggle"><input type="checkbox" id="cal-my-only" ${state.calMyOnly ? 'checked' : ''} /> My list only</label>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;font-size:.78rem;color:var(--text-muted);align-items:center">
        <span>Legend:</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#1a6ef5;border-radius:2px;margin-right:4px"></span>TV Premiere</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:2px;margin-right:4px"></span>Movie Release</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#1ce783;border-radius:2px;margin-right:4px"></span>My List</span>
        ${state.simklToken ? `<button class="modal-btn" onclick="markAllEpisodesWatched()" style="margin-left:auto;font-size:.75rem;padding:4px 10px">✓ Mark All Aired Watched</button>` : `<span style="margin-left:auto;color:var(--accent)">⚠ <a href="#" onclick="simklAuth();return false" style="color:var(--accent)">Connect Simkl</a> to mark episodes</span>`}
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div id="cal-loading" style="text-align:center;padding:20px;color:var(--text-muted);font-size:.85rem"></div>
    </div>`;

  document.getElementById('cal-my-only').addEventListener('change', e => {
    state.calMyOnly = e.target.checked;
    LS.set('cal_my_only', state.calMyOnly);
    buildCalendarGrid();
    populateCalendar();
  });

  buildCalendarGrid();
  await populateCalendar();
}

function calPrev() {
  state.calMonth--;
  if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
  buildCalendarGrid();
  populateCalendar();
}
function calNext() {
  state.calMonth++;
  if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
  buildCalendarGrid();
  populateCalendar();
}
function calToday() {
  const now = new Date();
  state.calYear = now.getFullYear();
  state.calMonth = now.getMonth();
  buildCalendarGrid();
  populateCalendar();
}

function buildCalendarGrid() {
  const label = document.getElementById('cal-month-label');
  const grid  = document.getElementById('cal-grid');
  if (!label || !grid) return;

  const monthName = new Date(state.calYear, state.calMonth, 1)
    .toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  label.textContent = monthName;

  const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const firstDay = new Date(state.calYear, state.calMonth, 1).getDay();
  const numDays  = new Date(state.calYear, state.calMonth + 1, 0).getDate();
  const today    = new Date();

  let html = days.map(d => `<div class="cal-day-header">${d}</div>`).join('');
  for (let i = 0; i < firstDay; i++) html += '<div></div>';
  for (let d = 1; d <= numDays; d++) {
    const isToday = today.getFullYear() === state.calYear &&
                    today.getMonth() === state.calMonth &&
                    today.getDate() === d;
    const dateStr = `${state.calYear}-${pad2(state.calMonth+1)}-${pad2(d)}`;
    html += `<div class="cal-day${isToday ? ' today' : ''}" data-date="${dateStr}">
      <div class="cal-day-num">${d}</div>
    </div>`;
  }
  grid.innerHTML = html;
}

function addCalItem(dateStr, label, cssClass, tooltip, onClick, opts = {}) {
  const cell = document.querySelector(`.cal-day[data-date="${dateStr}"]`);
  if (!cell) return;

  const wrapper = document.createElement('div');
  wrapper.className = 'cal-wrap';

  const div = document.createElement('div');
  div.className = `cal-item ${cssClass}`;
  const displayLabel = opts.epLabel ? `${opts.epLabel} ${label}` : label;
  div.textContent = displayLabel;
  div.title = tooltip || displayLabel;
  if (onClick) div.addEventListener('click', e => { e.stopPropagation(); onClick(); });
  wrapper.appendChild(div);

  const aired = opts.airDate && opts.airDate <= localISO(new Date());
  if (opts.showId && opts.episode && aired && state.simklToken && cssClass.includes('my-show')) {
    const ep = opts.episode;
    const watchedKey = `watched_${opts.showId}_s${ep.season_number}e${ep.episode_number}`;
    const already = !!LS.get(watchedKey);

    const btn = document.createElement('button');
    btn.dataset.showId  = opts.showId;
    btn.dataset.season  = ep.season_number;
    btn.dataset.episode = ep.episode_number;
    btn.dataset.watched = already ? '1' : '0';
    btn.title = already ? 'Marked as watched' : 'Mark as watched';
    btn.textContent = already ? '✅' : '○';
    btn.style.cssText = `position:absolute;top:1px;right:2px;background:none;border:none;font-size:.65rem;color:${already ? '#1ce783' : 'var(--text-muted)'};padding:0;line-height:1.6`;
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      if (btn.dataset.watched === '1') return;
      btn.textContent = '⏳';
      const ok = await markEpisodeWatched(opts.showId, ep.season_number, ep.episode_number);
      if (ok) {
        LS.set(watchedKey, true);
        btn.dataset.watched = '1';
        btn.textContent = '✅';
        btn.style.color = '#1ce783';
        btn.title = 'Marked as watched';
        toast(`✅ Marked S${pad2(ep.season_number)}E${pad2(ep.episode_number)} as watched`);
      } else {
        btn.textContent = '○';
      }
    });
    wrapper.appendChild(btn);
  }

  cell.appendChild(wrapper);
}

async function markEpisodeWatched(showTmdbId, season, episode) {
  if (!state.simklToken) return false;
  try {
    await simklPost('/sync/history', {
      shows: [{
        ids: { tmdb: showTmdbId },
        seasons: [{ number: season, episodes: [{ number: episode }] }]
      }]
    });
    return true;
  } catch(e) {
    console.warn('Mark watched error:', e);
    toast('Failed to mark as watched');
    return false;
  }
}

async function markAllEpisodesWatched() {
  if (!state.simklToken) return;
  const btns = [...document.querySelectorAll('.cal-wrap button[data-watched="0"]')];
  if (btns.length === 0) {
    toast('No unwatched aired episodes this month');
    return;
  }
  if (!confirm(`Mark ${btns.length} aired episode${btns.length > 1 ? 's' : ''} as watched?`)) return;

  const byShow = {};
  btns.forEach(b => {
    const s = Number(b.dataset.showId), se = Number(b.dataset.season), ep = Number(b.dataset.episode);
    byShow[s] = byShow[s] || {};
    byShow[s][se] = byShow[s][se] || [];
    byShow[s][se].push({ number: ep });
  });
  const body = {
    shows: Object.entries(byShow).map(([id, seasons]) => ({
      ids: { tmdb: Number(id) },
      seasons: Object.entries(seasons).map(([n, eps]) => ({ number: Number(n), episodes: eps })),
    })),
  };

  toast(`Marking ${btns.length} episodes as watched...`);
  try {
    await simklPost('/sync/history', body);
    btns.forEach(b => {
      LS.set(`watched_${b.dataset.showId}_s${b.dataset.season}e${b.dataset.episode}`, true);
      b.dataset.watched = '1';
      b.textContent = '✅';
      b.style.color = '#1ce783';
      b.title = 'Marked as watched';
    });
    toast(`✅ Marked ${btns.length} episodes as watched`);
  } catch (e) {
    console.warn('Bulk mark error:', e);
    toast('Failed to mark episodes as watched');
  }
}

async function populateCalendar() {
  const myTok = ++calToken;
  const yr = state.calYear;
  const mo = state.calMonth;
  const lastDay  = new Date(yr, mo + 1, 0).getDate();
  const dateFrom = `${yr}-${pad2(mo + 1)}-01`;
  const dateTo   = `${yr}-${pad2(mo + 1)}-${pad2(lastDay)}`;
  const loading  = document.getElementById('cal-loading');
  if (loading) loading.textContent = 'Loading…';

  const inRange = ds => !!ds && ds >= dateFrom && ds <= dateTo;
  const placed = new Set();
  let itemCount = 0;
  let myCount = 0;

  const add = (date, label, cls, tip, onClick, opts = {}) => {
    if (myTok !== calToken) return;
    const pk = `${date}|${opts.pk || label}`;
    if (placed.has(pk)) return;
    placed.add(pk);
    addCalItem(date, label, cls, tip, onClick, opts);
    itemCount++;
    if (cls.includes('my-show')) myCount++;
  };

  if (!state.calMyOnly) {
    try {
      const [pg1, pg2] = await Promise.all([1, 2].map(page => tmdb('/discover/movie', {
        'primary_release_date.gte': dateFrom,
        'primary_release_date.lte': dateTo,
        sort_by: 'popularity.desc',
        'vote_count.gte': 0,
        page,
      })));
      [...(pg1.results||[]), ...(pg2.results||[])].forEach(m => {
        if (!inRange(m.release_date)) return;
        const mine = ['plantowatch', 'watching'].includes(getWlStatus('movie', m.id));
        add(m.release_date, m.title, mine ? 'movie my-show' : 'movie',
          `🎬 ${m.title}`, () => openModal('movie', m.id, m), { pk: `movie_${m.id}` });
      });
    } catch(e) { console.warn('TMDB movies error:', e); toast('Failed to load movie releases'); }

    try {
      const tvDiscover = await tmdb('/discover/tv', {
        'first_air_date.gte': dateFrom,
        'first_air_date.lte': dateTo,
        sort_by: 'popularity.desc',
        page: 1,
      });
      (tvDiscover.results || []).forEach(show => {
        if (!inRange(show.first_air_date)) return;
        add(show.first_air_date, show.name, 'tv', `📺 ${show.name} (premiere)`,
          () => openModal('tv', show.id, show), { pk: `tvprem_${show.id}` });
      });
    } catch(e) { console.warn('TMDB TV discover error:', e); toast('Failed to load TV premieres'); }
  }

  Object.entries(state.watchlist).forEach(([key, status]) => {
    if (!key.startsWith('movie_') || !['plantowatch', 'watching'].includes(status)) return;
    const d = state.mediaDetails[key];
    if (!d || !inRange(d.release_date)) return;
    add(d.release_date, d.title || 'Movie', 'movie my-show', `⭐ ${d.title}`,
      () => openModal('movie', d.id, d), { pk: `movie_${d.id}` });
  });

  const myShowIds = Object.entries(state.watchlist)
    .filter(([k, s]) => k.startsWith('tv_') && ['watching', 'plantowatch'].includes(s))
    .map(([k]) => parseInt(k.replace('tv_', '')))
    .filter(Boolean);

  if (myShowIds.length > 0) {
    if (loading && myTok === calToken) loading.textContent = `Loading your ${myShowIds.length} shows…`;

    await promiseAllChunked(myShowIds, async showId => {
      try {
        const detail = await tmdb(`/tv/${showId}`);
        const showName = detail.name;
        const currentSeason = detail.number_of_seasons;
        if (!currentSeason) return;

        const seasonData = await tmdb(`/tv/${showId}/season/${currentSeason}`);
        (seasonData.episodes || []).forEach(ep => {
          if (!inRange(ep.air_date)) return;
          const epLabel = `S${pad2(ep.season_number)}E${pad2(ep.episode_number)}`;
          add(ep.air_date, showName, 'tv my-show',
            `⭐ ${showName} ${epLabel}: ${ep.name || ''}`,
            () => openModal('tv', showId, detail),
            { pk: `ep_${showId}_${epLabel}`, epLabel, showId, airDate: ep.air_date,
              episode: { season_number: ep.season_number, episode_number: ep.episode_number } });
        });

        const next = detail.next_episode_to_air;
        if (next && inRange(next.air_date)) {
          const epLabel = `S${pad2(next.season_number)}E${pad2(next.episode_number)}`;
          add(next.air_date, showName, 'tv my-show',
            `⭐ ${showName} ${epLabel} (next)`,
            () => openModal('tv', showId, detail),
            { pk: `ep_${showId}_${epLabel}`, epLabel, showId, airDate: next.air_date,
              episode: { season_number: next.season_number, episode_number: next.episode_number } });
        }
      } catch(e) { console.warn(`Failed loading show ${showId}:`, e); }
    }, 5);
  }

  if (loading && myTok === calToken) {
    if (itemCount > 0) {
      loading.textContent = `${itemCount} events — ${myCount} from your list`;
    } else {
      loading.innerHTML = `No events found. <a href="#" onclick="document.querySelector('[data-view=trending]').click();return false" style="color:var(--accent)">Browse Trending</a> to add shows.`;
    }
  }
}

/* ── UPCOMING ─────────────────────────────────────────────────────── */
async function renderUpcoming(main, token) {
  addSkeletonRow(main, 'Upcoming Movies 🎬');
  addSkeletonRow(main, 'New TV Premieres 📺');

  const today     = new Date();
  const todayStr  = localISO(today);
  const future    = new Date(today); future.setDate(today.getDate() + 60);
  const futureStr = localISO(future);
  const startOfToday = new Date(today.getFullYear(), today.getMonth(), today.getDate());

  const providerParam = state.provider ? { watch_region: 'US', with_watch_providers: state.provider } : {};
  const genreParam = state.genre ? { with_genres: state.genre } : {};

  const [upMovies, tvPrem] = await Promise.all([
    tmdb('/discover/movie', {
      'primary_release_date.gte': todayStr,
      'primary_release_date.lte': futureStr,
      sort_by: 'popularity.desc',
      'vote_count.gte': 0,
      ...providerParam,
      ...genreParam,
    }),
    tmdb('/discover/tv', {
      'air_date.gte': todayStr,
      'air_date.lte': futureStr,
      sort_by: 'popularity.desc',
      'vote_count.gte': 10,
      ...providerParam,
      ...genreParam,
    }),
  ]);
  if (token !== renderToken) return;

  const movies = (upMovies.results || []).map(m => ({...m, media_type:'movie'}));
  const shows  = (tvPrem.results   || []).map(t => ({...t, media_type:'tv'}));

  const fMovies = await filterResults(movies);
  const fShows  = await filterResults(shows);
  if (token !== renderToken) return;

  main.innerHTML = '';
  renderRow(main, 'Upcoming Movies 🎬', fMovies);
  renderRow(main, 'Premiering / On Air Soon 📺', fShows);

  const listSection = document.createElement('div');
  listSection.className = 'section';
  listSection.innerHTML = `
    <div class="section-header"><span class="section-title">Release Schedule — Next 60 Days</span></div>
    <div style="display:flex;flex-direction:column;gap:8px" id="release-list"></div>
  `;
  main.appendChild(listSection);
  const releaseList = document.getElementById('release-list');

  const sorted = [...fMovies, ...fShows]
    .filter(i => {
      const d = i.release_date || i.first_air_date;
      return d && d >= todayStr && d <= futureStr;
    })
    .sort((a, b) => (a.release_date || a.first_air_date).localeCompare(b.release_date || b.first_air_date));

  if (!sorted.length) {
    releaseList.innerHTML = `<p style="color:var(--text-muted);font-size:.85rem;padding:8px 0">No upcoming releases found for the selected filters.</p>`;
  }

  sorted.slice(0, 30).forEach(item => {
    const title    = item.title || item.name;
    const dateStr  = item.release_date || item.first_air_date;
    const date     = formatDate(dateStr);
    const daysAway = Math.round((new Date(dateStr + 'T00:00:00') - startOfToday) / 86400000);
    const daysLabel = daysAway <= 0 ? 'Today!' : daysAway === 1 ? 'Tomorrow' : `in ${daysAway}d`;

    const el = document.createElement('div');
    el.style.cssText = 'display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;cursor:pointer;transition:border-color .15s';
    el.onmouseover = () => el.style.borderColor = 'var(--accent)';
    el.onmouseout  = () => el.style.borderColor = 'var(--border)';
    el.innerHTML = `
      <div style="min-width:90px;text-align:right">
        <div style="font-size:.75rem;color:var(--accent);font-weight:700">${esc(date)}</div>
        <div style="font-size:.68rem;color:var(--text-muted)">${daysLabel}</div>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(title)}</div>
        <div style="font-size:.73rem;color:var(--text-muted)">${item.media_type === 'movie' ? '🎬 Movie' : '📺 TV'} ${score(item) ? '· ⭐ ' + score(item) : ''}</div>
      </div>
    `;
    el.addEventListener('click', () => openModal(item.media_type, item.id, item));
    releaseList.appendChild(el);
  });
}

/* ── WATCHLIST ────────────────────────────────────────────────────── */
async function renderWatchlist(main, token) {
  const statuses = ['watching', 'plantowatch', 'completed', 'hold', 'dropped'];
  main.innerHTML = '';

  if (!state.simklToken) {
    const prompt = document.createElement('div');
    prompt.className = 'simkl-prompt';
    prompt.innerHTML = `
      <span style="font-size:2rem">▶</span>
      <p>Connect Simkl to sync your watchlist, history, and ratings across devices.</p>
      <button class="modal-btn primary" onclick="simklAuth()">Connect Simkl</button>
    `;
    main.appendChild(prompt);
  }

  const filterRow = document.createElement('div');
  filterRow.style.cssText = 'display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap';
  filterRow.innerHTML = `
    <button class="filter-chip${state.wlFilterStatus === 'all' ? ' active' : ''}" onclick="state.wlFilterStatus='all';renderView()">All</button>
    ${statuses.map(s => `<button class="filter-chip${state.wlFilterStatus === s ? ' active' : ''}" onclick="state.wlFilterStatus='${s}';renderView()">${wlStatusLabel(s)}</button>`).join('')}
  `;
  main.appendChild(filterRow);

  const entries = Object.entries(state.watchlist);
  if (!entries.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = '<div class="icon">📋</div>Your list is empty. Browse Trending or Upcoming and add items!';
    main.appendChild(empty);
    return;
  }

  const missing = entries.filter(([key]) => !state.mediaDetails[key]?._full).map(([key]) => key);
  if (missing.length) {
    await promiseAllChunked(missing, async key => {
      const [type, idStr] = key.split('_');
      const id = parseInt(idStr);
      try {
        const detail = await tmdb(`/${type}/${id}`);
        state.mediaDetails[key] = {
          ...(state.mediaDetails[key] || {}),
          title: detail.title || detail.name,
          poster_path: detail.poster_path,
          media_type: type,
          id,
          vote_average: detail.vote_average,
          release_date: detail.release_date,
          first_air_date: detail.first_air_date,
          genre_ids: (detail.genres || []).map(g => g.id),
          _full: true,
        };
      } catch (e) { console.warn('Cache fetch error:', e); }
    }, 5);
    saveMediaDetails();
    if (token !== renderToken) return;
  }

  const renderStatuses = state.wlFilterStatus === 'all' ? statuses : [state.wlFilterStatus];
  renderStatuses.forEach(status => {
    const items = entries.filter(([, s]) => s === status);
    if (!items.length) return;

    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `<div class="section-header"><span class="section-title">${wlStatusLabel(status)} <span style="color:var(--text-muted);font-size:.8rem;font-weight:400">(${items.length})</span></span></div><div class="watchlist-grid"></div>`;
    main.appendChild(sec);

    const grid = sec.querySelector('.watchlist-grid');
    items.forEach(([key]) => {
      const cached = state.mediaDetails[key];
      const item = cached ? { ...cached } : { id: parseInt(key.split('_')[1]), media_type: key.split('_')[0] };
      grid.appendChild(buildCard(item));
    });
  });
}

/* ── RECOMMENDED ──────────────────────────────────────────────────── */
async function renderRecommended(main, token) {
  const hasRatings = Object.keys(state.ratings).length > 0;

  if (!hasRatings) {
    main.innerHTML = `<div class="empty-state"><div class="icon">✨</div>
      <p>Rate some movies and shows to get personalized recommendations!</p>
      <p style="margin-top:8px;font-size:.8rem">Drag the slider on any card to rate 0–10, or try ⚡ Quick Rate.</p></div>`;
    return;
  }

  addSkeletonRow(main, 'Recommended For You ✨');
  addSkeletonRow(main, 'More Like Your Favorites');

  const needGenres = Object.keys(state.ratings)
    .filter(k => !(state.mediaDetails[k]?.genre_ids || []).length)
    .slice(0, 40);

  if (needGenres.length) {
    await promiseAllChunked(needGenres, async key => {
      const [type, idStr] = key.split('_');
      try {
        const detail = await tmdb(`/${type}/${idStr}`);
        state.mediaDetails[key] = {
          ...(state.mediaDetails[key] || {}),
          title: detail.title || detail.name,
          poster_path: detail.poster_path,
          media_type: type,
          id: parseInt(idStr),
          genre_ids: (detail.genres || []).map(g => g.id),
          _full: true,
        };
      } catch (e) { console.warn('Genre backfill error:', e); }
    }, 5);
    saveMediaDetails();
  }

  recomputeAffinity();
  if (token !== renderToken) return;

  const affinity = LS.get('genre_affinity') || {};
  const topGenres = Object.entries(affinity)
    .filter(([, v]) => v > 0)
    .sort(([,a],[,b]) => b - a)
    .slice(0, 3)
    .map(([id]) => id);
  const badGenres = dislikedGenres();

  const fetchRec = async (mediaType, label) => {
    const params = {
      sort_by: 'vote_average.desc',
      'vote_count.gte': 200,
      page: 1,
    };
    if (topGenres.length)  params.with_genres    = topGenres.slice(0, 2).join('|');
    if (badGenres.length)  params.without_genres = badGenres.slice(0, 3).join(',');

    const path = mediaType === 'movie' ? '/discover/movie' : '/discover/tv';
    const pages = await Promise.all([
      tmdb(path, { ...params, page: 1 }),
      tmdb(path, { ...params, page: 2 }),
      tmdb(path, { ...params, sort_by: 'popularity.desc', page: 1 }),
    ]);

    const seen = new Set();
    const results = pages
      .flatMap(p => p.results || [])
      .map(i => ({ ...i, media_type: mediaType }))
      .filter(i => {
        const key = mediaKey(mediaType, i.id);
        if (seen.has(i.id) || state.ratings[key] || state.watchlist[key]) return false;
        seen.add(i.id);
        return true;
      })
      .sort((a, b) => recScore(b, affinity) - recScore(a, affinity))
      .slice(0, 20);

    return { label, results };
  };

  const [recMovies, recTV] = await Promise.all([
    fetchRec('movie', '🎬 Movies For You'),
    fetchRec('tv',    '📺 Shows For You'),
  ]);
  if (token !== renderToken) return;

  main.innerHTML = '';

  const liked    = topGenreNames(3);
  const disliked = Object.entries(affinity).filter(([,v]) => v < -1).map(([id]) => GENRE_MAP[id]).filter(Boolean).slice(0,2).join(', ');
  const summary = document.createElement('div');
  summary.style.cssText = 'background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:.82rem;display:flex;gap:16px;flex-wrap:wrap;align-items:center';
  summary.innerHTML = `
    <span>📊 <strong>${Object.keys(state.ratings).length}</strong> ratings</span>
    ${liked    ? `<span>❤️ Loves: <strong>${esc(liked)}</strong></span>` : ''}
    ${disliked ? `<span>👎 Avoids: <strong>${esc(disliked)}</strong></span>` : ''}
    <button onclick="recomputeAffinity();toast('Taste profile refreshed');renderView();"
      style="margin-left:auto;background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:6px;padding:3px 10px;font-size:.75rem;cursor:pointer">
      Refresh taste profile
    </button>
  `;
  main.appendChild(summary);

  renderRow(main, recMovies.label, recMovies.results, true);
  renderRow(main, recTV.label, recTV.results, true);

  const topRated = Object.entries(state.ratings)
    .filter(([, v]) => v >= 7)
    .sort(([,a],[,b]) => b - a)
    .slice(0, 3);

  for (const [key] of topRated) {
    const [type, idStr] = key.split('_');
    try {
      let title = state.mediaDetails[key]?.title;
      if (!title) {
        const detail = await tmdb(`/${type}/${idStr}`);
        title = detail.title || detail.name;
        state.mediaDetails[key] = { ...state.mediaDetails[key], title, media_type: type, id: parseInt(idStr) };
        saveMediaDetails();
      }
      const data = await tmdb(`/${type}/${idStr}/recommendations`);
      if (token !== renderToken) return;
      const results = (data.results || [])
        .map(i => ({ ...i, media_type: type }))
        .filter(i => !state.ratings[mediaKey(type, i.id)] && !state.watchlist[mediaKey(type, i.id)])
        .slice(0, 12);

      if (results.length) {
        renderRow(main, `Because you loved ${type === 'movie' ? '🎬' : '📺'} ${esc(title)}`, results);
      }
    } catch (e) { console.warn('Recommendations fetch error:', e); }
  }
}

/* ── SEARCH ──────────────────────────────────────────────────────── */
let searchQuery = '';
let searchResults = [];

async function doSearch() {
  searchQuery = document.getElementById('search-input').value.trim();
  if (!searchQuery) return;
  state.searchPage = 1;
  state.view = 'search';
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  renderView();
}
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

async function loadMoreSearchResults() {
  state.searchPage++;
  try {
    const [movies, shows] = await Promise.all([
      tmdb('/search/movie', { query: searchQuery, page: state.searchPage }),
      tmdb('/search/tv',    { query: searchQuery, page: state.searchPage }),
    ]);
    const newResults = [
      ...(movies.results || []).map(m => ({ ...m, media_type: 'movie' })),
      ...(shows.results  || []).map(t => ({ ...t, media_type: 'tv' })),
    ].sort((a, b) => (b.popularity || 0) - (a.popularity || 0));

    searchResults.push(...newResults);
    const main = document.getElementById('main-content');
    document.getElementById('load-more-btn')?.remove();

    if (!newResults.length) { toast('No more results'); return; }
    renderRow(main, `Search results for "${esc(searchQuery)}" (page ${state.searchPage})`, newResults);
    addLoadMoreButton(main);
  } catch (e) {
    console.warn('Load more search error:', e);
    toast('Failed to load more results');
  }
}

function addLoadMoreButton(main) {
  const btn = document.createElement('button');
  btn.id = 'load-more-btn';
  btn.className = 'modal-btn';
  btn.style.cssText = 'display:block;margin:20px auto;padding:10px 24px';
  btn.textContent = 'Load More Results';
  btn.onclick = loadMoreSearchResults;
  main.appendChild(btn);
}

async function renderSearch(main, token) {
  main.innerHTML = '<div class="empty-state"><div class="icon">🔍</div>Searching…</div>';
  try {
    const [movies, shows] = await Promise.all([
      tmdb('/search/movie', { query: searchQuery, page: state.searchPage }),
      tmdb('/search/tv',    { query: searchQuery, page: state.searchPage }),
    ]);
    if (token !== renderToken) return;
    searchResults = [
      ...(movies.results || []).map(m => ({ ...m, media_type: 'movie' })),
      ...(shows.results  || []).map(t => ({ ...t, media_type: 'tv' })),
    ].sort((a, b) => (b.popularity || 0) - (a.popularity || 0));

    main.innerHTML = '';
    if (!searchResults.length) {
      main.innerHTML = `<div class="empty-state"><div class="icon">🔍</div>No results for "${esc(searchQuery)}"</div>`;
      return;
    }
    renderRow(main, `Search results for "${esc(searchQuery)}"`, searchResults);
    addLoadMoreButton(main);
  } catch (e) {
    if (token !== renderToken) return;
    console.warn('Search error:', e);
    main.innerHTML = '<div class="empty-state">Search failed. Try again.</div>';
    toast('Search failed');
  }
}

/* ── QUICK RATE ─────────────────────────────────────────────────────── */
const qrPage = { movie: 0, tv: 0 };
const qrSeen = new Set();

async function fetchQuickRateBatch(type, want = 20) {
  const out = [];
  const path = type === 'movie' ? '/discover/movie' : '/discover/tv';
  const minVotes = type === 'movie' ? 100 : 50;
  let tries = 0;

  while (out.length < want && tries < 5 && qrPage[type] < 500) {
    qrPage[type]++; tries++;
    const data = await tmdb(path, { sort_by: 'popularity.desc', 'vote_count.gte': minVotes, page: qrPage[type] });
    const results = data.results || [];
    if (!results.length) break;

    results.forEach(i => {
      const key = mediaKey(type, i.id);
      if (qrSeen.has(key) || state.ratings[key]) return;
      qrSeen.add(key);
      out.push({ ...i, media_type: type });
    });
  }
  return out;
}

async function renderQuickRate(main, token) {
  addSkeletonRow(main, 'Popular Movies 🎬');
  addSkeletonRow(main, 'Popular TV Shows 📺');

  try {
    qrSeen.clear();
    qrPage.movie = Math.floor(Math.random() * 4);
    qrPage.tv    = Math.floor(Math.random() * 4);

    const [movieItems, tvItems] = await Promise.all([
      fetchQuickRateBatch('movie'),
      fetchQuickRateBatch('tv'),
    ]);
    if (token !== renderToken) return;

    main.innerHTML = '';
    renderQuickRateRow(main, 'Popular Movies 🎬', 'movie', movieItems);
    renderQuickRateRow(main, 'Popular TV Shows 📺', 'tv', tvItems);
  } catch(e) {
    if (token !== renderToken) return;
    main.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>Failed to load: ${esc(e.message)}</p></div>`;
  }
}

function renderQuickRateRow(container, title, type, items) {
  const sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = `
    <div class="section-header"><span class="section-title">${title}</span></div>
    <div class="card-row" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px"></div>
    <div class="qr-empty" style="display:none;color:var(--text-muted);font-size:.85rem;padding:8px 0">Nothing left to rate here — hit Load more.</div>
    <button class="modal-btn qr-more" style="display:block;margin:16px auto 0">Load more</button>`;
  const grid  = sec.querySelector('.card-row');
  const empty = sec.querySelector('.qr-empty');
  const more  = sec.querySelector('.qr-more');

  let loading = false;
  const syncEmpty = () => { empty.style.display = grid.children.length ? 'none' : 'block'; };
  const addItems = list => list.forEach(item => grid.appendChild(buildQuickRateCard(item, onGone)));

  async function loadMore(want) {
    if (loading) return;
    loading = true;
    more.disabled = true;
    try { addItems(await fetchQuickRateBatch(type, want)); }
    catch (e) { console.warn('Quick rate error:', e); toast('Failed to load more'); }
    loading = false;
    more.disabled = false;
    syncEmpty();
  }

  function onGone() {
    syncEmpty();
    if (grid.children.length < 6) loadMore(12);
  }

  more.addEventListener('click', () => loadMore(20));
  addItems(items);
  syncEmpty();
  container.appendChild(sec);
}

function buildQuickRateCard(item, onGone) {
  const type = item.media_type;
  const title = item.title || item.name;
  const poster = item.poster_path ? `${IMG_BASE}${item.poster_path}` : '';
  const year = (item.release_date || item.first_air_date || '').slice(0, 4);

  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = item.id;
  card.dataset.type = type;
  card.style.cssText = 'display:flex;flex-direction:column;gap:8px;flex:initial;transition:opacity .3s, transform .3s';

  card.innerHTML = `
    <div class="qr-poster" style="position:relative;aspect-ratio:2/3;background:var(--surface2);overflow:hidden;cursor:pointer">
      ${poster ? `<img src="${esc(poster)}" alt="${esc(title)}" style="width:100%;height:100%;object-fit:cover" loading="lazy">` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted)">🎬</div>'}
    </div>
    <div style="padding:0 10px 10px">
      <div style="font-weight:600;font-size:0.85rem;line-height:1.3;margin-bottom:4px">${esc(title)}</div>
      <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:8px">${esc(year)} • ${type === 'movie' ? 'Movie' : 'TV'}</div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="thumbs-btn" data-r="10" title="👍 Loved it (10)">👍</button>
        <button class="thumbs-btn" data-r="2" title="👎 Not for me (2)">👎</button>
        <button class="thumbs-btn" data-r="skip" title="Skip — hide without rating">⏭</button>
      </div>
    </div>
  `;

  const dismiss = () => {
    card.style.pointerEvents = 'none';
    card.style.opacity = '0';
    card.style.transform = 'scale(.92)';
    setTimeout(() => { card.remove(); if (onGone) onGone(); }, 300);
  };

  card.querySelector('.qr-poster').addEventListener('click', () => openModal(type, item.id, item));
  card.querySelectorAll('.thumbs-btn').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.r === 'skip') { dismiss(); return; }
    const val = Number(b.dataset.r);
    setRating(type, item.id, val, item.genre_ids || [], item);
    if (state.simklToken) pushRatingToSimkl(type, item.id, val);
    dismiss();
  }));

  return card;
}

/* ── STATS & STORAGE ─────────────────────────────────────────────── */
function getStorageUsage() {
  let totalBytes = 0;
  for (let key in localStorage) {
    if (localStorage.hasOwnProperty(key)) {
      totalBytes += ((localStorage[key].length + key.length) * 2);
    }
  }
  const maxBytes = 5 * 1024 * 1024;
  return {
    bytes: totalBytes,
    kb: (totalBytes / 1024).toFixed(1),
    percent: Math.min(100, ((totalBytes / maxBytes) * 100)).toFixed(1)
  };
}

function clearCache() {
  _cache.clear();

}

function exportData() {
  const data = {
    ratings: state.ratings,
    watchlist: state.watchlist,
    mediaDetails: state.mediaDetails,
    exportDate: new Date().toISOString(),
    version: '1.1'
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `media-calendar-backup-${localISO(new Date())}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Data exported successfully');
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm(`Import ${Object.keys(data.ratings || {}).length} ratings and ${Object.keys(data.watchlist || {}).length} watchlist items? This will merge with existing data.`)) return;

      state.ratings = { ...state.ratings, ...(data.ratings || {}) };
      state.watchlist = { ...state.watchlist, ...(data.watchlist || {}) };
      state.mediaDetails = { ...state.mediaDetails, ...(data.mediaDetails || {}) };

      saveRatings();
      saveWatchlist();
      saveMediaDetails();
      recomputeAffinity();
      toast('Data imported successfully');
      renderView();
    } catch (err) {
      toast('Failed to import: Invalid file format');
      console.error(err);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

/* ─────────────────────────────────────────────────────────────────────
   HELPER UTILITIES: RENDER & FILTER PIPELINES
   ───────────────────────────────────────────────────────────────────── */
async function filterResults(items) {
  let out = items.filter(i => {
    if (state.filterType !== 'all' && i.media_type !== state.filterType) return false;
    if (state.genre && !(i.genre_ids || []).includes(parseInt(state.genre))) return false;
    return true;
  });

  if (state.year) {
    out = out.filter(i => {
      const date = i.release_date || i.first_air_date;
      return date && date.startsWith(state.year);
    });
  }

  if (state.contentRating) {
    out = await promiseAllChunked(out, async item => {
      if (item._contentRating === undefined) {
        item._contentRating = await getContentRating(item.media_type, item.id);
      }
      return item;
    }, 10);
    out = out.filter(i => (i._contentRating || 'NR') === state.contentRating);
  }

  return out;
}

function renderRow(container, title, items, recBadge = false) {
  const sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = `
    <div class="section-header"><span class="section-title">${title}</span></div>
    <div class="row-wrap">
      <button class="row-scroll-btn left" aria-label="Scroll left">&#8249;</button>
      <div class="card-row"></div>
      <button class="row-scroll-btn right" aria-label="Scroll right">&#8250;</button>
    </div>`;

  const row = sec.querySelector('.card-row');

  if (!items.length) {
    sec.querySelector('.row-wrap').outerHTML = `<p style="color:var(--text-muted);font-size:.85rem">No results found.</p>`;
  } else {
    items.forEach(item => {
      const card = buildCard(item);
      if (recBadge) {
        const badge = document.createElement('span');
        badge.className = 'rec-badge';
        badge.style.cssText = 'position:absolute;top:6px;right:6px;';
        badge.textContent = 'For You';
        card.appendChild(badge);
      }
      row.appendChild(card);
    });
  }
  container.appendChild(sec);
}

function addSkeletonRow(container, title) {
  const sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = `<div class="section-header"><span class="section-title">${title}</span></div>
  <div class="card-row">${[...Array(6)].map(() => `<div class="skel-card skeleton"></div>`).join('')}</div>`;

}

   INITIALIZATION
   ───────────────────────────────────────────────────────────────────── */
async function refreshSimklIfNeeded() {
  if (!state.simklToken) return;
  try {
    const lastSync = LS.get('simkl_last_sync') || '2000-01-01T00:00:00.000Z';
    const activities = await simklGet('/sync/activities');
    const latest = [
      activities?.all,
      activities?.tv_shows?.all,
      activities?.movies?.all,
      activities?.tv?.all,
      activities?.tv?.rated_at,
      activities?.movies?.rated_at,
    ].filter(Boolean).sort().pop();

    if (!latest || latest > lastSync) {
      await syncSimklLibrary();
    }
    LS.set('simkl_last_sync', new Date().toISOString());
  } catch(e) {
    console.warn('Simkl activity check error:', e);
  }
}

(async function init() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('theme-toggle').textContent = state.theme === 'dark' ? '🌙' : '☀️';

  if (TMDB_TOKEN.startsWith('__TMDB')) {
    toast('⚠ TMDB token not set — replace placeholder.', 8000);
  }

  const isLocal = window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  if (isLocal) {
    const btn  = document.getElementById('simkl-btn');
    const user = document.getElementById('simkl-user');
    btn.textContent   = 'Simkl (deploy to enable)';
    btn.style.opacity = '0.4';
    btn.style.cursor  = 'not-allowed';
    btn.onclick       = () => toast('Connect Simkl after deploying');
    user.textContent  = '⚠ Running locally';
    user.style.color  = 'var(--text-muted)';
  } else {
    updateSimklUI();
    await handleSimklCallback();
    await refreshSimklIfNeeded();
  }

  renderView();
})();
