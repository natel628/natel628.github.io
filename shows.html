<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV & Movie Calendar</title>
  <style>
    /* ─── Reset & Base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0f;
      --surface: #18181c;
      --surface2: #222228;
      --border: #2e2e38;
      --accent: #e50914;
      --accent2: #f5a623;
      --text: #f0f0f5;
      --text-muted: #8888a0;
      --tag-bg: #2a2a35;
      --star-on: #f5a623;
      --star-off: #444;
      --radius: 10px;
      --card-w: 160px;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; font-family: inherit; }
    img { display: block; }

    /* ─── Top Nav ───────────────────────────────────────────────────── */
    .topnav {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
    }
    .topnav h1 { font-size: 1.2rem; font-weight: 700; color: var(--accent); flex: 0 0 auto; }
    .nav-tabs { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
    .nav-tab {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      transition: all .2s;
    }
    .nav-tab:hover { border-color: var(--accent); color: var(--text); }
    .nav-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .nav-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    #simkl-btn {
      background: #1ce783;
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-weight: 700;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #simkl-btn:hover { filter: brightness(1.1); }
    #simkl-user { font-size: 0.8rem; color: #1ce783; }

    /* ─── Search bar ────────────────────────────────────────────────── */
    .search-wrap {
      padding: 14px 24px 0;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #search-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      color: var(--text);
      font-size: 0.9rem;
      width: 280px;
      outline: none;
    }
    #search-input:focus { border-color: var(--accent); }
    #search-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-weight: 600;
    }
    #search-btn:hover { filter: brightness(1.15); }

    /* ─── Filter row ────────────────────────────────────────────────── */
    .filter-row {
      display: flex;
      gap: 8px;
      padding: 12px 24px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-label { font-size: 0.8rem; color: var(--text-muted); margin-right: 4px; }
    .filter-chip {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all .15s;
    }
    .filter-chip:hover, .filter-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    select.filter-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.82rem;
      outline: none;
      cursor: pointer;
    }

    /* ─── Main layout ───────────────────────────────────────────────── */
    .main { padding: 16px 24px 40px; }
    .section { margin-bottom: 36px; }
    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .section-title { font-size: 1.05rem; font-weight: 700; }
    .see-all { font-size: 0.8rem; color: var(--accent); margin-left: auto; cursor: pointer; }
    .see-all:hover { text-decoration: underline; }

    /* ─── Horizontal scroll row ─────────────────────────────────────── */
    .card-row {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 10px;
      scroll-snap-type: x mandatory;
    }
    .card-row::-webkit-scrollbar { height: 4px; }
    .card-row::-webkit-scrollbar-track { background: var(--surface); }
    .card-row::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ─── Card ──────────────────────────────────────────────────────── */
    .card {
      flex: 0 0 var(--card-w);
      scroll-snap-align: start;
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      position: relative;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
    .card-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      background: var(--surface2);
    }
    .card-poster-placeholder {
      width: 100%;
      aspect-ratio: 2/3;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    .card-body { padding: 8px 10px 10px; }
    .card-title {
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta { font-size: 0.73rem; color: var(--text-muted); display: flex; gap: 6px; flex-wrap: wrap; }
    .card-score {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent2);
    }
    .card-date { font-size: 0.73rem; color: var(--text-muted); }
    .card-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .card-badge.tv { background: #1a6ef5; }
    .card-badge.movie { background: var(--accent); }
    /* My rating stars on card */
    .card-stars { display: flex; gap: 2px; margin-top: 5px; }
    .card-stars .star {
      font-size: 0.82rem;
      color: var(--star-off);
      cursor: pointer;
      transition: color .1s;
    }
    .card-stars .star.on { color: var(--star-on); }

    /* ─── Calendar grid ─────────────────────────────────────────────── */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .cal-day-header {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding: 4px 0;
      font-weight: 600;
    }
    .cal-day {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      min-height: 90px;
      padding: 6px;
      font-size: 0.75rem;
      position: relative;
    }
    .cal-day.today { border-color: var(--accent); }
    .cal-day-num {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .cal-day.today .cal-day-num { color: var(--accent); }
    .cal-item {
      background: var(--tag-bg);
      border-radius: 4px;
      padding: 2px 5px;
      margin-bottom: 3px;
      font-size: 0.68rem;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: background .15s;
    }
    .cal-item:hover { background: var(--accent); }
    .cal-item.movie { border-left: 3px solid var(--accent); }
    .cal-item.tv { border-left: 3px solid #1a6ef5; }
    .cal-item.my-show { border-left: 3px solid #1ce783; background: rgba(28,231,131,.12); }
    .cal-month-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .cal-month-nav button {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 12px;
    }
    .cal-month-nav button:hover { border-color: var(--accent); }
    #cal-month-label { font-weight: 700; font-size: 1rem; min-width: 160px; text-align: center; }

    /* ─── Watchlist panel ───────────────────────────────────────────── */
    .watchlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr));
      gap: 14px;
    }

    /* ─── Modal / detail overlay ────────────────────────────────────── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #modal-overlay.open { display: flex; }
    #modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    #modal-close {
      position: sticky;
      top: 0;
      float: right;
      background: var(--surface2);
      border: none;
      color: var(--text);
      font-size: 1.2rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      margin: 10px 10px 0 0;
      z-index: 10;
    }
    .modal-inner { padding: 20px 24px 28px; }
    .modal-hero {
      display: flex;
      gap: 20px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .modal-poster {
      width: 130px;
      border-radius: 8px;
      flex-shrink: 0;
      object-fit: cover;
      aspect-ratio: 2/3;
      background: var(--surface2);
    }
    .modal-info { flex: 1; min-width: 180px; }
    .modal-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
    .modal-tagline { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; font-style: italic; }
    .modal-meta { font-size: 0.82rem; color: var(--text-muted); display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .modal-genres { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .genre-tag {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.78rem;
    }
    .modal-overview { font-size: 0.88rem; line-height: 1.6; color: var(--text-muted); margin-bottom: 16px; }
    .modal-scores { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .score-box {
      background: var(--surface2);
      border-radius: 8px;
      padding: 8px 14px;
      text-align: center;
    }
    .score-box .score-val { font-size: 1.1rem; font-weight: 700; color: var(--accent2); }
    .score-box .score-lbl { font-size: 0.7rem; color: var(--text-muted); }
    .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .modal-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.84rem;
      transition: all .15s;
    }
    .modal-btn:hover { border-color: var(--accent); color: var(--accent); }
    .modal-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .modal-btn.primary:hover { filter: brightness(1.1); }
    /* My Rating row */
    .my-rating-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .my-rating-label { font-size: 0.85rem; font-weight: 600; }
    .rating-stars { display: flex; gap: 4px; }
    .rating-stars .star {
      font-size: 1.3rem;
      color: var(--star-off);
      cursor: pointer;
      transition: color .1s, transform .1s;
    }
    .rating-stars .star:hover, .rating-stars .star.on { color: var(--star-on); }
    .rating-stars .star:hover { transform: scale(1.2); }
    .rating-val { font-size: 0.85rem; color: var(--text-muted); }
    /* Similar / Recommended */
    .modal-similar-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; color: var(--text-muted); }

    /* ─── Notifications toast ───────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.88rem;
      z-index: 300;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity .3s, transform .3s;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* ─── Skeleton loader ───────────────────────────────────────────── */
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skel-card {
      flex: 0 0 var(--card-w);
      height: 260px;
      border-radius: var(--radius);
    }

    /* ─── Responsiveness ────────────────────────────────────────────── */
    @media (max-width: 700px) {
      :root { --card-w: 130px; }
      .cal-grid { grid-template-columns: repeat(3, 1fr); }
      .cal-day-header:nth-child(n+4) { display: none; }
    }

    /* ─── Recommendations tag badges ────────────────────────────────── */
    .rec-badge {
      background: #1a6ef5;
      color: #fff;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    /* ─── Section tabs (TV / Movies / Both) ─────────────────────────── */
    .type-pills { display: flex; gap: 6px; }
    .type-pill {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 14px;
      padding: 4px 12px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all .15s;
    }
    .type-pill.active { background: var(--surface2); border-color: var(--accent2); color: var(--accent2); }

    /* ─── Watchlist status menu ─────────────────────────────────────── */
    .wl-status {
      font-size: 0.7rem;
      background: var(--tag-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 3px 7px;
      margin-top: 5px;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }
    .wl-status.watching { color: #1ce783; border-color: #1ce783; }
    .wl-status.completed { color: var(--accent2); border-color: var(--accent2); }
    .wl-status.plantowatch { color: #1a6ef5; border-color: #1a6ef5; }

    /* ─── Empty state ───────────────────────────────────────────────── */
    .empty-state {
      padding: 48px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

    /* ─── Simkl connect prompt ──────────────────────────────────────── */
    .simkl-prompt {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .simkl-prompt p { flex: 1; font-size: 0.88rem; color: var(--text-muted); }
  </style>
</head>
<body>

<!-- ═══ TOP NAV ═══════════════════════════════════════════════════════ -->
<nav class="topnav">
  <h1>📺 Media Calendar</h1>
  <div class="nav-tabs">
    <button class="nav-tab active" data-view="trending">🔥 Trending</button>
    <button class="nav-tab" data-view="calendar">📅 Calendar</button>
    <button class="nav-tab" data-view="upcoming">🎬 Upcoming</button>
    <button class="nav-tab" data-view="watchlist">⭐ My List</button>
    <button class="nav-tab" data-view="recommended">✨ For You</button>
  </div>
  <div class="nav-right">
    <span id="simkl-user"></span>
    <button id="simkl-btn" onclick="simklAuth()">
      <span>▶</span> Connect Simkl
    </button>
  </div>
</nav>

<!-- ═══ SEARCH ════════════════════════════════════════════════════════ -->
<div class="search-wrap">
  <input id="search-input" type="text" placeholder="Search movies & shows…" />
  <button id="search-btn" onclick="doSearch()">Search</button>
</div>

<!-- ═══ FILTER ROW ════════════════════════════════════════════════════ -->
<div class="filter-row" id="filter-row">
  <span class="filter-label">Type:</span>
  <span class="filter-chip active" data-filter-type="all">All</span>
  <span class="filter-chip" data-filter-type="movie">Movies</span>
  <span class="filter-chip" data-filter-type="tv">TV</span>
  <span class="filter-label" style="margin-left:12px">Genre:</span>
  <select class="filter-select" id="genre-filter">
    <option value="">Any Genre</option>
    <option value="28">Action</option>
    <option value="35">Comedy</option>

    <option value="53">Thriller</option>
    <option value="16">Animation</option>
    <option value="12">Adventure</option>

  </select>
  <select class="filter-select" id="sort-filter">
    <option value="popularity.desc">Most Popular</option>
    <option value="vote_average.desc">Highest Rated</option>
    <option value="release_date.desc">Newest</option>
    <option value="release_date.asc">Oldest</option>
  </select>
  <select class="filter-select" id="provider-filter">
    <option value="">Any Streaming Service</option>
    <option value="8">Netflix</option>
    <option value="9">Amazon Prime</option>
    <option value="337">Disney+</option>
    <option value="1899">Max (HBO)</option>
    <option value="15">Hulu</option>
    <option value="386">Peacock</option>
    <option value="387">Peacock Premium</option>
    <option value="531">Paramount+</option>
    <option value="350">Apple TV+</option>
    <option value="2">Apple TV</option>
  </select>
</div>

<!-- ═══ MAIN CONTENT ══════════════════════════════════════════════════ -->
<main class="main" id="main-content">
  <!-- Views injected here by JS -->
</main>

<!-- ═══ MODAL ════════════════════════════════════════════════════════ -->
<div id="modal-overlay" role="dialog" aria-modal="true" aria-label="Media details">
  <div id="modal-box">
    <button id="modal-close" aria-label="Close" onclick="closeModal()">✕</button>
    <div class="modal-inner" id="modal-inner"></div>
  </div>
</div>

<!-- ═══ TOAST ════════════════════════════════════════════════════════ -->
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ─────────────────────────────────────────────────────────────────────

/* ─────────────────────────────────────────────────────────────────────
   STATE
   ───────────────────────────────────────────────────────────────────── */
const LS = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v)),
};

let state = {
  view: 'trending',
  filterType: 'all',
  genre: '',
  sort: 'popularity.desc',
  provider: '',
  simklToken: LS.get('simkl_token'),
  simklUser: LS.get('simkl_user'),
  ratings: LS.get('my_ratings') || {},
  watchlist: LS.get('my_watchlist') || {},
  simklLibrary: LS.get('simkl_library') || [],
  calYear: new Date().getFullYear(),
  calMonth: new Date().getMonth(),
};

function saveRatings()   { LS.set('my_ratings',    state.ratings); }
function saveWatchlist() { LS.set('my_watchlist',  state.watchlist); }
function saveSimkl()     { LS.set('simkl_token',   state.simklToken); LS.set('simkl_user', state.simklUser); }

/* ─────────────────────────────────────────────────────────────────────
   TMDB API
   ───────────────────────────────────────────────────────────────────── */
async function tmdb(path, params = {}) {
  const url = new URL(TMDB_BASE + path);
  url.searchParams.set('language', 'en-US');
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url, {
    headers: { Authorization: `Bearer ${TMDB_TOKEN}` }
  });
  if (!res.ok) throw new Error(`TMDB ${res.status}: ${path}`);
  return res.json();
}

// Fetch streaming providers for a title (US region)
async function getProviders(type, id) {
  try {
    const data = await tmdb(`/${type}/${id}/watch/providers`);
    const us = data.results && data.results.US;
    if (!us) return null;
    return {
      flatrate: us.flatrate || [],   // subscription (Netflix, Hulu, etc.)
      rent:     us.rent     || [],
      buy:      us.buy      || [],
      link:     us.link     || '',
    };
  } catch { return null; }
}

/* ─────────────────────────────────────────────────────────────────────
   SIMKL OAuth2 PKCE
   ───────────────────────────────────────────────────────────────────── */
function base64urlEncode(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function pkceChallenge() {
  const verifier = base64urlEncode(crypto.getRandomValues(new Uint8Array(32)));
  const digest   = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return { verifier, challenge: base64urlEncode(digest) };
}

async function simklAuth() {
  if (state.simklToken) { simklDisconnect(); return; }
  const { verifier, challenge } = await pkceChallenge();
  LS.set('pkce_verifier', verifier);
  const params = new URLSearchParams({
    response_type: 'code',
    client_id: SIMKL_CLIENT_ID,
    redirect_uri: SIMKL_REDIRECT,
    code_challenge: challenge,
    code_challenge_method: 'S256',
    scope: 'public media:read media:write',
  });
  window.location.href = `${SIMKL_AUTH_URL}?${params}`;
}

function simklDisconnect() {
  state.simklToken  = null;
  state.simklUser   = null;
  state.simklLibrary = [];
  LS.set('simkl_token', null);
  LS.set('simkl_user', null);
  LS.set('simkl_library', []);
  LS.set('pkce_verifier', null);
  updateSimklUI();
  toast('Disconnected from Simkl');
  renderView();
}

async function handleSimklCallback() {
  const params   = new URLSearchParams(window.location.search);
  const code     = params.get('code');
  const verifier = LS.get('pkce_verifier');
  if (!code || !verifier) return;

  // Clean URL
  window.history.replaceState({}, '', window.location.pathname);

  try {
    const res = await fetch(`${SIMKL_TOKEN_URL}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        grant_type: 'authorization_code',
        code,
        client_id: SIMKL_CLIENT_ID,
        redirect_uri: SIMKL_REDIRECT,
        code_verifier: verifier,
      }),
    });
    if (!res.ok) throw new Error('Token exchange failed');
    const data = await res.json();
    state.simklToken = data.access_token;
    LS.set('pkce_verifier', null);
    saveSimkl();
    await loadSimklUser();
    await syncSimklLibrary();
    toast('✅ Connected to Simkl!');
    renderView();
  } catch (e) {
    toast('❌ Simkl login failed: ' + e.message);
  }
}

async function simklGet(path, params = {}) {
  const url = new URL(SIMKL_API + path);
  url.searchParams.set('client_id', SIMKL_CLIENT_ID);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const headers = { 'Content-Type': 'application/json' };
  if (state.simklToken) headers['Authorization'] = `Bearer ${state.simklToken}`;
  const res = await fetch(url, { headers });
  if (!res.ok) throw new Error(`Simkl ${res.status}`);
  return res.json();
}

async function simklPost(path, body) {
  const res = await fetch(SIMKL_API + path, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${state.simklToken}`,
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`Simkl POST ${res.status}`);
  return res.json();
}

async function loadSimklUser() {
  try {
    const data = await simklGet('/users/settings');
    state.simklUser = data.user?.name || 'Simkl User';
    saveSimkl();
    updateSimklUI();
  } catch {}
}

async function syncSimklLibrary() {
  if (!state.simklToken) return;
  try {
    const [movies, shows] = await Promise.all([
      simklGet('/sync/all-items/movies/all'),
      simklGet('/sync/all-items/shows/all'),
    ]);
    const lib = [
      ...(movies?.movies || []).map(m => ({ ...m, media_type: 'movie' })),
      ...(shows?.shows   || []).map(s => ({ ...s, media_type: 'tv' })),
    ];
    state.simklLibrary = lib;
    LS.set('simkl_library', lib);

    // Mirror Simkl ratings into local ratings
    lib.forEach(item => {
      if (item.user_rating) {
        const key = mediaKey(item.media_type, item.movie?.ids?.tmdb || item.show?.ids?.tmdb);
        if (key) state.ratings[key] = item.user_rating;
      }
    });
    saveRatings();
    toast(`Synced ${lib.length} items from Simkl`);
  } catch (e) {
    toast('Simkl sync failed: ' + e.message);
  }
}

function updateSimklUI() {
  const btn  = document.getElementById('simkl-btn');
  const user = document.getElementById('simkl-user');
  if (state.simklToken && state.simklUser) {
    btn.textContent  = 'Disconnect';
    btn.style.background = '#444';
    user.textContent = `👤 ${state.simklUser}`;
  } else {
    btn.innerHTML    = '<span>▶</span> Connect Simkl';
    btn.style.background = '#1ce783';
    user.textContent = '';
  }
}

/* ─────────────────────────────────────────────────────────────────────
   SIMKL WRITE-BACK
   ───────────────────────────────────────────────────────────────────── */
async function pushRatingToSimkl(mediaType, tmdbId, rating) {
  if (!state.simklToken || !tmdbId) return;
  const body = {};
  const item = { ids: { tmdb: tmdbId }, rating };
  if (mediaType === 'movie') body.movies = [item];
  else body.shows = [item];
  try {
    await simklPost('/sync/ratings', body);
  } catch {}
}

async function pushWatchlistToSimkl(mediaType, tmdbId, status) {
  if (!state.simklToken || !tmdbId) return;
  const simklStatus = { watching: 'watching', plantowatch: 'plantowatch', completed: 'completed', dropped: 'dropped', hold: 'hold' }[status] || 'plantowatch';
  const body = {};
  const item = { ids: { tmdb: tmdbId }, to: simklStatus };
  if (mediaType === 'movie') body.movies = [item];
  else body.shows = [item];
  try {
    await simklPost('/sync/add-to-list', body);
  } catch {}
}

/* ─────────────────────────────────────────────────────────────────────
   HELPERS
   ───────────────────────────────────────────────────────────────────── */
function mediaKey(type, id)   { return `${type}_${id}`; }
function getRating(type, id)  { return state.ratings[mediaKey(type, id)] || 0; }
function getWlStatus(type, id){ return state.watchlist[mediaKey(type, id)] || ''; }

function formatDate(d) {
  if (!d) return '';
  return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function score(item) {
  const v = item.vote_average || 0;
  return v > 0 ? v.toFixed(1) : '';
}

function posterUrl(path) {
  return path ? IMG_BASE + path : null;
}

function isInWatchlist(type, id) {
  return !!state.watchlist[mediaKey(type, id)];
}

function toast(msg, duration = 3000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), duration);
}

/* ─────────────────────────────────────────────────────────────────────
   RECOMMENDATION ENGINE
   Weighted score = TMDB popularity + vote_avg + genre affinity from ratings
   ───────────────────────────────────────────────────────────────────── */
function buildGenreAffinityMap() {
  // Already cached genre details stored on items in the library/ratings
  const affinity = {};
  const stored   = LS.get('genre_affinity') || {};
  return stored; // populated as user rates items
}

function updateGenreAffinity(genres, rating) {
  const affinity = LS.get('genre_affinity') || {};
  genres.forEach(g => {
    affinity[g.id] = (affinity[g.id] || 0) + (rating - 5); // +/- from neutral
  });
  LS.set('genre_affinity', affinity);
}

function recScore(item) {
  const affinity = LS.get('genre_affinity') || {};
  const myKey    = mediaKey(item.media_type || (item.title ? 'movie' : 'tv'), item.id);
  const myRating = state.ratings[myKey] || 0;

  let genreBoost = 0;
  if (item.genre_ids) {
    item.genre_ids.forEach(gid => { genreBoost += (affinity[gid] || 0); });
  }

  const pop   = (item.popularity || 0) / 100;
  const vote  = (item.vote_average || 0) * 10;
  const rated = myRating > 0 ? myRating * 5 : 0;

  return pop + vote + genreBoost * 3 + rated;
}

/* ─────────────────────────────────────────────────────────────────────
   CARD BUILDER
   ───────────────────────────────────────────────────────────────────── */
function buildCard(item, opts = {}) {
  const type     = item.media_type || (item.title ? 'movie' : 'tv');
  const id       = item.id;
  const title    = item.title || item.name || 'Unknown';
  const date     = item.release_date || item.first_air_date || '';
  const year     = date ? date.slice(0, 4) : '';
  const poster   = posterUrl(item.poster_path);
  const myRating = getRating(type, id);
  const wlStatus = getWlStatus(type, id);
  const sc       = score(item);

  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = id;
  card.dataset.type = type;
  card.setAttribute('tabindex', '0');
  card.setAttribute('role', 'button');
  card.setAttribute('aria-label', `View details for ${title}`);

  card.innerHTML = `
    <span class="card-badge ${type}">${type === 'movie' ? '🎬' : '📺'}</span>
    ${poster
      ? `<img class="card-poster" src="${poster}" alt="${title}" loading="lazy" />`
      : `<div class="card-poster-placeholder">🎬</div>`}
    <div class="card-body">
      <div class="card-title">${title}</div>
      <div class="card-meta">
        ${year ? `<span>${year}</span>` : ''}
        ${sc ? `<span class="card-score">⭐ ${sc}</span>` : ''}
      </div>
      <div class="card-stars" role="group" aria-label="My rating">
        ${[1,2,3,4,5].map(n => `
          <span class="star${myRating >= n*2 ? ' on' : ''}" data-val="${n*2}" aria-label="${n*2} stars">★</span>
        `).join('')}
      </div>
      ${wlStatus ? `<div class="wl-status ${wlStatus}" title="${wlStatus}">${wlStatusLabel(wlStatus)}</div>` : ''}
    </div>
  `;

  // Click → open modal
  card.addEventListener('click', e => {
    if (!e.target.classList.contains('star')) openModal(type, id, item);
  });
  card.addEventListener('keydown', e => {
    if (e.key === 'Enter') openModal(type, id, item);
  });

  // Stars
  card.querySelectorAll('.card-stars .star').forEach(star => {
    star.addEventListener('click', e => {
      e.stopPropagation();
      const val = parseInt(star.dataset.val);
      setRating(type, id, val, item.genre_ids);
      // re-render stars
      card.querySelectorAll('.card-stars .star').forEach((s, i) => {
        s.classList.toggle('on', val >= parseInt(s.dataset.val));
      });
      if (state.simklToken) pushRatingToSimkl(type, id, val);
    });
  });

  return card;
}

function wlStatusLabel(s) {
  return { watching: '▶ Watching', completed: '✅ Completed', plantowatch: '🔖 Plan to Watch', hold: '⏸ On Hold', dropped: '❌ Dropped' }[s] || s;
}

function setRating(type, id, val, genreIds) {
  const key = mediaKey(type, id);
  state.ratings[key] = val;
  saveRatings();
  if (genreIds) {
    // Convert genre_ids to genre objects (minimal)
    updateGenreAffinity(genreIds.map(gid => ({ id: gid })), val);
  }
  toast(`Rated ${val / 2}/5 ⭐`);
}

async function openModal(type, id, basicItem = {}) {
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal-inner').innerHTML = `
    <div class="skeleton" style="height:200px;border-radius:8px;margin-bottom:16px"></div>
    <div class="skeleton" style="height:20px;width:60%;border-radius:4px;margin-bottom:8px"></div>
    <div class="skeleton" style="height:80px;border-radius:4px"></div>
  `;

  try {
    const apiPath = type === 'movie' ? `/movie/${id}` : `/tv/${id}`;
    const [detail, credits, providers] = await Promise.all([
      tmdb(apiPath),
      tmdb(`${apiPath}/credits`).catch(() => ({ cast: [] })),
      getProviders(type, id),
    ]);
    renderModal(type, detail, credits, providers);
  } catch (e) {
    document.getElementById('modal-inner').innerHTML = `<p style="padding:20px;color:var(--text-muted)">Could not load details: ${e.message}</p>`;
  }
}

async function loadSimilar(type, id) {
  try {
    const data = await tmdb(`/${type}/${id}/similar`);
    const items = (data.results || []).slice(0, 8);
    if (!items.length) return;
    const wrap = document.getElementById('modal-similar');
    if (!wrap) return;
    wrap.innerHTML = `<div class="modal-similar-title">Similar</div><div class="card-row" id="similar-row"></div>`;
    const row = document.getElementById('similar-row');
    items.forEach(item => {
      item.media_type = type;
      row.appendChild(buildCard(item));
    });
  } catch {}
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ─────────────────────────────────────────────────────────────────────
   WATCHLIST MANAGEMENT
   ───────────────────────────────────────────────────────────────────── */
function addToWatchlist(type, id, status) {
  const key = mediaKey(type, id);
  state.watchlist[key] = status;
  saveWatchlist();
  toast(`Added to ${wlStatusLabel(status)}`);
  if (state.simklToken) pushWatchlistToSimkl(type, id, status);
  closeModal();
}

function removeFromWatchlist(type, id) {
  const key = mediaKey(type, id);
  delete state.watchlist[key];
  saveWatchlist();
  toast('Removed from list');
  closeModal();
}

/* ─────────────────────────────────────────────────────────────────────
   VIEWS
   ───────────────────────────────────────────────────────────────────── */
async function renderView() {
  updateSimklUI();
  const main = document.getElementById('main-content');

  // Nav tab highlight
  document.querySelectorAll('.nav-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === state.view);
  });

  main.innerHTML = '';

  switch (state.view) {
    case 'trending':   await renderTrending(main);   break;
    case 'calendar':   await renderCalendar(main);   break;
    case 'upcoming':   await renderUpcoming(main);   break;
    case 'watchlist':  renderWatchlist(main);         break;
    case 'recommended':await renderRecommended(main); break;
    case 'search':     await renderSearch(main);      break;
  }
}

/* ── TRENDING ─────────────────────────────────────────────────────── */
async function renderTrending(main) {
  addSkeletonRow(main, 'Trending This Week 🔥');
  addSkeletonRow(main, 'Popular Movies 🎬');
  addSkeletonRow(main, 'Popular TV Shows 📺');

  try {
    const providerParam = state.provider
      ? { watch_region: 'US', with_watch_providers: state.provider }
      : {};

    const [trending, popMovies, popTV, onAir] = await Promise.all([
      tmdb('/trending/all/week'),
      tmdb('/discover/movie', { sort_by: state.sort, 'vote_count.gte': 100, ...providerParam, ...(state.genre ? { with_genres: state.genre } : {}) }),
      tmdb('/discover/tv',    { sort_by: state.sort, 'vote_count.gte': 50,  ...providerParam, ...(state.genre ? { with_genres: state.genre } : {}) }),
      tmdb('/tv/on_the_air'),
    ]);

    main.innerHTML = '';
    renderRow(main, 'Trending This Week 🔥', trending.results || []);
    renderRow(main, 'Popular Movies 🎬',     filterResults((popMovies.results || []).map(m => ({...m, media_type:'movie'}))));
    renderRow(main, 'Popular TV Shows 📺',   filterResults((popTV.results    || []).map(t => ({...t, media_type:'tv'}))));
    renderRow(main, 'Currently On Air 📡',   filterResults((onAir.results    || []).map(t => ({...t, media_type:'tv'}))));
  } catch(e) {
    main.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>Failed to load: ${e.message}</p><p style="margin-top:8px;font-size:.8rem">Check that your TMDB token is valid.</p></div>`;
  }
}

/* ── CALENDAR ─────────────────────────────────────────────────────── */
async function renderCalendar(main) {
  main.innerHTML = `
    <div class="section">
      <div class="cal-month-nav">
        <button onclick="calPrev()">◀ Prev</button>
        <span id="cal-month-label"></span>
        <button onclick="calNext()">Next ▶</button>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;font-size:.78rem;color:var(--text-muted);align-items:center">
        <span>Legend:</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#1a6ef5;border-radius:2px;margin-right:4px"></span>TV Episode</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:2px;margin-right:4px"></span>Movie Release</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#1ce783;border-radius:2px;margin-right:4px"></span>My Watchlist</span>
        ${!state.simklToken ? `<span style="margin-left:auto;color:var(--accent)">⚠ <a href="#" onclick="simklAuth();return false" style="color:var(--accent)">Connect Simkl</a> to see your shows</span>` : '<span style="margin-left:auto;color:#1ce783">✓ Simkl connected</span>'}
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div id="cal-loading" style="text-align:center;padding:20px;color:var(--text-muted);font-size:.85rem"></div>
    </div>`;

  buildCalendarGrid();
  await populateCalendar();
}

function calPrev() {
  state.calMonth--;
  if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
  buildCalendarGrid();
  populateCalendar();
}
function calNext() {
  state.calMonth++;
  if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
  buildCalendarGrid();
  populateCalendar();
}

function buildCalendarGrid() {
  const label = document.getElementById('cal-month-label');
  const grid  = document.getElementById('cal-grid');
  if (!label || !grid) return;

  const monthName = new Date(state.calYear, state.calMonth, 1)
    .toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  label.textContent = monthName;

  const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const firstDay = new Date(state.calYear, state.calMonth, 1).getDay();
  const numDays  = new Date(state.calYear, state.calMonth + 1, 0).getDate();
  const today    = new Date();

  let html = days.map(d => `<div class="cal-day-header">${d}</div>`).join('');
  for (let i = 0; i < firstDay; i++) html += '<div></div>';
  for (let d = 1; d <= numDays; d++) {
    const isToday = today.getFullYear() === state.calYear &&
                    today.getMonth() === state.calMonth &&
                    today.getDate() === d;
    const dateStr = `${state.calYear}-${String(state.calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    html += `<div class="cal-day${isToday ? ' today' : ''}" data-date="${dateStr}">
      <div class="cal-day-num">${d}</div>
    </div>`;
  }
  grid.innerHTML = html;
}

// Place an item pill on the calendar grid
function addCalItem(dateStr, label, cssClass, tooltip, onClick) {
  const cell = document.querySelector(`.cal-day[data-date="${dateStr}"]`);
  if (!cell) return;
  const div = document.createElement('div');
  div.className = `cal-item ${cssClass}`;
  div.textContent = label;
  div.title = tooltip || label;
  if (onClick) div.addEventListener('click', e => { e.stopPropagation(); onClick(); });
  cell.appendChild(div);
}

async function populateCalendar() {
  const yr   = state.calYear;
  const mo   = String(state.calMonth + 1).padStart(2, '0');
  const dateFrom = `${yr}-${mo}-01`;
  const dateTo   = `${yr}-${mo}-31`;
  const loading  = document.getElementById('cal-loading');
  if (loading) loading.textContent = 'Loading…';

  let itemCount = 0;

  // ── 1. TMDB movie releases for this month ──────────────────────────
  try {
    const movies = await tmdb('/discover/movie', {
      'primary_release_date.gte': dateFrom,
      'primary_release_date.lte': dateTo,
      sort_by: 'popularity.desc',
      'vote_count.gte': 10,
      page: 1,
    });
    (movies.results || []).forEach(m => {
      if (!m.release_date) return;
      addCalItem(
        m.release_date,
        m.title,
        'movie',
        `🎬 ${m.title} — ${formatDate(m.release_date)}`,
        () => openModal('movie', m.id, m)
      );
      itemCount++;
    });
  } catch(e) { console.warn('TMDB movies calendar failed:', e); }

  // ── 2. Simkl CDN calendar — no auth needed, has episode air dates ──
  // Simkl calendar endpoint: /calendar/{year}/{month}/tv.json
  try {
    const simklCalUrl = `https://api.simkl.com/calendar/${yr}/${mo}/tv.json?client_id=${SIMKL_CLIENT_ID}`;
    const res = await fetch(simklCalUrl);
    if (res.ok) {
      const calData = await res.json();
      // Response is an array of { date, episodes: [{ show, episode }] }
      (calData || []).forEach(dayEntry => {
        const dateStr = dayEntry.date ? dayEntry.date.slice(0, 10) : null;
        if (!dateStr) return;
        (dayEntry.episodes || []).forEach(ep => {
          const showTitle = ep.show?.title || ep.title || 'Unknown Show';
          const epNum     = ep.episode ? `S${String(ep.episode.season||0).padStart(2,'0')}E${String(ep.episode.episode||0).padStart(2,'0')}` : '';
          addCalItem(
            dateStr,
            showTitle,
            'tv',
            `📺 ${showTitle} ${epNum}`,
            null
          );
          itemCount++;
        });
      });
    }
  } catch(e) { console.warn('Simkl public calendar failed:', e); }

  // ── 3. Personal watchlist shows — pull episode schedule from TMDB ──
  // For each show in the user's watchlist, fetch upcoming episodes
  if (Object.keys(state.watchlist).length > 0) {
    const watchedShows = Object.entries(state.watchlist)
      .filter(([key]) => key.startsWith('tv_'))
      .map(([key]) => parseInt(key.replace('tv_', '')));

    await Promise.allSettled(watchedShows.map(async (showId) => {
      try {
        // Get the next episode to air
        const detail = await tmdb(`/tv/${showId}`);
        const next = detail.next_episode_to_air;
        if (next && next.air_date) {
          const cell = document.querySelector(`.cal-day[data-date="${next.air_date}"]`);
          if (cell) {
            const epLabel = `S${String(next.season_number).padStart(2,'0')}E${String(next.episode_number).padStart(2,'0')}`;
            addCalItem(
              next.air_date,
              detail.name,
              'tv my-show',
              `⭐ ${detail.name} ${epLabel} — ${next.name || ''}`,
              () => openModal('tv', showId, detail)
            );
            itemCount++;
          }
        }
      } catch {}
    }));
  }

  // ── 4. Simkl library shows (when connected) ────────────────────────
  // Pull next episode dates for shows in your Simkl library
  if (state.simklToken && state.simklLibrary.length) {
    const simklShows = state.simklLibrary
      .filter(i => i.media_type === 'tv' && i.show?.ids?.tmdb)
      .slice(0, 30); // cap to avoid rate limiting

    await Promise.allSettled(simklShows.map(async (libItem) => {
      const tmdbId = libItem.show.ids.tmdb;
      // Skip if already added via personal watchlist
      if (state.watchlist[`tv_${tmdbId}`]) return;
      try {
        const detail = await tmdb(`/tv/${tmdbId}`);
        const next = detail.next_episode_to_air;
        if (next && next.air_date) {
          const epLabel = `S${String(next.season_number).padStart(2,'0')}E${String(next.episode_number).padStart(2,'0')}`;
          addCalItem(
            next.air_date,
            detail.name,
            'tv my-show',
            `⭐ ${detail.name} ${epLabel} (Simkl)`,
            () => openModal('tv', tmdbId, detail)
          );
          itemCount++;
        }
      } catch {}
    }));
  }

  if (loading) {
    loading.textContent = itemCount > 0
      ? `${itemCount} events loaded`
      : 'No events found for this month. Connect Simkl or add shows to your watchlist to see episode air dates.';
  }
}

/* ── UPCOMING ─────────────────────────────────────────────────────── */
async function renderUpcoming(main) {
  addSkeletonRow(main, 'Upcoming Movies 🎬');
  addSkeletonRow(main, 'New TV Premieres 📺');

  const [upMovies, tvPrem] = await Promise.all([
    tmdb('/movie/upcoming'),
    tmdb('/tv/on_the_air'),
  ]);

  main.innerHTML = '';
  const movies = (upMovies.results || []).map(m => ({...m, media_type:'movie'}));
  const shows  = (tvPrem.results  || []).map(t => ({...t, media_type:'tv'}));

  renderRow(main, 'Upcoming Movies 🎬', filterResults(movies));
  renderRow(main, 'Shows On Air 📺', filterResults(shows));

  // Release schedule list
  const listSection = document.createElement('div');
  listSection.className = 'section';
  listSection.innerHTML = `
    <div class="section-header"><span class="section-title">Release Schedule</span></div>
    <div style="display:flex;flex-direction:column;gap:8px" id="release-list"></div>
  `;
  main.appendChild(listSection);
  const releaseList = document.getElementById('release-list');
  const sorted = [...movies, ...shows]
    .filter(i => i.release_date || i.first_air_date)
    .sort((a, b) => {
      const da = new Date(a.release_date || a.first_air_date);
      const db = new Date(b.release_date || b.first_air_date);
      return da - db;
    });
  sorted.slice(0, 20).forEach(item => {
    const title = item.title || item.name;
    const date  = formatDate(item.release_date || item.first_air_date);
    const el    = document.createElement('div');
    el.style.cssText = 'display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;cursor:pointer';
    el.innerHTML = `
      <span style="font-size:.75rem;color:var(--accent);font-weight:700;min-width:90px">${date}</span>
      <span style="font-size:.85rem;font-weight:600;flex:1">${title}</span>
      <span style="font-size:.75rem;color:var(--text-muted)">${item.media_type === 'movie' ? '🎬' : '📺'} ${score(item) ? '⭐' + score(item) : ''}</span>
    `;
    el.addEventListener('click', () => openModal(item.media_type, item.id, item));
    releaseList.appendChild(el);
  });
}

/* ── WATCHLIST ────────────────────────────────────────────────────── */
function renderWatchlist(main) {
  const statuses = ['watching', 'plantowatch', 'completed', 'hold', 'dropped'];

  if (!state.simklToken) {
    const prompt = document.createElement('div');
    prompt.className = 'simkl-prompt';
    prompt.innerHTML = `
      <span style="font-size:2rem">▶</span>
      <p>Connect Simkl to sync your watchlist, history, and ratings across devices.</p>
      <button class="modal-btn primary" onclick="simklAuth()">Connect Simkl</button>
    `;
    main.appendChild(prompt);
  }

  const entries = Object.entries(state.watchlist);
  if (!entries.length) {
    main.innerHTML += `<div class="empty-state"><div class="icon">📋</div>Your list is empty. Browse Trending or Upcoming and add items!</div>`;
    return;
  }

  statuses.forEach(status => {
    const items = entries.filter(([, s]) => s === status);
    if (!items.length) return;

    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `<div class="section-header"><span class="section-title">${wlStatusLabel(status)}</span></div><div class="watchlist-grid" id="wl-${status}"></div>`;
    main.appendChild(sec);

    const grid = sec.querySelector('.watchlist-grid');
    items.forEach(([key]) => {
      const [type, idStr] = key.split('_');
      const id = parseInt(idStr);
      // Build a minimal placeholder card; detail loads on click
      const fake = { id, media_type: type };
      const card = buildCard(fake);
      // Try to enrich from Simkl library
      const libItem = state.simklLibrary.find(li =>
        (li.movie?.ids?.tmdb === id || li.show?.ids?.tmdb === id)
      );
      if (libItem) {
        const src = libItem.movie || libItem.show;
        const titleEl = card.querySelector('.card-title');
        if (titleEl && src?.title) titleEl.textContent = src.title;
      }
      grid.appendChild(card);
    });
  });
}

/* ── RECOMMENDED ──────────────────────────────────────────────────── */
async function renderRecommended(main) {
  const affinity = LS.get('genre_affinity') || {};
  const myRatings = state.ratings;
  const hasData = Object.keys(myRatings).length > 0;

  if (!hasData) {
    main.innerHTML = `<div class="empty-state"><div class="icon">✨</div><p>Rate some movies and shows to get personalized recommendations!</p><p style="margin-top:8px;font-size:.8rem">Browse Trending and click the ★ stars to rate items.</p></div>`;
    return;
  }

  addSkeletonRow(main, 'Recommended For You ✨');

  // Get top genres from affinity
  const topGenres = Object.entries(affinity)
    .sort(([,a],[,b]) => b - a)
    .slice(0, 3)
    .map(([id]) => id);

  const fetchRec = async (mediaType, label) => {
    const params = { sort_by: 'popularity.desc', page: 1, 'vote_count.gte': 100 };
    if (topGenres.length) params.with_genres = topGenres.slice(0, 2).join(',');
    const path = mediaType === 'movie' ? '/discover/movie' : '/discover/tv';
    const data = await tmdb(path, params);
    const results = (data.results || [])
      .map(i => ({ ...i, media_type: mediaType }))
      .filter(i => !state.watchlist[mediaKey(mediaType, i.id)])
      .filter(i => !state.ratings[mediaKey(mediaType, i.id)])
      .sort((a, b) => recScore(b) - recScore(a))
      .slice(0, 20);
    return { label, results };
  };

  const [recMovies, recTV] = await Promise.all([
    fetchRec('movie', '🎬 Recommended Movies'),
    fetchRec('tv',    '📺 Recommended Shows'),
  ]);

  main.innerHTML = '';

  if (topGenres.length) {
    const genreNames = { 28:'Action', 35:'Comedy', 18:'Drama', 27:'Horror', 878:'Sci-Fi', 10749:'Romance', 53:'Thriller', 16:'Animation', 12:'Adventure', 99:'Documentary', 10765:'Sci-Fi & Fantasy', 10759:'Action & Adventure', 10768:'War & Politics', 37:'Western' };
    const genreLabel = topGenres.map(id => genreNames[id] || `Genre ${id}`).join(', ');
    const info = document.createElement('p');
    info.style.cssText = 'font-size:.83rem;color:var(--text-muted);padding:0 0 12px';
    info.textContent = `Recommendations based on your top genres: ${genreLabel}`;
    main.appendChild(info);
  }

  renderRow(main, recMovies.label, recMovies.results, true);
  renderRow(main, recTV.label,    recTV.results,    true);

  // Also show highly-rated similar items
  const topRated = Object.entries(state.ratings)
    .sort(([,a],[,b]) => b - a)
    .slice(0, 3);

  for (const [key] of topRated) {
    const [type, idStr] = key.split('_');
    try {
      const data = await tmdb(`/${type}/${idStr}/similar`);
      const results = (data.results || [])
        .map(i => ({ ...i, media_type: type }))
        .filter(i => !state.ratings[mediaKey(type, i.id)])
        .slice(0, 10);
      if (results.length) {
        renderRow(main, `Because you liked ${type === 'movie' ? '🎬' : '📺'} #${idStr}`, results);
      }
    } catch {}
  }
}

/* ── SEARCH ──────────────────────────────────────────────────────── */
let searchQuery = '';
async function doSearch() {
  searchQuery = document.getElementById('search-input').value.trim();
  if (!searchQuery) return;
  state.view = 'search';
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  renderView();
}
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

async function renderSearch(main) {
  main.innerHTML = '<div class="empty-state"><div class="icon">🔍</div>Searching…</div>';
  try {
    const [movies, shows] = await Promise.all([
      tmdb('/search/movie', { query: searchQuery }),
      tmdb('/search/tv',    { query: searchQuery }),
    ]);
    const results = [
      ...(movies.results || []).map(m => ({ ...m, media_type: 'movie' })),
      ...(shows.results  || []).map(t => ({ ...t, media_type: 'tv' })),
    ].sort((a, b) => (b.popularity || 0) - (a.popularity || 0));

    main.innerHTML = '';
    if (!results.length) {
      main.innerHTML = `<div class="empty-state"><div class="icon">🔍</div>No results for "${searchQuery}"</div>`;
      return;
    }
    renderRow(main, `Search results for "${searchQuery}"`, results);
  } catch {
    main.innerHTML = '<div class="empty-state">Search failed. Try again.</div>';
  }
}

/* ─────────────────────────────────────────────────────────────────────
   HELPERS — row builder, filter, skeletons
   ───────────────────────────────────────────────────────────────────── */
function filterResults(items) {
  return items.filter(i => {
    if (state.filterType !== 'all' && i.media_type !== state.filterType) return false;
    if (state.genre && !(i.genre_ids || []).includes(parseInt(state.genre))) return false;
    return true;
  });
}

function renderRow(container, title, items, recBadge = false) {
  const sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = `<div class="section-header"><span class="section-title">${title}</span></div><div class="card-row"></div>`;
  const row = sec.querySelector('.card-row');
  if (!items.length) {
    sec.querySelector('.card-row').outerHTML = `<p style="color:var(--text-muted);font-size:.85rem">No results found.</p>`;
  } else {
    items.forEach(item => {
      const card = buildCard(item);
      if (recBadge) {
        const badge = document.createElement('span');
        badge.className = 'rec-badge';
        badge.style.cssText = 'position:absolute;top:6px;right:6px;';
        badge.textContent = 'For You';
        card.appendChild(badge);
      }
      row.appendChild(card);
    });
  }
  container.appendChild(sec);
}

function addSkeletonRow(container, title) {
  const sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = `<div class="section-header"><span class="section-title">${title}</span></div>
  <div class="card-row">${[...Array(6)].map(() => `<div class="skel-card skeleton"></div>`).join('')}</div>`;
  container.appendChild(sec);
}

/* ─────────────────────────────────────────────────────────────────────
   FILTER EVENTS
   ───────────────────────────────────────────────────────────────────── */
document.querySelectorAll('[data-filter-type]').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('[data-filter-type]').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    state.filterType = chip.dataset.filterType;
    if (['trending','upcoming'].includes(state.view)) renderView();
  });
});
document.getElementById('genre-filter').addEventListener('change', e => {
  state.genre = e.target.value;
  if (['trending','upcoming'].includes(state.view)) renderView();
});
document.getElementById('sort-filter').addEventListener('change', e => {
  state.sort = e.target.value;
  if (['trending','upcoming'].includes(state.view)) renderView();
});
document.getElementById('provider-filter').addEventListener('change', e => {
  state.provider = e.target.value;
  if (['trending','upcoming'].includes(state.view)) renderView();
});

/* ─────────────────────────────────────────────────────────────────────
   NAV EVENTS
   ───────────────────────────────────────────────────────────────────── */
document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    state.view = tab.dataset.view;
    renderView();
  });
});

/* ─────────────────────────────────────────────────────────────────────
   INIT
   ───────────────────────────────────────────────────────────────────── */
(async function init() {
  // Hide Simkl connect button when running from local filesystem
  // (OAuth redirect won't work without a real HTTPS URL)
  const isLocal = window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  if (isLocal) {
    const btn  = document.getElementById('simkl-btn');
    const user = document.getElementById('simkl-user');
    btn.textContent   = 'Simkl (deploy to enable)';
    btn.style.opacity = '0.4';
    btn.style.cursor  = 'not-allowed';
    btn.onclick       = () => toast('Connect Simkl after deploying to GitHub Pages');
    user.textContent  = '⚠ Running locally';
    user.style.color  = 'var(--text-muted)';
  } else {
    updateSimklUI();
    await handleSimklCallback();
  }

  renderView();
})();
</script>
