<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV & Movie Calendar</title>
  <style>
    /* ─── Reset & Base ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0d0f;
      --surface: #18181c;
      --surface2: #222228;
      --border: #2e2e38;
      --accent: #e50914;
      --accent2: #f5a623;
      --text: #f0f0f5;
      --text-muted: #8888a0;
      --tag-bg: #2a2a35;
      --star-on: #f5a623;
      --star-off: #444;
      --radius: 10px;
      --card-w: 160px;
    }
    [data-theme="light"] {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface2: #e8e8ed;
      --border: #d1d1d6;
      --accent: #e50914;
      --accent2: #f5a623;
      --text: #1d1d1f;
      --text-muted: #6e6e73;
      --tag-bg: #e8e8ed;
      --star-on: #f5a623;
      --star-off: #c7c7cc;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }
    button { cursor: pointer; font-family: inherit; }
    img { display: block; }

    /* ─── Top Nav ───────────────────────────────────────────────────── */
    .topnav {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
    }
    .topnav h1 { font-size: 1.2rem; font-weight: 700; color: var(--accent); flex: 0 0 auto; }
    .nav-tabs { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
    .nav-tab {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      transition: all .2s;
    }
    .nav-tab:hover { border-color: var(--accent); color: var(--text); }
    .nav-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .nav-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    #simkl-btn {
      background: #1ce783;
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 7px 14px;
      font-weight: 700;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #simkl-btn:hover { filter: brightness(1.1); }
    #simkl-user { font-size: 0.8rem; color: #1ce783; }

    /* ─── Search bar ────────────────────────────────────────────────── */
    .search-wrap {
      padding: 14px 24px 0;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #search-input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 14px;
      color: var(--text);
      font-size: 0.9rem;
      width: 280px;
      outline: none;
    }
    #search-input:focus { border-color: var(--accent); }
    #search-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 18px;
      font-weight: 600;
    }
    #search-btn:hover { filter: brightness(1.15); }

    /* ─── Filter row ────────────────────────────────────────────────── */
    .filter-row {
      display: flex;
      gap: 8px;
      padding: 12px 24px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-label { font-size: 0.8rem; color: var(--text-muted); margin-right: 4px; }
    .filter-chip {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all .15s;
    }
    .filter-chip:hover, .filter-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    select.filter-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 0.82rem;
      outline: none;
      cursor: pointer;
    }

    /* ─── Main layout ───────────────────────────────────────────────── */
    .main { padding: 16px 24px 40px; }
    .section { margin-bottom: 36px; }
    .section-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .section-title { font-size: 1.05rem; font-weight: 700; }
    .see-all { font-size: 0.8rem; color: var(--accent); margin-left: auto; cursor: pointer; }
    .see-all:hover { text-decoration: underline; }

    /* ─── Horizontal scroll row ─────────────────────────────────────── */
    .row-wrap {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-row {
      display: flex;
      flex: 1;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 10px;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
    }
    .card-row::-webkit-scrollbar { height: 4px; }
    .card-row::-webkit-scrollbar-track { background: var(--surface); }
    .card-row::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    .row-scroll-btn {
      flex-shrink: 0;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s;
      padding: 0;
      align-self: center;
      margin-bottom: 10px;
    }
    .row-scroll-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ─── Card ──────────────────────────────────────────────────────── */
    .card {
      flex: 0 0 var(--card-w);
      scroll-snap-align: start;
      background: var(--surface);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
      position: relative;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
    .card.rated { opacity: 0.5; }
    .card.rated:hover { opacity: 1; transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,.5); }
    .card-poster {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      background: var(--surface2);
    }
    .card-poster-placeholder {
      width: 100%;
      aspect-ratio: 2/3;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
    }
    .card-body { padding: 8px 10px 10px; }
    .card-title {
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta { font-size: 0.73rem; color: var(--text-muted); display: flex; gap: 6px; flex-wrap: wrap; }
    .card-score {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent2);
    }
    .card-date { font-size: 0.73rem; color: var(--text-muted); }
    .card-badge {
      position: absolute;
      top: 6px;
      left: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .card-badge.tv { background: #1a6ef5; }
    .card-badge.movie { background: var(--accent); }
    /* My rating stars on card */
    .card-stars { display: flex; gap: 2px; margin-top: 5px; }
    .card-stars .star {
      font-size: 0.82rem;
      color: var(--star-off);
      cursor: pointer;
      transition: color .1s;
    }
    .card-stars .star.on { color: var(--star-on); }

    /* ─── Calendar grid ─────────────────────────────────────────────── */
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
    }
    .cal-day-header {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      padding: 4px 0;
      font-weight: 600;
    }
    .cal-day {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      min-height: 90px;
      padding: 6px;
      font-size: 0.75rem;
      position: relative;
    }
    .cal-day.today { border-color: var(--accent); }
    .cal-day-num {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .cal-day.today .cal-day-num { color: var(--accent); }
    .cal-item {
      background: var(--tag-bg);
      border-radius: 4px;
      padding: 2px 5px;
      margin-bottom: 3px;
      font-size: 0.68rem;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      transition: background .15s;
    }
    .cal-item:hover { background: var(--accent); }
    .cal-item.movie { border-left: 3px solid var(--accent); }
    .cal-item.tv { border-left: 3px solid #1a6ef5; }
    .cal-item.my-show { border-left: 3px solid #1ce783; background: rgba(28,231,131,.12); }
    .cal-month-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }
    .cal-month-nav button {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      padding: 5px 12px;
    }
    .cal-month-nav button:hover { border-color: var(--accent); }
    #cal-month-label { font-weight: 700; font-size: 1rem; min-width: 160px; text-align: center; }

    /* ─── Watchlist panel ───────────────────────────────────────────── */
    .watchlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr));
      gap: 14px;
    }

    /* ─── Modal / detail overlay ────────────────────────────────────── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #modal-overlay.open { display: flex; }
    #modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }
    #modal-close {
      position: sticky;
      top: 0;
      float: right;
      background: var(--surface2);
      border: none;
      color: var(--text);
      font-size: 1.2rem;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      margin: 10px 10px 0 0;
      z-index: 10;
    }
    .modal-inner { padding: 20px 24px 28px; }
    .modal-hero {
      display: flex;
      gap: 20px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .modal-poster {
      width: 130px;
      border-radius: 8px;
      flex-shrink: 0;
      object-fit: cover;
      aspect-ratio: 2/3;
      background: var(--surface2);
    }
    .modal-info { flex: 1; min-width: 180px; }
    .modal-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
    .modal-tagline { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; font-style: italic; }
    .modal-meta { font-size: 0.82rem; color: var(--text-muted); display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
    .modal-genres { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .genre-tag {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.78rem;
    }
    .modal-overview { font-size: 0.88rem; line-height: 1.6; color: var(--text-muted); margin-bottom: 16px; }
    .modal-scores { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .score-box {
      background: var(--surface2);
      border-radius: 8px;
      padding: 8px 14px;
      text-align: center;
    }
    .score-box .score-val { font-size: 1.1rem; font-weight: 700; color: var(--accent2); }
    .score-box .score-lbl { font-size: 0.7rem; color: var(--text-muted); }
    .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .modal-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.84rem;
      transition: all .15s;
    }
    .modal-btn:hover { border-color: var(--accent); color: var(--accent); }
    .modal-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .modal-btn.primary:hover { filter: brightness(1.1); }
    /* My Rating row */
    .my-rating-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .my-rating-label { font-size: 0.85rem; font-weight: 600; }
    .rating-stars { display: flex; gap: 4px; }
    .rating-stars .star {
      font-size: 1.3rem;
      color: var(--star-off);
      cursor: pointer;
      transition: color .1s, transform .1s;
    }
    .rating-stars .star:hover, .rating-stars .star.on { color: var(--star-on); }
    .rating-stars .star:hover { transform: scale(1.2); }
    .rating-val { font-size: 0.85rem; color: var(--text-muted); }
    /* Similar / Recommended */
    .modal-similar-title { font-size: 0.9rem; font-weight: 700; margin-bottom: 10px; color: var(--text-muted); }

    /* ─── Notifications toast ───────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 0.88rem;
      z-index: 300;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity .3s, transform .3s;
      pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* ─── Skeleton loader ───────────────────────────────────────────── */
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    .skel-card {
      flex: 0 0 var(--card-w);
      height: 260px;
      border-radius: var(--radius);
    }

    /* ─── Responsiveness ────────────────────────────────────────────── */
    @media (max-width: 700px) {
      :root { --card-w: 130px; }
      .cal-grid { grid-template-columns: repeat(3, 1fr); }
      .cal-day-header:nth-child(n+4) { display: none; }
    }

    /* ─── Recommendations tag badges ────────────────────────────────── */
    .rec-badge {
      background: #1a6ef5;
      color: #fff;
      font-size: 0.65rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }
    /* Content rating badge */
    .rating-badge {
      display: inline-block;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      border: 1px solid currentColor;
      margin-left: 4px;
      vertical-align: middle;
      line-height: 1.4;
    }
    .rating-badge.adult { color: var(--accent); }
    .rating-badge.teen  { color: var(--accent2); }
    .rating-badge.family{ color: #1ce783; }

    /* ─── Section tabs (TV / Movies / Both) ─────────────────────────── */
    .type-pills { display: flex; gap: 6px; }
    .type-pill {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 14px;
      padding: 4px 12px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all .15s;
    }
    .type-pill.active { background: var(--surface2); border-color: var(--accent2); color: var(--accent2); }

    /* ─── Watchlist status menu ─────────────────────────────────────── */
    .wl-status {
      font-size: 0.7rem;
      background: var(--tag-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 6px;
      padding: 3px 7px;
      margin-top: 5px;
      cursor: pointer;
      width: 100%;
      text-align: left;
    }
    .wl-status.watching { color: #1ce783; border-color: #1ce783; border-style: solid; border-width: 2px; }
    .wl-status.completed { color: var(--accent2); border-color: var(--accent2); border-style: double; }
    .wl-status.plantowatch { color: #1a6ef5; border-color: #1a6ef5; border-style: dashed; }
    .wl-status.hold { color: #f5a623; border-color: #f5a623; border-style: dotted; }
    .wl-status.dropped { color: var(--accent); border-color: var(--accent); text-decoration: line-through; }

    /* ─── Quick Rate thumbs buttons ───────────────────────────────────── */
    .thumbs-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      flex: 1;
    }
    .thumbs-btn:hover {
      background: var(--surface);
      border-color: var(--accent);
    }
    .thumbs-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* ─── Empty state ───────────────────────────────────────────────── */
    .empty-state {
      padding: 48px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .empty-state .icon { font-size: 3rem; margin-bottom: 12px; }

    /* ─── Simkl connect prompt ──────────────────────────────────────── */
    .simkl-prompt {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .simkl-prompt p { flex: 1; font-size: 0.88rem; color: var(--text-muted); }
  </style>
</head>
<body>

<!-- ═══ TOP NAV ═══════════════════════════════════════════════════════ -->
<nav class="topnav">
  <h1>📺 Media Calendar</h1>
  <div class="nav-tabs">
    <button class="nav-tab active" data-view="trending">🔥 Trending</button>
    <button class="nav-tab" data-view="calendar">📅 Calendar</button>
    <button class="nav-tab" data-view="upcoming">🎬 Upcoming</button>
    <button class="nav-tab" data-view="watchlist">⭐ My List</button>
    <button class="nav-tab" data-view="recommended">✨ For You</button>
    <button class="nav-tab" data-view="quickrate">⚡ Quick Rate</button>
    <button class="nav-tab" data-view="stats">📊 Stats</button>
  </div>
  <div class="nav-right">
    <button id="theme-toggle" onclick="toggleTheme()" style="background:none;border:none;color:var(--text);font-size:1.2rem;padding:4px 8px;cursor:pointer" title="Toggle theme">🌙</button>
    <button onclick="surpriseMe()" style="background:var(--accent);border:none;color:#fff;border-radius:6px;padding:6px 12px;font-size:0.8rem;font-weight:600;cursor:pointer">🎲 Surprise Me</button>
    <span id="simkl-user"></span>
    <button id="simkl-btn" onclick="simklAuth()">
      <span>▶</span> Connect Simkl
    </button>
  </div>
</nav>

<!-- ═══ SEARCH ════════════════════════════════════════════════════════ -->
<div class="search-wrap">
  <input id="search-input" type="text" placeholder="Search movies & shows…" />
  <button id="search-btn" onclick="doSearch()">Search</button>
</div>

<!-- ═══ FILTER ROW ════════════════════════════════════════════════════ -->
<div class="filter-row" id="filter-row">
  <span class="filter-label">Type:</span>
  <span class="filter-chip active" data-filter-type="all">All</span>
  <span class="filter-chip" data-filter-type="movie">Movies</span>
  <span class="filter-chip" data-filter-type="tv">TV</span>
  <span class="filter-label" style="margin-left:12px">Genre:</span>
  <select class="filter-select" id="genre-filter">
    <option value="">Any Genre</option>
  </select>
  <select class="filter-select" id="sort-filter">
    <option value="popularity.desc">Most Popular</option>
    <option value="vote_average.desc">Highest Rated</option>
    <option value="release_date.desc">Newest</option>
    <option value="release_date.asc">Oldest</option>
  </select>
  <select class="filter-select" id="provider-filter">
    <option value="">Any Streaming Service</option>
    <option value="8">Netflix</option>
    <option value="9">Amazon Prime</option>
    <option value="337">Disney+</option>
    <option value="1899">Max (HBO)</option>
    <option value="15">Hulu</option>
    <option value="386">Peacock</option>
    <option value="387">Peacock Premium</option>
    <option value="531">Paramount+</option>
    <option value="350">Apple TV+</option>
    <option value="2">Apple TV</option>
  </select>
  <select class="filter-select" id="rating-filter">
    <option value="">Any Rating</option>
    <option value="NR">NR / Unrated</option>
    <option value="G">G</option>
    <option value="PG">PG</option>
    <option value="PG-13">PG-13</option>
    <option value="R">R</option>
    <option value="TV-G">TV-G</option>

const LS = {

/* ─────────────────────────────────────────────────────────────────────
   API CACHE — in-memory with TTL, persisted to localStorage for details
   ───────────────────────────────────────────────────────────────────── */
const _cache = new Map(); // in-memory: key → { data, expires }
const CACHE_TTL = {
  trending: 5 * 60 * 1000,       // 5 min
  discover: 10 * 60 * 1000,      // 10 min
  detail:   60 * 60 * 1000,      // 1 hr
  season:   24 * 60 * 60 * 1000, // 24 hr
  search:   2 * 60 * 1000,       // 2 min
  providers:60 * 60 * 1000,      // 1 hr
};

function cacheTTL(path) {
  if (path.includes('/trending/')) return CACHE_TTL.trending;
  if (path.includes('/discover/')) return CACHE_TTL.discover;
  if (path.includes('/season/'))   return CACHE_TTL.season;
  if (path.includes('/watch/providers')) return CACHE_TTL.providers;
  if (path.includes('/search/'))   return CACHE_TTL.search;
  if (path.match(/\/(movie|tv)\/\d+$/)) return CACHE_TTL.detail;
  return CACHE_TTL.discover;
}

function cacheKey(path, params) {
  const sorted = Object.entries(params).sort(([a],[b]) => a.localeCompare(b));
  return path + '?' + sorted.map(([k,v]) => `${k}=${v}`).join('&');
}

function cacheGet(key) {
  const entry = _cache.get(key);
  if (!entry) return null;
  if (Date.now() > entry.expires) { _cache.delete(key); return null; }
  return entry.data;
}

function cacheSet(key, data, ttl) {
  _cache.set(key, { data, expires: Date.now() + ttl });
}

/* ─────────────────────────────────────────────────────────────────────
   TMDB API  (with cache)
   ───────────────────────────────────────────────────────────────────── */
async function tmdb(path, params = {}) {
  const key = cacheKey(path, params);
  const cached = cacheGet(key);
  if (cached) return cached;

  const url = new URL(TMDB_BASE + path);
  url.searchParams.set('language', 'en-US');
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const res = await fetch(url, {
    headers: { Authorization: `Bearer ${TMDB_TOKEN}` }
  });
  if (!res.ok) throw new Error(`TMDB ${res.status}: ${path}`);
  const data = await res.json();
  cacheSet(key, data, cacheTTL(path));
  return data;
}

// Fetch content rating for a title (US region)
async function getContentRating(type, id) {
  try {
    if (type === 'movie') {
      const data = await tmdb(`/movie/${id}/release_dates`);
      const us = (data.results || []).find(r => r.iso_3166_1 === 'US');
      if (us && us.release_dates) {
        const rated = us.release_dates.find(r => r.certification);
        return rated?.certification || '';
      }
    } else {
      const data = await tmdb(`/tv/${id}/content_ratings`);
      const us = (data.results || []).find(r => r.iso_3166_1 === 'US');
      return us?.rating || '';
    }
  } catch (e) { console.warn('Content rating fetch failed:', e); }
  return '';
}

// Fetch streaming providers for a title (US region)
async function getProviders(type, id) {
  try {
    const data = await tmdb(`/${type}/${id}/watch/providers`);
    const us = data.results && data.results.US;
    if (!us) return null;
    return {
      flatrate: us.flatrate || [],
      rent:     us.rent     || [],
      buy:      us.buy      || [],
      link:     us.link     || '',
    };
  } catch (e) { console.warn('Providers fetch failed:', e); return null; }
}

// Rating badge helper
function ratingBadgeHTML(rating) {
  if (!rating) return '';
  const cls = ['TV-MA','R','NC-17'].includes(rating) ? 'adult'
            : ['TV-14','PG-13'].includes(rating) ? 'teen' : 'family';
  return `<span class="rating-badge ${cls}">${rating}</span>`;
}

/* ─────────────────────────────────────────────────────────────────────
   SIMKL OAuth2 PKCE
   ───────────────────────────────────────────────────────────────────── */
function base64urlEncode(buf) {
  return btoa(String.fromCharCode(...new Uint8Array(buf)))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function pkceChallenge() {
  const verifier = base64urlEncode(crypto.getRandomValues(new Uint8Array(32)));
  const digest   = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return { verifier, challenge: base64urlEncode(digest) };
}

async function simklAuth() {
  if (state.simklToken) { simklDisconnect(); return; }
  const { verifier, challenge } = await pkceChallenge();
  LS.set('pkce_verifier', verifier);
  const params = new URLSearchParams({
    response_type: 'code',
    client_id: SIMKL_CLIENT_ID,
    redirect_uri: SIMKL_REDIRECT,
    code_challenge: challenge,
    code_challenge_method: 'S256',
    scope: 'public media:read media:write',
  });
  window.location.href = `${SIMKL_AUTH_URL}?${params}`;
}

function simklDisconnect() {
  state.simklToken  = null;
  state.simklUser   = null;
  state.simklLibrary = [];
  LS.set('simkl_token', null);
  LS.set('simkl_user', null);
  LS.set('simkl_library', []);
  LS.set('pkce_verifier', null);
  updateSimklUI();
  toast('Disconnected from Simkl');
  renderView();
}

async function handleSimklCallback() {
  const params   = new URLSearchParams(window.location.search);
  const code     = params.get('code');
  const verifier = LS.get('pkce_verifier');
  if (!code || !verifier) return;

  // Clean URL
  window.history.replaceState({}, '', window.location.pathname);

  try {
    const res = await fetch(`${SIMKL_TOKEN_URL}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        grant_type: 'authorization_code',
        code,
        client_id: SIMKL_CLIENT_ID,
        redirect_uri: SIMKL_REDIRECT,
        code_verifier: verifier,
      }),
    });
    if (!res.ok) throw new Error('Token exchange failed');
    const data = await res.json();
    state.simklToken = data.access_token;
    LS.set('pkce_verifier', null);
    saveSimkl();
    await loadSimklUser();
    await syncSimklLibrary();
    toast('✅ Connected to Simkl!');
    renderView();
  } catch (e) {
    toast('❌ Simkl login failed: ' + e.message);
  }
}

async function simklGet(path, params = {}) {
  const url = new URL(SIMKL_API + path);
  url.searchParams.set('client_id', SIMKL_CLIENT_ID);
  Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
  const headers = { 'Content-Type': 'application/json' };
  if (state.simklToken) headers['Authorization'] = `Bearer ${state.simklToken}`;
  const res = await fetch(url, { headers });
  if (!res.ok) throw new Error(`Simkl ${res.status}`);
  return res.json();
}

async function simklPost(path, body) {
  const res = await fetch(SIMKL_API + path, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${state.simklToken}`,
    },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`Simkl POST ${res.status}`);
  return res.json();
}

async function loadSimklUser() {
  try {
    const data = await simklGet('/users/settings');
    state.simklUser = data.user?.name || 'Simkl User';

    updateSimklUI();
  } catch (e) { console.warn('Simkl user load failed:', e); }
}

async function syncSimklLibrary() {
  if (!state.simklToken) return;
  try {
    const [movies, shows] = await Promise.all([
      simklGet('/sync/all-items/movies/all'),
      simklGet('/sync/all-items/shows/all'),
    ]);
    const lib = [
      ...(movies?.movies || []).map(m => ({ ...m, media_type: 'movie' })),
      ...(shows?.shows   || []).map(s => ({ ...s, media_type: 'tv' })),
    ];
    state.simklLibrary = lib;
    LS.set('simkl_library', lib);

    // Mirror Simkl ratings AND statuses into local state
    const simklToLocal = { watching: 'watching', completed: 'completed', plantowatch: 'plantowatch', hold: 'hold', dropped: 'dropped', notinteresting: 'dropped' };
    lib.forEach(item => {
      const tmdbId = item.movie?.ids?.tmdb || item.show?.ids?.tmdb;
      if (!tmdbId) return;
      const type = item.media_type;
      const key  = mediaKey(type, tmdbId);

      // Mirror rating
      if (item.user_rating) state.ratings[key] = item.user_rating;

      // Mirror watchlist status (#5)
      const simklStatus = item.status;
      if (simklStatus && simklToLocal[simklStatus]) {
        state.watchlist[key] = simklToLocal[simklStatus];
      }

      // Cache title + poster for watchlist display (#1, #3)
      const src = item.movie || item.show;
      if (src?.title && !state.mediaDetails[key]) {
        state.mediaDetails[key] = {
          title: src.title,
          poster_path: src.poster || src.poster_path || null,
          media_type: type,
          id: tmdbId,
        };
      }
    });

    saveRatings();
    saveWatchlist();
    saveMediaDetails();
    toast(`Synced ${lib.length} items from Simkl`);
  } catch (e) {
    toast('Simkl sync failed: ' + e.message);
  }
}

function updateSimklUI() {
  const btn  = document.getElementById('simkl-btn');

  if (state.simklToken && state.simklUser) {

/* ─────────────────────────────────────────────────────────────────────

async function pushRatingToSimkl(mediaType, tmdbId, rating) {

  const body = {};
  const item = { ids: { tmdb: tmdbId }, rating };

  else body.shows = [item];

    await simklPost('/sync/ratings', body);
  } catch (e) { console.warn('Push rating to Simkl failed:', e); }
}

async function pushWatchlistToSimkl(mediaType, tmdbId, status) {
  if (!state.simklToken || !tmdbId) return;
  const simklStatus = { watching: 'watching', plantowatch: 'plantowatch', completed: 'completed', dropped: 'dropped', hold: 'hold' }[status] || 'plantowatch';
  const body = {};
  const item = { ids: { tmdb: tmdbId }, to: simklStatus };
  if (mediaType === 'movie') body.movies = [item];
  else body.shows = [item];
  try {
    await simklPost('/sync/add-to-list', body);
  } catch (e) { console.warn('Push watchlist to Simkl failed:', e); }

/* ─────────────────────────────────────────────────────────────────────
   HELPERS
   ───────────────────────────────────────────────────────────────────── */
function mediaKey(type, id)   { return `${type}_${id}`; }
function getRating(type, id)  { return state.ratings[mediaKey(type, id)] || 0; }
function getWlStatus(type, id){ return state.watchlist[mediaKey(type, id)] || ''; }

function formatDate(d) {
  if (!d) return '';
  return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function score(item) {
  const v = item.vote_average || 0;
  return v > 0 ? v.toFixed(1) : '';
}

function posterUrl(path) {

}

function isInWatchlist(type, id) {

}

/* ─────────────────────────────────────────────────────────────────────
   RECOMMENDATION ENGINE
   Weighted score = TMDB popularity + vote_avg + genre affinity from ratings
   ───────────────────────────────────────────────────────────────────── */
function buildGenreAffinityMap() {
  // Already cached genre details stored on items in the library/ratings
  const affinity = {};
  const stored   = LS.get('genre_affinity') || {};
  return stored; // populated as user rates items
}

function updateGenreAffinity(genres, rating) {
  const affinity = LS.get('genre_affinity') || {};
  genres.forEach(g => {
    affinity[g.id] = (affinity[g.id] || 0) + (rating - 5); // +/- from neutral
  });
  LS.set('genre_affinity', affinity);
}

function recScore(item) {
  const affinity = LS.get('genre_affinity') || {};
  const myKey    = mediaKey(item.media_type || (item.title ? 'movie' : 'tv'), item.id);
  const myRating = state.ratings[myKey] || 0;

  let genreBoost = 0;
  if (item.genre_ids) {
    item.genre_ids.forEach(gid => { genreBoost += (affinity[gid] || 0); });
  }

  const pop   = (item.popularity || 0) / 100;
  const vote  = (item.vote_average || 0) * 10;
  const rated = myRating > 0 ? myRating * 5 : 0;

  return pop + vote + genreBoost * 3 + rated;
}

/* ─────────────────────────────────────────────────────────────────────
   CARD BUILDER
   ───────────────────────────────────────────────────────────────────── */
function buildCard(item, opts = {}) {
  const type     = item.media_type || (item.title ? 'movie' : 'tv');
  const id       = item.id;
  const title    = item.title || item.name || 'Unknown';
  const date     = item.release_date || item.first_air_date || '';
  const year     = date ? date.slice(0, 4) : '';
  const poster   = posterUrl(item.poster_path);
  const myRating = getRating(type, id);
  const wlStatus = getWlStatus(type, id);
  const sc       = score(item);
  const cr       = item._contentRating || '';  // set by enrichCard if available

  const card = document.createElement('div');
  card.className = 'card';
  if (myRating > 0) card.classList.add('rated');
  card.dataset.id = id;
  card.dataset.type = type;
  card.setAttribute('tabindex', '0');
  card.setAttribute('role', 'button');
  card.setAttribute('aria-label', `View details for ${title}`);

  card.innerHTML = `
    <span class="card-badge ${type}">${type === 'movie' ? '🎬' : '📺'}</span>
    ${poster
      ? `<img class="card-poster" src="${poster}" alt="${title}" loading="lazy" />`
      : `<div class="card-poster-placeholder">🎬</div>`}
    <div class="card-body">
      <div class="card-title">${title}</div>
      <div class="card-meta">
        ${year ? `<span>${year}</span>` : ''}
        ${sc ? `<span class="card-score">⭐ ${sc}</span>` : ''}
        ${cr ? ratingBadgeHTML(cr) : ''}
      </div>
      <div class="card-stars" role="group" aria-label="My rating">
        ${[1,2,3,4,5].map(n => `
          <span class="star${myRating >= n*2 ? ' on' : ''}" data-val="${n*2}" aria-label="${n*2} stars">★</span>
        `).join('')}
      </div>
      ${wlStatus ? `<div class="wl-status ${wlStatus}" title="${wlStatus}">${wlStatusLabel(wlStatus)}</div>` : ''}
    </div>
  `;

  card.addEventListener('click', e => {
    if (!e.target.classList.contains('star')) openModal(type, id, item);
  });
  card.addEventListener('keydown', e => {
    if (e.key === 'Enter') openModal(type, id, item);
  });

  card.querySelectorAll('.card-stars .star').forEach(star => {
    star.addEventListener('click', e => {
      e.stopPropagation();
      const val = parseInt(star.dataset.val);
      setRating(type, id, val, item.genre_ids);
      card.querySelectorAll('.card-stars .star').forEach(s => {
        s.classList.toggle('on', val >= parseInt(s.dataset.val));
      });
      card.classList.add('rated');
      // Animate out and remove from the row
      card.style.transition = 'opacity .3s, transform .3s';
      card.style.opacity = '0';
      card.style.transform = 'scale(0.85)';
      setTimeout(() => card.remove(), 320);
      if (state.simklToken) pushRatingToSimkl(type, id, val);
    });
  });

  return card;
}

function wlStatusLabel(s) {
  return { watching: '▶ Watching', completed: '✅ Completed', plantowatch: '🔖 Plan to Watch', hold: '⏸ On Hold', dropped: '❌ Dropped' }[s] || s;
}

function setRating(type, id, val, genreIds) {
  const key = mediaKey(type, id);
  state.ratings[key] = val;
  saveRatings();
  if (genreIds) {
    // Convert genre_ids to genre objects (minimal)
    updateGenreAffinity(genreIds.map(gid => ({ id: gid })), val);
  }
  toast(`Rated ${val / 2}/5 ⭐`);
}

/* ─────────────────────────────────────────────────────────────────────
   MODAL
   ───────────────────────────────────────────────────────────────────── */
async function openModal(type, id, basicItem = {}) {
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal-inner').innerHTML = `
    <div class="skeleton" style="height:200px;border-radius:8px;margin-bottom:16px"></div>
    <div class="skeleton" style="height:20px;width:60%;border-radius:4px;margin-bottom:8px"></div>
    <div class="skeleton" style="height:80px;border-radius:4px"></div>
  `;

  try {
    const apiPath = type === 'movie' ? `/movie/${id}` : `/tv/${id}`;
    const [detail, credits, providers, contentRating] = await Promise.all([
      tmdb(apiPath),
      tmdb(`${apiPath}/credits`).catch(() => ({ cast: [] })),
      getProviders(type, id),
      getContentRating(type, id),
    ]);

    // Cache title/poster for watchlist display (#1, #3)
    const key = mediaKey(type, id);
    state.mediaDetails[key] = {
      title: detail.title || detail.name,
      poster_path: detail.poster_path,
      media_type: type,
      id,
      vote_average: detail.vote_average,
      release_date: detail.release_date,
      first_air_date: detail.first_air_date,
      genre_ids: (detail.genres || []).map(g => g.id),
      contentRating,
    };
    saveMediaDetails();

    renderModal(type, detail, credits, providers, contentRating);
  } catch (e) {
    document.getElementById('modal-inner').innerHTML = `<p style="padding:20px;color:var(--text-muted)">Could not load details: ${e.message}</p>`;
  }
}

function renderModal(type, d, credits, providers, contentRating) {
  const id       = d.id;
  const title    = d.title || d.name;
  const poster   = d.poster_path ? IMG_ORIG + d.poster_path : null;
  const backdrop = d.backdrop_path ? `https://image.tmdb.org/t/p/w780${d.backdrop_path}` : null;
  const year     = (d.release_date || d.first_air_date || '').slice(0, 4);
  const runtime  = d.runtime || (d.episode_run_time && d.episode_run_time[0]) || '';
  const genres   = d.genres || [];
  const myR      = getRating(type, id);
  const wlStat   = getWlStatus(type, id);
  const cast     = (credits.cast || []).slice(0, 5).map(c => c.name).join(', ');
  const sc       = d.vote_average ? d.vote_average.toFixed(1) : '—';
  const cr       = contentRating || '';

  document.getElementById('modal-inner').innerHTML = `
    ${backdrop ? `<img src="${backdrop}" alt="" style="width:100%;border-radius:8px 8px 0 0;display:block;object-fit:cover;max-height:200px" />` : ''}
    <div class="modal-hero" style="${backdrop ? 'margin-top:-50px;padding:0 20px' : ''}">
      ${poster
        ? `<img class="modal-poster" src="${poster}" alt="${title}" />`
        : `<div class="modal-poster" style="display:flex;align-items:center;justify-content:center;font-size:3rem">🎬</div>`}
      <div class="modal-info">
        <div class="modal-title">${title}</div>
        ${d.tagline ? `<div class="modal-tagline">"${d.tagline}"</div>` : ''}
        <div class="modal-meta">
          ${year ? `<span>📅 ${year}</span>` : ''}
          ${runtime ? `<span>⏱ ${runtime}min</span>` : ''}
          ${cr ? ratingBadgeHTML(cr) : ''}
          ${d.status ? `<span>📡 ${d.status}</span>` : ''}
          ${type === 'tv' && d.number_of_seasons ? `<span>📺 ${d.number_of_seasons} season${d.number_of_seasons > 1 ? 's' : ''}</span>` : ''}
          ${d.networks && d.networks[0] ? `<span>🌐 ${d.networks[0].name}</span>` : ''}
        </div>
        <div class="modal-genres">
          ${genres.map(g => `<span class="genre-tag">${g.name}</span>`).join('')}
        </div>
        <div class="modal-scores">
          <div class="score-box"><div class="score-val">${sc}</div><div class="score-lbl">TMDB Score</div></div>
          ${d.vote_count ? `<div class="score-box"><div class="score-val">${d.vote_count.toLocaleString()}</div><div class="score-lbl">Votes</div></div>` : ''}
          ${myR ? `<div class="score-box"><div class="score-val" style="color:var(--star-on)">${myR/2}/5</div><div class="score-lbl">My Rating</div></div>` : ''}
        </div>
      </div>
    </div>
    <div style="padding:0 4px">
      ${d.overview ? `<p class="modal-overview">${d.overview}</p>` : ''}
      ${cast ? `<p style="font-size:.8rem;color:var(--text-muted);margin-bottom:14px">🎭 <strong>Cast:</strong> ${cast}</p>` : ''}

      <!-- My Rating -->
      <div class="my-rating-row">
        <span class="my-rating-label">My Rating:</span>
        <div class="rating-stars" role="group" aria-label="Rate this title">
          ${[1,2,3,4,5].map(n => `
            <span class="star${myR >= n*2 ? ' on' : ''}" data-val="${n*2}" aria-label="Rate ${n*2} out of 10">★</span>
          `).join('')}
        </div>
        <span class="rating-val" id="modal-rating-val">${myR ? myR/2 + '/5' : 'Not rated'}</span>
      </div>

      <!-- Watchlist Actions -->
      <div class="modal-actions">
        <button class="modal-btn primary" onclick="addToWatchlist('${type}', ${id}, 'plantowatch')">🔖 Plan to Watch</button>
        <button class="modal-btn" onclick="addToWatchlist('${type}', ${id}, 'watching')">▶ Watching</button>
        <button class="modal-btn" onclick="addToWatchlist('${type}', ${id}, 'completed')">✅ Completed</button>
        ${wlStat ? `<button class="modal-btn" onclick="removeFromWatchlist('${type}', ${id})">🗑 Remove</button>` : ''}
      </div>
      ${wlStat ? `<p style="font-size:.8rem;color:var(--text-muted);margin-bottom:14px">Status: ${wlStatusLabel(wlStat)}</p>` : ''}

      <!-- Streaming Providers -->
      ${providers && (providers.flatrate.length || providers.rent.length) ? `
        <div style="margin-bottom:16px">
          <div style="font-size:.85rem;font-weight:700;margin-bottom:8px;color:var(--text-muted)">Where to Watch ${providers.link ? `<a href="${providers.link}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:400;font-size:.78rem;margin-left:6px">View all ↗</a>` : ''}</div>
          ${providers.flatrate.length ? `
            <div style="font-size:.75rem;color:var(--text-muted);margin-bottom:5px">Stream</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">
              ${providers.flatrate.map(p => `
                <div title="${p.provider_name}" style="display:flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:.75rem">
                  ${p.logo_path ? `<img src="https://image.tmdb.org/t/p/w45${p.logo_path}" alt="${p.provider_name}" style="width:20px;height:20px;border-radius:3px" />` : ''}
                  ${p.provider_name}
                </div>`).join('')}
            </div>` : ''}
          ${providers.rent.length ? `
            <div style="font-size:.75rem;color:var(--text-muted);margin-bottom:5px">Rent / Buy</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">
              ${providers.rent.slice(0,6).map(p => `
                <div title="${p.provider_name}" style="display:flex;align-items:center;gap:5px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:.75rem">
                  ${p.logo_path ? `<img src="https://image.tmdb.org/t/p/w45${p.logo_path}" alt="${p.provider_name}" style="width:20px;height:20px;border-radius:3px" />` : ''}
                  ${p.provider_name}
                </div>`).join('')}
            </div>` : ''}
        </div>` : providers ? '<p style="font-size:.78rem;color:var(--text-muted);margin-bottom:14px">No US streaming info available.</p>' : ''}

      <!-- Similar -->
      <div id="modal-similar"></div>
    </div>
  `;

  // Bind rating stars
  document.querySelectorAll('.rating-stars .star').forEach(star => {
    star.addEventListener('click', () => {
      const val = parseInt(star.dataset.val);
      setRating(type, id, val, genres.map(g => g.id));
      document.querySelectorAll('.rating-stars .star').forEach(s => {
        s.classList.toggle('on', val >= parseInt(s.dataset.val));
      });
      document.getElementById('modal-rating-val').textContent = val/2 + '/5';
      if (state.simklToken) pushRatingToSimkl(type, id, val);
    });
  });

  // Load similar
  loadSimilar(type, id);
}

async function loadSimilar(type, id) {
  try {
    const data = await tmdb(`/${type}/${id}/similar`);
    const items = (data.results || []).slice(0, 8);
    if (!items.length) return;
    const wrap = document.getElementById('modal-similar');
    if (!wrap) return;
    wrap.innerHTML = `<div class="modal-similar-title">Similar</div><div class="card-row" id="similar-row"></div>`;
    const row = document.getElementById('similar-row');
    items.forEach(item => {
      item.media_type = type;
      row.appendChild(buildCard(item));
    });
  } catch (e) { console.warn('Load similar failed:', e); }
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();

  // Keyboard shortcuts
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  if (e.key === '/' || e.key === 's') {
    e.preventDefault();
    document.getElementById('search-input').focus();
  }
  if (e.key === 't') {
    e.preventDefault();
    document.querySelector('[data-view="trending"]').click();
  }
  if (e.key === 'c') {
    e.preventDefault();
    document.querySelector('[data-view="calendar"]').click();
  }
  if (e.key === 'u') {
    e.preventDefault();
    document.querySelector('[data-view="upcoming"]').click();
  }
  if (e.key === 'w') {
    e.preventDefault();
    document.querySelector('[data-view="watchlist"]').click();
  }
  if (e.key === 'r') {
    e.preventDefault();
    document.querySelector('[data-view="recommended"]').click();
  }
  if (e.key === 'd') {
    e.preventDefault();
    toggleTheme();
  }
});

/* ─────────────────────────────────────────────────────────────────────
   WATCHLIST MANAGEMENT
   ───────────────────────────────────────────────────────────────────── */
function addToWatchlist(type, id, status) {
  const key = mediaKey(type, id);
  state.watchlist[key] = status;
  saveWatchlist();
  toast(`Added to ${wlStatusLabel(status)}`);
  if (state.simklToken) pushWatchlistToSimkl(type, id, status);
  closeModal();
}

function removeFromWatchlist(type, id) {
  const key = mediaKey(type, id);
  const title = state.mediaDetails[key]?.title || 'this item';
  if (!confirm(`Remove "${title}" from your watchlist?`)) return;
  delete state.watchlist[key];
  saveWatchlist();
  toast('Removed from list');
  closeModal();
}

/* ─────────────────────────────────────────────────────────────────────
   VIEWS
   ───────────────────────────────────────────────────────────────────── */
async function renderView() {
  updateSimklUI();
  const main = document.getElementById('main-content');

  // Nav tab highlight
  document.querySelectorAll('.nav-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.view === state.view);
  });

  // Show loading indicator
  main.innerHTML = '<div class="empty-state"><div class="icon">⏳</div><p>Loading…</p></div>';

  switch (state.view) {
    case 'trending':   await renderTrending(main);   break;
    case 'calendar':   await renderCalendar(main);   break;
    case 'upcoming':   await renderUpcoming(main);   break;
    case 'watchlist':  await renderWatchlist(main);    break;
    case 'recommended':await renderRecommended(main); break;
    case 'search':     await renderSearch(main);      break;
    case 'quickrate':  await renderQuickRate(main);   break;
    case 'stats':      renderStats(main);             break;
  }
}

/* ── TRENDING ─────────────────────────────────────────────────────── */
async function renderTrending(main) {
  addSkeletonRow(main, 'Trending This Week 🔥');
  addSkeletonRow(main, 'Popular Movies 🎬');
  addSkeletonRow(main, 'Popular TV Shows 📺');

  try {
    const providerParam = state.provider
      ? { watch_region: 'US', with_watch_providers: state.provider }
      : {};
    const genreParam = state.genre ? { with_genres: state.genre } : {};

    // When a streaming provider is selected, use discover (supports provider filter)
    // Otherwise use trending for the top row
    const trendingOrDiscover = state.provider
      ? tmdb('/discover/movie', { sort_by: 'popularity.desc', 'vote_count.gte': 100, ...providerParam, ...genreParam })
      : tmdb('/trending/all/week');

    const [trending, popMovies, popTV, onAir] = await Promise.all([
      trendingOrDiscover,
      tmdb('/discover/movie', { sort_by: state.sort, 'vote_count.gte': 100, ...providerParam, ...genreParam }),
      tmdb('/discover/tv',    { sort_by: state.sort, 'vote_count.gte': 50,  ...providerParam, ...genreParam }),
      tmdb('/tv/on_the_air'),
    ]);

    main.innerHTML = '';
    const trendingLabel = state.provider
      ? `🎬 Movies on ${document.getElementById('provider-filter').selectedOptions[0]?.text || 'Service'}`
      : 'Trending This Week 🔥';

    renderRow(main, trendingLabel, (trending.results || []).map(m => state.provider ? {...m, media_type:'movie'} : m));
    renderRow(main, 'Popular Movies 🎬',   await filterResults((popMovies.results || []).map(m => ({...m, media_type:'movie'}))));
    renderRow(main, 'Popular TV Shows 📺', await filterResults((popTV.results    || []).map(t => ({...t, media_type:'tv'}))));
    renderRow(main, 'Currently On Air 📡', await filterResults((onAir.results    || []).map(t => ({...t, media_type:'tv'}))));
  } catch(e) {
    main.innerHTML = `<div class="empty-state"><div class="icon">⚠️</div><p>Failed to load: ${e.message}</p><p style="margin-top:8px;font-size:.8rem">Check that your TMDB token is valid.</p></div>`;
  }
}

/* ── CALENDAR ─────────────────────────────────────────────────────── */
async function renderCalendar(main) {
  main.innerHTML = `
    <div class="section">
      <div class="cal-month-nav">
        <button onclick="calPrev()">◀ Prev</button>
        <span id="cal-month-label"></span>
        <button onclick="calNext()">Next ▶</button>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;font-size:.78rem;color:var(--text-muted);align-items:center">
        <span>Legend:</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#1a6ef5;border-radius:2px;margin-right:4px"></span>TV Episode</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:2px;margin-right:4px"></span>Movie Release</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#1ce783;border-radius:2px;margin-right:4px"></span>My Watchlist</span>
        ${state.simklToken ? `<button class="modal-btn" onclick="markAllEpisodesWatched()" style="margin-left:auto;font-size:.75rem;padding:4px 10px">✓ Mark All Watched</button>` : `<span style="margin-left:auto;color:var(--accent)">⚠ <a href="#" onclick="simklAuth();return false" style="color:var(--accent)">Connect Simkl</a> to mark episodes</span>`}
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div id="cal-loading" style="text-align:center;padding:20px;color:var(--text-muted);font-size:.85rem"></div>
    </div>`;

  buildCalendarGrid();
  await populateCalendar();
}

function calPrev() {
  state.calMonth--;
  if (state.calMonth < 0) { state.calMonth = 11; state.calYear--; }
  buildCalendarGrid();
  populateCalendar();
}
function calNext() {
  state.calMonth++;
  if (state.calMonth > 11) { state.calMonth = 0; state.calYear++; }
  buildCalendarGrid();
  populateCalendar();
}

function buildCalendarGrid() {
  const label = document.getElementById('cal-month-label');
  const grid  = document.getElementById('cal-grid');
  if (!label || !grid) return;

  const monthName = new Date(state.calYear, state.calMonth, 1)
    .toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  label.textContent = monthName;

  const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const firstDay = new Date(state.calYear, state.calMonth, 1).getDay();
  const numDays  = new Date(state.calYear, state.calMonth + 1, 0).getDate();
  const today    = new Date();

  let html = days.map(d => `<div class="cal-day-header">${d}</div>`).join('');
  for (let i = 0; i < firstDay; i++) html += '<div></div>';
  for (let d = 1; d <= numDays; d++) {
    const isToday = today.getFullYear() === state.calYear &&
                    today.getMonth() === state.calMonth &&
                    today.getDate() === d;
    const dateStr = `${state.calYear}-${String(state.calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    html += `<div class="cal-day${isToday ? ' today' : ''}" data-date="${dateStr}">
      <div class="cal-day-num">${d}</div>
    </div>`;
  }
  grid.innerHTML = html;
}

// Place an item pill on the calendar grid
// epLabel: optional episode label shown in the pill (e.g. "S27E03")
// showId: optional TMDB show ID for mark-watched functionality
// episodeData: optional { season_number, episode_number } for Simkl history write
function addCalItem(dateStr, label, cssClass, tooltip, onClick, epLabel, showId, episodeData) {
  const cell = document.querySelector(`.cal-day[data-date="${dateStr}"]`);
  if (!cell) return;

  const wrapper = document.createElement('div');
  wrapper.style.cssText = 'position:relative;margin-bottom:3px';

  const div = document.createElement('div');
  div.className = `cal-item ${cssClass}`;
  const displayLabel = epLabel ? `${epLabel} ${label}` : label;
  div.textContent = displayLabel;
  div.title = tooltip || displayLabel;
  if (onClick) div.addEventListener('click', e => { e.stopPropagation(); onClick(); });

  // Store episode data for bulk mark function
  if (showId && episodeData) {
    div.dataset.showId = showId;
    div.dataset.season = episodeData.season_number;
    div.dataset.episode = episodeData.episode_number;
  }

  wrapper.appendChild(div);

  // Mark Watched button — only for personal shows when Simkl is connected
  if (showId && episodeData && state.simklToken && cssClass.includes('my-show')) {
    const watchedKey = `watched_${showId}_s${episodeData.season_number}e${episodeData.episode_number}`;
    const alreadyWatched = LS.get(watchedKey);

    const btn = document.createElement('button');
    btn.title = alreadyWatched ? 'Marked as watched' : 'Mark as watched';
    btn.textContent = alreadyWatched ? '✅' : '○';
    btn.style.cssText = `position:absolute;top:1px;right:2px;background:none;border:none;font-size:.65rem;cursor:pointer;color:${alreadyWatched ? '#1ce783' : 'var(--text-muted)'};padding:0;line-height:1`;
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      if (alreadyWatched) return;
      btn.textContent = '⏳';
      await markEpisodeWatched(showId, episodeData.season_number, episodeData.episode_number);
      LS.set(watchedKey, true);
      btn.textContent = '✅';
      btn.style.color = '#1ce783';
      btn.title = 'Marked as watched';
      toast(`✅ Marked S${String(episodeData.season_number).padStart(2,'0')}E${String(episodeData.episode_number).padStart(2,'0')} as watched`);
    });
    wrapper.appendChild(btn);
  }

  cell.appendChild(wrapper);
}

// Write watch history to Simkl
async function markEpisodeWatched(showTmdbId, season, episode) {
  if (!state.simklToken) return;
  try {
    await simklPost('/sync/history', {
      shows: [{
        ids: { tmdb: showTmdbId },
        seasons: [{
          number: season,
          episodes: [{ number: episode }]
        }]
      }]
    });
  } catch(e) {
    console.warn('Mark watched failed:', e);
    toast('Failed to mark as watched');
  }
}

// Mark all unwatched episodes in current calendar month as watched
async function markAllEpisodesWatched() {
  if (!state.simklToken) return;
  const unwatchedBtns = document.querySelectorAll('.cal-item.my-show button:not([style*="color: #1ce783"])');
  if (unwatchedBtns.length === 0) {
    toast('No unwatched episodes this month');
    return;
  }

  if (!confirm(`Mark ${unwatchedBtns.length} episodes as watched?`)) return;

  toast(`Marking ${unwatchedBtns.length} episodes as watched...`);
  let marked = 0;

  for (const btn of unwatchedBtns) {
    try {
      const wrapper = btn.parentElement;
      const div = wrapper.querySelector('.cal-item');
      const showId = parseInt(div.dataset.showId);
      const season = parseInt(div.dataset.season);
      const episode = parseInt(div.dataset.episode);

      if (showId && season && episode) {
        await markEpisodeWatched(showId, season, episode);
        const watchedKey = `watched_${showId}_s${season}e${episode}`;
        LS.set(watchedKey, true);
        btn.textContent = '✅';
        btn.style.color = '#1ce783';
        btn.title = 'Marked as watched';
        marked++;
      }
    } catch (e) {
      console.warn('Failed to mark episode:', e);
    }
  }

  toast(`✅ Marked ${marked} episodes as watched`);
}

async function populateCalendar() {
  const yr      = state.calYear;
  const mo      = state.calMonth; // 0-indexed
  const moStr   = String(mo + 1).padStart(2, '0');
  const dateFrom = `${yr}-${moStr}-01`;
  const dateTo   = `${yr}-${moStr}-31`;
  const loading  = document.getElementById('cal-loading');
  if (loading) loading.textContent = 'Loading…';

  // Date range for "is this episode in our calendar month?"
  const rangeStart = new Date(yr, mo, 1);
  const rangeEnd   = new Date(yr, mo + 1, 0, 23, 59, 59);

  function inRange(dateStr) {
    if (!dateStr) return false;
    const d = new Date(dateStr + 'T12:00:00');
    return d >= rangeStart && d <= rangeEnd;
  }

  let itemCount = 0;

  // ── 1. TMDB movie releases this month ─────────────────────────────
  try {
    const [pg1, pg2] = await Promise.all([
      tmdb('/discover/movie', {
        'primary_release_date.gte': dateFrom,
        'primary_release_date.lte': dateTo,
        sort_by: 'popularity.desc',
        'vote_count.gte': 5,
        page: 1,
      }),
      tmdb('/discover/movie', {
        'primary_release_date.gte': dateFrom,
        'primary_release_date.lte': dateTo,
        sort_by: 'popularity.desc',
        'vote_count.gte': 5,
        page: 2,
      }),
    ]);
    [...(pg1.results||[]), ...(pg2.results||[])].forEach(m => {
      if (!m.release_date || !inRange(m.release_date)) return;
      addCalItem(m.release_date, m.title, 'movie',
        `🎬 ${m.title}`, () => openModal('movie', m.id, m));
      itemCount++;
    });
  } catch(e) { console.warn('TMDB movies failed:', e); toast('Failed to load movie releases'); }

  // ── 2. TMDB TV episodes airing this month (popular shows) ─────────
  try {
    const tvDiscover = await tmdb('/discover/tv', {
      'air_date.gte': dateFrom,
      'air_date.lte': dateTo,
      sort_by: 'popularity.desc',
      'vote_count.gte': 20,
      page: 1,
    });
    (tvDiscover.results || []).forEach(show => {
      // Use first_air_date as a fallback date for the calendar
      const d = show.first_air_date;
      if (!d || !inRange(d)) return;
      addCalItem(d, show.name, 'tv',
        `📺 ${show.name}`, () => openModal('tv', show.id, show));
      itemCount++;
    });
  } catch(e) { console.warn('TMDB TV discover failed:', e); toast('Failed to load TV shows'); }

  // ── 3. Your Simkl library shows — fetch current season episodes ────
  // Combines: local watchlist + Simkl connected library
  const myShowIds = new Set();

  // From local watchlist
  Object.keys(state.watchlist)
    .filter(k => k.startsWith('tv_'))
    .forEach(k => myShowIds.add(parseInt(k.replace('tv_', ''))));

  // From Simkl library
  if (state.simklToken && state.simklLibrary.length) {
    state.simklLibrary
      .filter(i => i.media_type === 'tv' && i.show?.ids?.tmdb)
      .forEach(i => myShowIds.add(i.show.ids.tmdb));
  }

  if (myShowIds.size > 0) {
    if (loading) loading.textContent = `Loading your ${myShowIds.size} shows…`;

    await Promise.allSettled([...myShowIds].map(async (showId) => {
      try {
        const detail = await tmdb(`/tv/${showId}`);
        const showName = detail.name;
        const currentSeason = detail.number_of_seasons;
        if (!currentSeason) return;

        // Fetch the current season's episodes
        const seasonData = await tmdb(`/tv/${showId}/season/${currentSeason}`);
        const episodes = seasonData.episodes || [];

        episodes.forEach(ep => {
          if (!ep.air_date || !inRange(ep.air_date)) return;
          const epLabel = `S${String(ep.season_number).padStart(2,'0')}E${String(ep.episode_number).padStart(2,'0')}`;
          addCalItem(
            ep.air_date,
            showName,
            'tv my-show',
            `⭐ ${showName} ${epLabel}: ${ep.name || ''}`,
            () => openModal('tv', showId, detail),
            epLabel,
            showId,
            { season_number: ep.season_number, episode_number: ep.episode_number }
          );
          itemCount++;
        });

        // Also check next_episode_to_air in case it's a future episode
        const next = detail.next_episode_to_air;
        if (next && next.air_date && inRange(next.air_date)) {
          const epLabel = `S${String(next.season_number).padStart(2,'0')}E${String(next.episode_number).padStart(2,'0')}`;
          // Only add if not already added from season fetch
          const alreadyAdded = document.querySelector(
            `.cal-day[data-date="${next.air_date}"] .my-show`
          );
          if (!alreadyAdded) {
            addCalItem(
              next.air_date,
              showName,
              'tv my-show',
              `⭐ ${showName} ${epLabel} (next)`,
              () => openModal('tv', showId, detail),
              epLabel,
              showId,
              { season_number: next.season_number, episode_number: next.episode_number }
            );
            itemCount++;
          }
        }
      } catch(e) { console.warn(`Failed to load show ${showId}:`, e); }
    }));
  }

  if (loading) {
    if (itemCount > 0) {
      const myCount = document.querySelectorAll('.cal-item.my-show').length;
      loading.textContent = `${itemCount} events — ${myCount} from your watchlist`;
    } else {
      loading.innerHTML = `No events found. <a href="#" onclick="document.querySelector('[data-view=trending]').click();return false" style="color:var(--accent)">Browse Trending</a> and add shows to your watchlist to see their episodes here.`;
    }
  }
}

/* ── UPCOMING ─────────────────────────────────────────────────────── */
async function renderUpcoming(main) {
  addSkeletonRow(main, 'Upcoming Movies 🎬');
  addSkeletonRow(main, 'New TV Premieres 📺');

  const today     = new Date();
  const todayStr  = today.toISOString().slice(0, 10);
  const future    = new Date(today); future.setDate(today.getDate() + 60);
  const futureStr = future.toISOString().slice(0, 10);

  const providerParam = state.provider
    ? { watch_region: 'US', with_watch_providers: state.provider }
    : {};

  const [upMovies, tvPrem] = await Promise.all([
    tmdb('/discover/movie', {
      'primary_release_date.gte': todayStr,
      'primary_release_date.lte': futureStr,
      sort_by: 'popularity.desc',
      'vote_count.gte': 0,
      ...providerParam,
      ...(state.genre ? { with_genres: state.genre } : {}),
    }),
    tmdb('/discover/tv', {
      'air_date.gte': todayStr,
      'air_date.lte': futureStr,
      sort_by: 'popularity.desc',
      'vote_count.gte': 10,
      ...providerParam,
      ...(state.genre ? { with_genres: state.genre } : {}),
    }),
  ]);

  main.innerHTML = '';
  const movies = (upMovies.results || []).map(m => ({...m, media_type:'movie'}));
  const shows  = (tvPrem.results   || []).map(t => ({...t, media_type:'tv'}));

  renderRow(main, 'Upcoming Movies 🎬', await filterResults(movies));
  renderRow(main, 'Premiering / On Air Soon 📺', await filterResults(shows));

  // Release schedule — only items with dates within next 60 days
  const listSection = document.createElement('div');
  listSection.className = 'section';
  listSection.innerHTML = `
    <div class="section-header"><span class="section-title">Release Schedule — Next 60 Days</span></div>
    <div style="display:flex;flex-direction:column;gap:8px" id="release-list"></div>
  `;
  main.appendChild(listSection);
  const releaseList = document.getElementById('release-list');

  const nowMs  = today.getTime();
  const endMs  = future.getTime();

  const sorted = [...movies, ...shows]
    .filter(i => {
      const d = new Date((i.release_date || i.first_air_date) + 'T12:00:00').getTime();
      return d >= nowMs && d <= endMs;
    })
    .sort((a, b) => {
      const da = new Date((a.release_date || a.first_air_date) + 'T12:00:00');
      const db = new Date((b.release_date || b.first_air_date) + 'T12:00:00');
      return da - db;
    });

  if (!sorted.length) {
    releaseList.innerHTML = `<p style="color:var(--text-muted);font-size:.85rem;padding:8px 0">No upcoming releases found for the selected filters.</p>`;
  }

  sorted.slice(0, 30).forEach(item => {
    const title    = item.title || item.name;
    const dateStr  = item.release_date || item.first_air_date;
    const date     = formatDate(dateStr);
    const daysAway = Math.ceil((new Date(dateStr + 'T12:00:00') - today) / 86400000);
    const daysLabel = daysAway === 0 ? 'Today!' : daysAway === 1 ? 'Tomorrow' : `in ${daysAway}d`;

    const el = document.createElement('div');
    el.style.cssText = 'display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;cursor:pointer;transition:border-color .15s';
    el.onmouseover = () => el.style.borderColor = 'var(--accent)';
    el.onmouseout  = () => el.style.borderColor = 'var(--border)';
    el.innerHTML = `
      <div style="min-width:90px;text-align:right">
        <div style="font-size:.75rem;color:var(--accent);font-weight:700">${date}</div>
        <div style="font-size:.68rem;color:var(--text-muted)">${daysLabel}</div>
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</div>
        <div style="font-size:.73rem;color:var(--text-muted)">${item.media_type === 'movie' ? '🎬 Movie' : '📺 TV'} ${score(item) ? '· ⭐ ' + score(item) : ''}</div>
      </div>
    `;
    el.addEventListener('click', () => openModal(item.media_type, item.id, item));
    releaseList.appendChild(el);
  });
}

/* ── WATCHLIST ────────────────────────────────────────────────────── */
async function renderWatchlist(main) {
  const statuses = ['watching', 'plantowatch', 'completed', 'hold', 'dropped'];

  if (!state.simklToken) {
    const prompt = document.createElement('div');
    prompt.className = 'simkl-prompt';
    prompt.innerHTML = `
      <span style="font-size:2rem">▶</span>
      <p>Connect Simkl to sync your watchlist, history, and ratings across devices.</p>
      <button class="modal-btn primary" onclick="simklAuth()">Connect Simkl</button>
    `;
    main.appendChild(prompt);
  }

  const entries = Object.entries(state.watchlist);
  if (!entries.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = '<div class="icon">📋</div>Your list is empty. Browse Trending or Upcoming and add items!';
    main.appendChild(empty);
    return;
  }

  // Pre-fetch TMDB details for any items not yet cached
  const missing = entries.filter(([key]) => !state.mediaDetails[key]).map(([key]) => key);
  if (missing.length) {
    await Promise.allSettled(missing.map(async key => {
      const [type, idStr] = key.split('_');
      const id = parseInt(idStr);
      try {
        const detail = await tmdb(`/${type}/${id}`);
        state.mediaDetails[key] = {
          title: detail.title || detail.name,
          poster_path: detail.poster_path,
          media_type: type,
          id,
          vote_average: detail.vote_average,
          release_date: detail.release_date,
          first_air_date: detail.first_air_date,
          genre_ids: (detail.genres || []).map(g => g.id),
        };
      } catch (e) { console.warn('Cache fetch failed:', e); }
    }));
    saveMediaDetails();
  }

  statuses.forEach(status => {
    const items = entries.filter(([, s]) => s === status);
    if (!items.length) return;

    const sec = document.createElement('div');
    sec.className = 'section';
    sec.innerHTML = `<div class="section-header"><span class="section-title">${wlStatusLabel(status)} <span style="color:var(--text-muted);font-size:.8rem;font-weight:400">(${items.length})</span></span></div><div class="watchlist-grid" id="wl-${status}"></div>`;
    main.appendChild(sec);

    const grid = sec.querySelector('.watchlist-grid');
    items.forEach(([key]) => {
      const cached = state.mediaDetails[key];
      const item = cached ? { ...cached } : { id: parseInt(key.split('_')[1]), media_type: key.split('_')[0] };
      const card = buildCard(item);
      grid.appendChild(card);
    });
  });
}

/* ── RECOMMENDED ──────────────────────────────────────────────────── */
async function renderRecommended(main) {
  const affinity = LS.get('genre_affinity') || {};
  const myRatings = state.ratings;
  const hasData = Object.keys(myRatings).length > 0;

  if (!hasData) {
    main.innerHTML = `<div class="empty-state"><div class="icon">✨</div><p>Rate some movies and shows to get personalized recommendations!</p><p style="margin-top:8px;font-size:.8rem">Browse Trending and click the ★ stars to rate items.</p></div>`;
    return;
  }

  addSkeletonRow(main, 'Recommended For You ✨');

  // Get top genres from affinity
  const topGenres = Object.entries(affinity)
    .sort(([,a],[,b]) => b - a)
    .slice(0, 3)
    .map(([id]) => id);

  const fetchRec = async (mediaType, label) => {
    const params = { sort_by: 'popularity.desc', page: 1, 'vote_count.gte': 100 };
    if (topGenres.length) params.with_genres = topGenres.slice(0, 2).join(',');
    const path = mediaType === 'movie' ? '/discover/movie' : '/discover/tv';
    const data = await tmdb(path, params);
    const results = (data.results || [])
      .map(i => ({ ...i, media_type: mediaType }))
      .filter(i => !state.watchlist[mediaKey(mediaType, i.id)])
      .filter(i => !state.ratings[mediaKey(mediaType, i.id)])
      .sort((a, b) => recScore(b) - recScore(a))
      .slice(0, 20);
    return { label, results };
  };

  const [recMovies, recTV] = await Promise.all([
    fetchRec('movie', '🎬 Recommended Movies'),
    fetchRec('tv',    '📺 Recommended Shows'),
  ]);

  main.innerHTML = '';

  if (topGenres.length) {
    const genreNames = { 28:'Action', 35:'Comedy', 18:'Drama', 27:'Horror', 878:'Sci-Fi', 10749:'Romance', 53:'Thriller', 16:'Animation', 12:'Adventure', 99:'Documentary', 10765:'Sci-Fi & Fantasy', 10759:'Action & Adventure', 10768:'War & Politics', 37:'Western' };
    const genreLabel = topGenres.map(id => genreNames[id] || `Genre ${id}`).join(', ');
    const info = document.createElement('p');
    info.style.cssText = 'font-size:.83rem;color:var(--text-muted);padding:0 0 12px';
    info.textContent = `Recommendations based on your top genres: ${genreLabel}`;
    main.appendChild(info);
  }

  renderRow(main, recMovies.label, recMovies.results, true);
  renderRow(main, recTV.label,    recTV.results,    true);

  // Also show highly-rated similar items using real cached titles
  const topRated = Object.entries(state.ratings)
    .sort(([,a],[,b]) => b - a)
    .slice(0, 3);

  for (const [key] of topRated) {
    const [type, idStr] = key.split('_');
    const cached = state.mediaDetails[key];
    const displayTitle = cached?.title || null;

    try {
      // Fetch title if not cached
      let title = displayTitle;
      if (!title) {
        const detail = await tmdb(`/${type}/${idStr}`);
        title = detail.title || detail.name;
        state.mediaDetails[key] = { ...state.mediaDetails[key], title, media_type: type, id: parseInt(idStr) };
        saveMediaDetails();
      }

      const data = await tmdb(`/${type}/${idStr}/similar`);
      const results = (data.results || [])
        .map(i => ({ ...i, media_type: type }))
        .filter(i => !state.ratings[mediaKey(type, i.id)])
        .slice(0, 10);
      if (results.length) {
        renderRow(main, `Because you liked ${type === 'movie' ? '🎬' : '📺'} ${title}`, results);
      }
    } catch (e) { console.warn('Similar items fetch failed:', e); }
  }
}

let searchQuery = '';
let searchResults = [];
async function doSearch() {
  searchQuery = document.getElementById('search-input').value.trim();
  if (!searchQuery) return;
  state.searchPage = 1;
  state.view = 'search';
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  renderView();
}
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});

async function loadMoreSearchResults() {
  state.searchPage++;
  try {
    const [movies, shows] = await Promise.all([
      tmdb('/search/movie', { query: searchQuery, page: state.searchPage }),
      tmdb('/search/tv',    { query: searchQuery, page: state.searchPage }),
    ]);
    const newResults = [
      ...(movies.results || []).map(m => ({ ...m, media_type: 'movie' })),
      ...(shows.results  || []).map(t => ({ ...t, media_type: 'tv' })),
    ].sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
    searchResults.push(...newResults);
    const main = document.getElementById('main-content');
    const loadMoreBtn = document.getElementById('load-more-btn');
    if (loadMoreBtn) loadMoreBtn.remove();
    renderRow(main, `Search results for "${searchQuery}" (page ${state.searchPage})`, newResults);
    if (newResults.length > 0) {
      addLoadMoreButton(main);
    }
  } catch (e) {
    console.warn('Load more failed:', e);
    toast('Failed to load more results');
  }
}

function addLoadMoreButton(main) {
  const btn = document.createElement('button');
  btn.id = 'load-more-btn';
  btn.className = 'modal-btn';
  btn.style.cssText = 'display:block;margin:20px auto;padding:10px 24px';
  btn.textContent = 'Load More Results';
  btn.onclick = loadMoreSearchResults;
  main.appendChild(btn);
}

async function renderSearch(main) {
  main.innerHTML = '<div class="empty-state"><div class="icon">🔍</div>Searching…</div>';
  try {
    const [movies, shows] = await Promise.all([
      tmdb('/search/movie', { query: searchQuery, page: state.searchPage }),
      tmdb('/search/tv',    { query: searchQuery, page: state.searchPage }),
    ]);
    searchResults = [
      ...(movies.results || []).map(m => ({ ...m, media_type: 'movie' })),
      ...(shows.results  || []).map(t => ({ ...t, media_type: 'tv' })),
    ].sort((a, b) => (b.popularity || 0) - (a.popularity || 0));

    main.innerHTML = '';
    if (!searchResults.length) {
      main.innerHTML = `<div class="empty-state"><div class="icon">🔍</div>No results for "${searchQuery}"</div>`;

    }
    renderRow(main, `Search results for "${searchQuery}"`, searchResults);

    console.warn('Search failed:', e);
    main.innerHTML = '<div class="empty-state">Search failed. Try again.</div>';

}

async function renderQuickRate(main) {

function renderQuickRateRow(container, title, items) {
  const sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = `<div class="section-header"><span class="section-title">${title}</span></div><div class="card-row" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px"></div>`;
  const row = sec.querySelector('.card-row');

  if (!items.length) {
    sec.querySelector('.card-row').outerHTML = `<p style="color:var(--text-muted);font-size:.85rem">No results found.</p>`;
  } else {
    items.forEach(item => {
      const card = buildQuickRateCard(item);
      row.appendChild(card);
    });
  }
  container.appendChild(sec);
}

function buildQuickRateCard(item) {
  const key = mediaKey(item.media_type, item.id);
  const currentRating = getRating(item.media_type, item.id);
  const title = item.title || item.name;
  const poster = item.poster_path ? `${IMG_BASE}${item.poster_path}` : '';
  const year = (item.release_date || item.first_air_date || '').slice(0, 4);

  const card = document.createElement('div');
  card.className = 'card';
  card.style.cssText = 'display:flex;flex-direction:column;gap:8px';

  card.innerHTML = `
    <div style="position:relative;aspect-ratio:2/3;background:var(--surface2);border-radius:8px;overflow:hidden;cursor:pointer" onclick="openModal('${item.media_type}', ${item.id}, ${JSON.stringify(item).replace(/"/g, '&quot;')})">
      ${poster ? `<img src="${poster}" alt="${title}" style="width:100%;height:100%;object-fit:cover" loading="lazy">` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted)">🎬</div>'}
    </div>
    <div style="flex:1">
      <div style="font-weight:600;font-size:0.9rem;line-height:1.3;margin-bottom:4px">${title}</div>
      <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:8px">${year} • ${item.media_type === 'movie' ? 'Movie' : 'TV'}</div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="thumbs-btn ${currentRating >= 8 ? 'active' : ''}" onclick="quickRate('${item.media_type}', ${item.id}, 10, this)" title="👍 Thumbs Up (10)">
          👍
        </button>
        <button class="thumbs-btn ${currentRating > 0 && currentRating < 8 ? 'active' : ''}" onclick="quickRate('${item.media_type}', ${item.id}, 5, this)" title="👎 Thumbs Down (5)">
          👎
        </button>
        <button class="thumbs-btn ${currentRating === 0 ? 'active' : ''}" onclick="quickRate('${item.media_type}', ${item.id}, 0, this)" title="Remove rating">
          ✕
        </button>
      </div>
    </div>
  `;

  return card;
}

async function quickRate(type, id, rating, btn) {
  const key = mediaKey(type, id);
  state.ratings[key] = rating;
  saveRatings();

  // Update button states
  const container = btn.parentElement;
  container.querySelectorAll('.thumbs-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  // Update genre affinity
  if (rating > 0) {
    const details = state.mediaDetails[key];
    if (details && details.genre_ids) {
      const affinity = LS.get('genre_affinity') || {};
      details.genre_ids.forEach(gid => {
        affinity[gid] = (affinity[gid] || 0) + rating;
      });
      LS.set('genre_affinity', affinity);
    }
  }

  // Sync to Simkl
  if (state.simklToken) {
    await pushRatingToSimkl(type, id, rating);
  }

  toast(rating === 0 ? 'Rating removed' : `Rated ${rating}/10`);
}
