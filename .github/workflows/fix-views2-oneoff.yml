name: Fix views2 one-off
on:
  workflow_dispatch: {}
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch views2 settings panel
        run: |
          node scripts/patch-views2.mjs
          node --check sites/whats-happening/js/views2.js
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sites/whats-happening/js/views2.js
          git diff --cached --quiet || (git commit -m "Source-remove browser key panel from Settings, keep auto-sync note" && git push)
