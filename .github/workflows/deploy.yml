name: Build & Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Fail the build on a JS syntax error instead of shipping it
      - name: Syntax-check whats-happening JS
        run: |
          for f in sites/whats-happening/js/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Syntax-check smoke script
        run: node --check scripts/smoke-whats-happening.mjs

      # Refuse to publish a site whose live feed is missing, empty or stale.
      # scripts/check-live.mjs explains what it found and exits non-zero.
      - name: Verify live feed is present and fresh
        run: node scripts/check-live.mjs

      - name: Smoke test whats-happening
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i -D playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8099 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          sleep 2
          node scripts/smoke-whats-happening.mjs http://127.0.0.1:8099/sites/whats-happening/

      # Preflight: confirm source file and secrets
      - name: Preflight checks
        run: |
          echo "=== Working directory ==="
          pwd
          echo "=== Files present ==="
          ls -lh
          if [ ! -f showsnew.html ]; then
            echo "::error::showsnew.html not found in repo root."
            exit 1
          fi
          echo "OK: showsnew.html present ($(wc -c < showsnew.html) bytes)"
          echo "=== First 3 lines ==="
          head -3 showsnew.html
          if [ -z "$PAGE_PASSWORD" ]; then
            echo "::error::PAGE_PASSWORD secret is not set."
            exit 1
          fi
          echo "PAGE_PASSWORD is set (length: ${#PAGE_PASSWORD})"
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}

      - name: Install pagecrypt
        run: |
          npm install -g pagecrypt
          pagecrypt --version

      - name: Inject TMDB token
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          if [ -z "$TMDB_TOKEN" ]; then
            echo "::error::TMDB_TOKEN secret is not set."
            exit 1
          fi
          if ! grep -q '__TMDB_TOKEN__' showsnew.html; then
            echo "::error::Placeholder __TMDB_TOKEN__ not found in showsnew.html."
            exit 1
          fi
          sed -i "s|__TMDB_TOKEN__|${TMDB_TOKEN}|g" showsnew.html
          if grep -q '__TMDB_TOKEN__' showsnew.html; then
            echo "::error::Placeholder still present in showsnew.html after sed."
            exit 1
          fi
          if ! grep -q "TMDB_TOKEN = 'eyJ" showsnew.html; then
            echo "::error::Substituted value does not look like a TMDB JWT."
            exit 1
          fi
          echo "OK: token injected into showsnew.html."

      - name: Inject Fanart.tv key
        env:
          FANART_KEY: ${{ secrets.FANART_KEY }}
        run: |
          if [ -z "$FANART_KEY" ]; then
            echo "::warning::FANART_KEY secret is not set - artwork section will stay hidden."
            exit 0
          fi
          if ! grep -q '__FANART_KEY__' showsnew.html; then
            echo "::error::Placeholder __FANART_KEY__ not found in showsnew.html."
            exit 1
          fi
          sed -i "s|__FANART_KEY__|${FANART_KEY}|g" showsnew.html
          if grep -q '__FANART_KEY__' showsnew.html; then
            echo "::error::Placeholder still present in showsnew.html after sed."
            exit 1
          fi
          echo "OK: Fanart.tv key injected into showsnew.html."

      - name: Inject OMDb key
        env:
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
        run: |
          if [ -z "$OMDB_KEY" ]; then
            echo "::warning::OMDB_KEY secret is not set - IMDb scores will stay hidden."
            exit 0
          fi
          if ! grep -q '__OMDB_KEY__' showsnew.html; then
            echo "::error::Placeholder __OMDB_KEY__ not found in showsnew.html."
            exit 1
          fi
          sed -i "s|__OMDB_KEY__|${OMDB_KEY}|g" showsnew.html
          if grep -q '__OMDB_KEY__' showsnew.html; then
            echo "::error::Placeholder still present in showsnew.html after sed."
            exit 1
          fi
          echo "OK: OMDb key injected into showsnew.html."

      - name: Inject MDBList key
        env:
          MDBLIST_KEY: ${{ secrets.MDBLIST_KEY }}
        run: |
          if [ -z "$MDBLIST_KEY" ]; then
            echo "::warning::MDBLIST_KEY secret is not set - multi-source scores stay off unless a key is added in Settings."
            exit 0
          fi
          if ! grep -q '__MDBLIST_KEY__' showsnew.html; then
            echo "::error::Placeholder __MDBLIST_KEY__ not found in showsnew.html."
            exit 1
          fi
          sed -i "s|__MDBLIST_KEY__|${MDBLIST_KEY}|g" showsnew.html
          if grep -q '__MDBLIST_KEY__' showsnew.html; then
            echo "::error::Placeholder still present in showsnew.html after sed."
            exit 1
          fi
          echo "OK: MDBList key injected into showsnew.html."

      - name: Inject Trakt client id
        env:
          TRAKT_KEY: ${{ secrets.TRAKT_KEY }}
        run: |
          if [ -z "$TRAKT_KEY" ]; then
            echo "::warning::TRAKT_KEY secret is not set - Trakt community ratings stay off unless a key is added in Settings."
            exit 0
          fi
          if ! grep -q '__TRAKT_KEY__' showsnew.html; then
            echo "::error::Placeholder __TRAKT_KEY__ not found in showsnew.html."
            exit 1
          fi
          sed -i "s|__TRAKT_KEY__|${TRAKT_KEY}|g" showsnew.html
          if grep -q '__TRAKT_KEY__' showsnew.html; then
            echo "::error::Placeholder still present in showsnew.html after sed."
            exit 1
          fi
          echo "OK: Trakt client id injected into showsnew.html."

      - name: Inject Trakt client secret
        env:
          TRAKT_SECRET: ${{ secrets.TRAKT_SECRET }}
        run: |
          if [ -z "$TRAKT_SECRET" ]; then
            echo "::notice::TRAKT_SECRET is not set. That is normal: Trakt now issues PKCE apps with no client secret."
            exit 0
          fi
          if ! grep -q '__TRAKT_SECRET__' showsnew.html; then
            echo "::error::Placeholder __TRAKT_SECRET__ not found in showsnew.html."
            exit 1
          fi
          sed -i "s|__TRAKT_SECRET__|${TRAKT_SECRET}|g" showsnew.html
          if grep -q '__TRAKT_SECRET__' showsnew.html; then
            echo "::error::Placeholder still present in showsnew.html after sed."
            exit 1
          fi
          echo "OK: Trakt client secret injected into showsnew.html."

      - name: Encrypt showsnew.html
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: |
          echo "Input size: $(wc -c < showsnew.html) bytes"
          pagecrypt showsnew.html showsnew.html.enc "$PAGE_PASSWORD"
          if [ ! -f showsnew.html.enc ]; then
            echo "::error::pagecrypt produced no output."
            exit 1
          fi
          echo "Encrypted size: $(wc -c < showsnew.html.enc) bytes"
          mv showsnew.html.enc showsnew.html
          echo "Final size: $(wc -c < showsnew.html) bytes"

      - name: Verify encryption
        run: |
          if grep -q "const TMDB_TOKEN" showsnew.html; then
            echo "::error::showsnew.html still contains plaintext JS - encryption failed."
            exit 1
          fi
          echo "OK: showsnew.html is encrypted ($(wc -c < showsnew.html) bytes)."

      # Encrypt whats-happening with its own password (secret WH_PAGE_PASSWORD = EVENTS)
      - name: Encrypt whats-happening
        env:
          WH_PAGE_PASSWORD: ${{ secrets.WH_PAGE_PASSWORD }}
        run: |
          echo "Input size: $(wc -c < sites/whats-happening/index.html) bytes"
          if [ -z "$WH_PAGE_PASSWORD" ]; then
            echo "::error::WH_PAGE_PASSWORD secret is not set. Create it with value EVENTS."
            exit 1
          fi
          pagecrypt sites/whats-happening/index.html sites/whats-happening/index.html.enc "$WH_PAGE_PASSWORD"
          if [ ! -f sites/whats-happening/index.html.enc ]; then
            echo "::error::pagecrypt produced no output for whats-happening."
            exit 1
          fi
          echo "Encrypted size: $(wc -c < sites/whats-happening/index.html.enc) bytes"
          mv sites/whats-happening/index.html.enc sites/whats-happening/index.html
          echo "Final size: $(wc -c < sites/whats-happening/index.html) bytes"

      - name: Verify whats-happening encryption
        run: |
          if grep -q "id='main'" sites/whats-happening/index.html; then
            echo "::error::whats-happening index.html still contains plaintext - encryption failed."
            exit 1
          fi
          echo "OK: whats-happening is encrypted ($(wc -c < sites/whats-happening/index.html) bytes)."

      # roadtrip.html ships unencrypted, so these two values are readable in the
      # page source. Both are free, rate-limited public-data keys, and the page
      # works without them: SeatGeek just drops out and the fuel estimate keeps
      # the flat dollars-per-gallon you typed.
      - name: Inject SeatGeek client id
        env:
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
        run: |
          if [ -z "$SEATGEEK_CLIENT_ID" ]; then
            echo "::warning::SEATGEEK_CLIENT_ID secret is not set - the event search will use Ticketmaster only."
            exit 0
          fi
          if ! grep -q '__SEATGEEK_CLIENT_ID__' roadtrip.html; then
            echo "::error::Placeholder __SEATGEEK_CLIENT_ID__ not found in roadtrip.html."
            exit 1
          fi
          python3 - "$SEATGEEK_CLIENT_ID" <<'PY'
          import sys, pathlib
          value = sys.argv[1]
          path = pathlib.Path('roadtrip.html')
          text = path.read_text(encoding='utf-8')
          path.write_text(text.replace('__SEATGEEK_CLIENT_ID__', value), encoding='utf-8')
          if '__SEATGEEK_CLIENT_ID__' in path.read_text(encoding='utf-8'):
              sys.exit('::error::SeatGeek placeholder survived injection.')
          print('OK: SeatGeek client id injected.')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Verify Pages artifact
        run: |
          echo "Artifact ID: ${{ steps.upload.outputs.artifact_id }}"
          if [ -z "${{ steps.upload.outputs.artifact_id }}" ]; then
            echo "::error::Pages artifact was not uploaded."
            exit 1
          fi
          echo "Pages artifact uploaded successfully."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
