name: Build & Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Preflight: confirm source file and secrets ─────────────────
      - name: Preflight checks
        run: |
          echo "=== Working directory ==="
          pwd
          echo "=== Files present ==="
          ls -lh

          if [ ! -f showsnew.html ]; then
            echo "::error::showsnew.html not found in repo root."
            exit 1
          fi
          echo "OK: showsnew.html present ($(wc -c < showsnew.html) bytes)"
          echo "=== First 3 lines ==="
          head -3 showsnew.html

          if [ -z "$PAGE_PASSWORD" ]; then
            echo "::error::PAGE_PASSWORD secret is not set."
            exit 1
          fi
          echo "PAGE_PASSWORD is set (length: ${#PAGE_PASSWORD})"
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}

      # ── Install pagecrypt ──────────────────────────────────────────
      - name: Install pagecrypt
        run: |
          npm install -g pagecrypt
          pagecrypt --version

      # ── Inject TMDB token ──────────────────────────────────────────
      - name: Inject TMDB token
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          if [ -z "$TMDB_TOKEN" ]; then
            echo "::error::TMDB_TOKEN secret is not set."
            exit 1
          fi

          if ! grep -q '__TMDB_TOKEN__' showsnew.html; then
            echo "::error::Placeholder __TMDB_TOKEN__ not found in showsnew.html."
            exit 1
          fi

          sed -i "s|__TMDB_TOKEN__|${TMDB_TOKEN}|g" showsnew.html

          if grep -q '__TMDB_TOKEN__' showsnew.html; then
            echo "::error::Placeholder still present in showsnew.html after sed."
            exit 1
          fi

          if ! grep -q "TMDB_TOKEN = 'eyJ" showsnew.html; then
            echo "::error::Substituted value does not look like a TMDB JWT."
            exit 1
          fi

          echo "OK: token injected into showsnew.html."

      # ── Encrypt showsnew.html ──────────────────────────────────────
      - name: Encrypt showsnew.html
        env:
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
        run: |
          echo "Input size: $(wc -c < showsnew.html) bytes"
          pagecrypt showsnew.html showsnew.html.enc "$PAGE_PASSWORD"

          if [ ! -f showsnew.html.enc ]; then
            echo "::error::pagecrypt produced no output."
            exit 1
          fi

          echo "Encrypted size: $(wc -c < showsnew.html.enc) bytes"
          mv showsnew.html.enc showsnew.html
          echo "Final size: $(wc -c < showsnew.html) bytes"

      # ── Verify encryption ──────────────────────────────────────────
      - name: Verify encryption
        run: |
          if grep -q "const TMDB_TOKEN" showsnew.html; then
            echo "::error::showsnew.html still contains plaintext JS — encryption failed."
            exit 1
          fi
          echo "OK: showsnew.html is encrypted ($(wc -c < showsnew.html) bytes)."

      # ── Upload & deploy ────────────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
