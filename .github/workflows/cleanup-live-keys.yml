name: Cleanup live key path
on:
  workflow_dispatch: {}
jobs:
  finish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix stale section comment
        run: |
          node -e "const fs=require('fs'),p='sites/whats-happening/js/app.js';let s=fs.readFileSync(p,'utf8');const a='/* ---------------- live providers ---------------- */';if(!s.includes(a)){throw new Error('anchor missing')}fs.writeFileSync(p,s.replace(a,'/* ---------------- published live feed (data/live.json) ---------------- */'));"
          node --check sites/whats-happening/js/app.js
      - name: Commit and drop scaffolding
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sites/whats-happening/js/app.js
          git commit -m "Rename stale live providers section comment"
          git rm .github/workflows/cleanup-live-keys.yml scripts/cleanup-live-keys.mjs
          git commit -m "Drop one-off cleanup helpers"
          git push
