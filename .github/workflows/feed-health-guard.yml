name: Feed health guard

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write deploy guard
        run: |
          cat > scripts/check-live.mjs <<'EOF'
          #!/usr/bin/env node
          /* Deploy guard: refuse to publish when the live feed is missing, empty or
             stale. scripts/sync-live.mjs is the only writer of data/live.json, so a
             silent sync outage would otherwise ship a site showing days-old listings.
             Pass a file path as the first argument to check another feed. */
          import { readFileSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';
          import { fileURLToPath } from 'node:url';

          const MAX_AGE_HOURS = 48;
          const LIVE = process.argv[2]
            ? resolve(process.argv[2])
            : join(dirname(fileURLToPath(import.meta.url)), '..', 'sites', 'whats-happening', 'data', 'live.json');

          function fail(msg) {
            console.error('::error::live data: ' + msg);
            process.exit(1);
          }

          let raw;
          try {
            raw = readFileSync(LIVE, 'utf8');
          } catch (e) {
            fail('data/live.json is missing - run the "Sync live events" workflow');
          }

          let j;
          try {
            j = JSON.parse(raw);
          } catch (e) {
            fail('data/live.json is not valid JSON: ' + e.message);
          }

          const events = Array.isArray(j && j.events) ? j.events : null;
          if (!events) fail('data/live.json has no events array');
          if (events.length === 0) fail('data/live.json contains zero events - the last sync fetched nothing');

          const gen = Date.parse((j && j.generatedAt) || '');
          if (Number.isNaN(gen)) fail('data/live.json has no readable generatedAt');
          const ageHours = (Date.now() - gen) / 36e5;
          if (ageHours > MAX_AGE_HOURS) {
            fail('data/live.json is ' + Math.round(ageHours) + 'h old (limit ' + MAX_AGE_HOURS + 'h) - the daily sync looks stopped');
          }

          console.log('OK: ' + events.length + ' events, ' + Math.round(ageHours) + 'h old, generatedAt ' + j.generatedAt);
          EOF

      - name: Write patch helper
        run: |
          cat > /tmp/patch.js <<'EOF'
          const fs = require('fs');
          const NL = String.fromCharCode(10);
          function readLines(f) { return fs.readFileSync(f, 'utf8').split(NL); }
          function writeLines(f, lines) { fs.writeFileSync(f, lines.join(NL)); }
          function eq(text) { return (l) => l.trim() === text; }
          function starts(text) { return (l) => l.trim().indexOf(text) === 0; }
          function findLine(lines, pred, label) {
            const i = lines.findIndex(pred);
            if (i < 0) throw new Error('anchor missing: ' + label);
            return i;
          }
          function insertAfter(lines, anchor, label, block) {
            const i = findLine(lines, eq(anchor), label);
            lines.splice(i + 1, 0, ...block);
          }
          function replaceRange(lines, startPred, startLabel, endPred, endLabel, block) {
            const s = findLine(lines, startPred, startLabel);
            const e = lines.findIndex((l, i) => i >= s && endPred(l));
            if (e < 0) throw new Error('end anchor missing: ' + endLabel);
            lines.splice(s, e - s + 1, ...block);
          }

          const which = process.argv[2];
          try {
            if (which === 'sync') patchSync();
            else if (which === 'syncwf') patchSyncWf();
            else if (which === 'deploy') patchDeploy();
            else if (which === 'diag') patchDiag();
            else throw new Error('unknown target: ' + which);
          } catch (e) {
            console.log('PATCH FAIL ' + which + ': ' + e.message);
            process.exit(1);
          }
          console.log('patched ' + which);

          function patchSync() {
            const f = 'scripts/sync-live.mjs';
            const s = readLines(f);
            s[findLine(s, starts('import { writeFileSync'), 'sync imports')] =
              "import { writeFileSync, appendFileSync, mkdirSync } from 'node:fs';";
            insertAfter(s, "const OUT = join(ROOT, 'sites', 'whats-happening', 'data', 'live.json');", 'sync OUT', [
              "const HEALTH = join(ROOT, 'sites', 'whats-happening', 'data', 'health.json');"
            ]);
            replaceRange(s, starts("console.log('ticketmaster: ')"), 'sync log start', eq("console.log('wrote ' + OUT);"), 'sync log end', [
              '  const sources = {',
              '    ticketmaster: { status: tm.status, events: tm.events.length, error: tm.error },',
              '    youtube: { status: yt.status, events: yt.events.length, error: yt.error }',
              '  };',
              '  const names = Object.keys(sources);',
              "  const ok = names.filter((n) => sources[n].status === 'ok').length;",
              "  const failed = names.filter((n) => sources[n].status === 'error').length;",
              '  const mostFailed = failed > names.length / 2;',
              '  /* Never overwrite a good feed with nothing, or with a run where most',
              '     sources failed: one stale day beats a silently gutted feed. */',
              '  const aborted = events.length === 0 || ok === 0 || mostFailed;',
              "  const reason = events.length === 0 ? 'no events fetched'",
              "    : ok === 0 ? (failed ? 'every source failed' : 'no source configured')",
              "    : mostFailed ? failed + ' of ' + names.length + ' sources failed' : null;",
              '  for (const n of names) {',
              '    const src = sources[n];',
              "    console.log(n + ': ' + src.status + ' (' + src.events + ' events)' + (src.error ? ' - ' + src.error : ''));",
              '  }',
              "  console.log('total unique events: ' + events.length);",
              '  mkdirSync(dirname(HEALTH), { recursive: true });',
              '  writeFileSync(HEALTH, JSON.stringify({',
              '    ranAt: generatedAt,',
              "    status: aborted ? 'aborted' : 'ok',",
              '    reason,',
              '    eventsFetched: events.length,',
              '    sources',
              '  }, null, 2) + NL_OUT);',
              "  console.log('wrote ' + HEALTH);",
              '  if (aborted) {',
              "    console.log('::warning::Sync aborted (' + reason + ') - keeping the previous live.json.');",
              "    if (process.env.GITHUB_OUTPUT) appendFileSync(process.env.GITHUB_OUTPUT, 'result=aborted' + NL_OUT);",
              '    return;',
              '  }',
              '  writeFileSync(OUT, JSON.stringify({ generatedAt, sources, events }));',
              "  console.log('wrote ' + OUT);",
              "  if (process.env.GITHUB_OUTPUT) appendFileSync(process.env.GITHUB_OUTPUT, 'result=ok' + NL_OUT);"
            ].map((l) => l.split('NL_OUT').join("String.fromCharCode(10)")));
            replaceRange(s, eq('main().catch((e) => {'), 'sync catch', eq('});'), 'sync catch end', [
              'main().catch((e) => {',
              "  console.error('::error::sync failed: ' + String((e && e.stack) || e));",
              "  if (process.env.GITHUB_OUTPUT) appendFileSync(process.env.GITHUB_OUTPUT, 'result=aborted' + String.fromCharCode(10));",
              '  process.exit(1);',
              '});'
            ]);
            writeLines(f, s);
          }

          function patchSyncWf() {
            const f = '.github/workflows/sync-live.yml';
            const w = readLines(f);
            insertAfter(w, '- name: Fetch listings', 'syncwf fetch', ['        id: sync']);
            insertAfter(w, '- name: Build calendar feeds', 'syncwf feeds', ["        if: steps.sync.outputs.result != 'aborted'"]);
            replaceRange(w, eq('- name: Commit live.json and feeds'), 'syncwf commit', eq('git push'), 'syncwf push', [
              '      - name: Commit live.json, health and feeds',
              '        env:',
              '          SYNC_RESULT: $' + '{{ steps.sync.outputs.result }}',
              '        run: |',
              "          git config user.name 'whats-happening-sync'",
              "          git config user.email 'whats-happening-sync@users.noreply.github.com'",
              '          git add sites/whats-happening/data/health.json',
              '          if [ "$SYNC_RESULT" != "aborted" ]; then',
              '            git add sites/whats-happening/data/live.json sites/whats-happening/feeds',
              '          else',
              '            echo "::warning::Sync aborted - live.json and the calendar feeds were left untouched."',
              '          fi',
              '          git diff --cached --quiet && echo unchanged && exit 0',
              '          if [ "$SYNC_RESULT" = "aborted" ]; then',
              '            git commit -m "data(whats-happening): record aborted sync in health.json"',
              '          else',
              '            git commit -m "data(whats-happening): refresh live events and calendar feeds"',
              '          fi',
              '          git push'
            ]);
            writeLines(f, w);
          }

          function patchDeploy() {
            const f = '.github/workflows/deploy.yml';
            const d = readLines(f);
            insertAfter(d, 'run: node --check scripts/smoke-whats-happening.mjs', 'deploy smoke', [
              '',
              '      # A missing, empty or stale feed is a silent outage: fail the build',
              '      # instead of publishing days-old listings.',
              '      - name: Verify live feed is present and fresh',
              '        run: node scripts/check-live.mjs'
            ]);
            writeLines(f, d);
          }

          function patchDiag() {
            const f = 'sites/whats-happening/js/diag.js';
            const g = readLines(f);
            const FN = [
              '  /* Feed health comes from data/health.json, written by scripts/sync-live.mjs,',
              '     so an aborted or stale sync shows as a failing row instead of silence. */',
              "  function feedFile(name) { return new URL('data/' + name, location.href).href; }",
              '  function checkFeed() {',
              '    return Promise.all([',
              "      fetch(feedFile('health.json'), { cache: 'no-store' }).then(function (r) {",
              "        assert(r.ok, 'data/health.json returned http ' + r.status);",
              '        return r.json();',
              '      }),',
              "      fetch(feedFile('live.json'), { cache: 'no-store' }).then(function (r) {",
              "        assert(r.ok, 'data/live.json returned http ' + r.status);",
              '        return r.json();',
              '      })',
              '    ]).then(function (res) {',
              '      var health = res[0], live = res[1];',
              '      var n = live && Array.isArray(live.events) ? live.events.length : 0;',
              "      assert(n > 0, 'data/live.json has no events');",
              "      var gen = Date.parse((live && live.generatedAt) || '');",
              "      assert(!isNaN(gen), 'data/live.json has no readable generatedAt');",
              '      var ageH = Math.round((Date.now() - gen) / 36e5);',
              "      assert(ageH <= 48, 'live feed is ' + ageH + 'h old (limit 48h)');",
              "      assert(health && health.sources, 'data/health.json has no sources block');",
              "      assert(health.status !== 'aborted', 'last sync aborted: ' + (health.reason || 'no reason'));",
              '      var parts = Object.keys(health.sources).map(function (k) {',
              '        var src = health.sources[k] || {};',
              "        return k + ':' + (src.events || 0) + (src.status === 'ok' ? '' : ' ' + (src.status || '?') + (src.error ? ' (' + String(src.error).slice(0, 50) + ')' : ''));",
              '      });',
              "      return n + ' events, ' + ageH + 'h old, ' + parts.join(' | ');",
              '    });',
              '  }'
            ];
            const checks = findLine(g, eq('var CHECKS = ['), 'diag checks');
            g.splice(checks, 0, ...FN, '');
            const bootRow = findLine(g, starts("{ id: 'boot', label:"), 'diag boot row');
            g.splice(bootRow + 1, 0, "    { id: 'feed', label: 'Live feed present, fresh and sourced', fn: checkFeed },");
            writeLines(f, g);
          }
          EOF

      - name: Patch sync script
        run: node /tmp/patch.js sync

      - name: Patch sync workflow
        run: node /tmp/patch.js syncwf

      - name: Patch deploy workflow
        run: node /tmp/patch.js deploy

      - name: Patch diag panel
        run: node /tmp/patch.js diag

      - name: Check the patched files
        run: |
          node --check sites/whats-happening/js/diag.js
          node --check scripts/sync-live.mjs
          node --check scripts/check-live.mjs
          node scripts/check-live.mjs
          echo '{"generatedAt":"2020-01-01T00:00:00Z","events":[{"id":"x"}]}' > /tmp/stale.json
          if node scripts/check-live.mjs /tmp/stale.json; then echo 'stale feed was accepted'; exit 1; fi
          echo '{"generatedAt":"2099-01-01T00:00:00Z","events":[]}' > /tmp/empty.json
          if node scripts/check-live.mjs /tmp/empty.json; then echo 'empty feed was accepted'; exit 1; fi
          if node scripts/check-live.mjs /tmp/missing.json; then echo 'missing feed was accepted'; exit 1; fi
          grep -n 'data/health.json' scripts/sync-live.mjs
          grep -n 'result=aborted' scripts/sync-live.mjs
          grep -n 'check-live.mjs' .github/workflows/deploy.yml
          grep -n 'checkFeed' sites/whats-happening/js/diag.js
          grep -n 'SYNC_RESULT' .github/workflows/sync-live.yml
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; [yaml.safe_load(open(f)) for f in ['.github/workflows/deploy.yml', '.github/workflows/sync-live.yml']]; print('yaml ok')"

      - name: Commit and self-remove
        run: |
          git config user.name 'whats-happening-guard'
          git config user.email 'whats-happening-guard@users.noreply.github.com'
          git add scripts/check-live.mjs scripts/sync-live.mjs .github/workflows/sync-live.yml .github/workflows/deploy.yml sites/whats-happening/js/diag.js
          git commit -m 'Add feed health guard: health.json, diag row, deploy freshness check, abort bad syncs'
          git rm .github/workflows/feed-health-guard.yml
          git commit -m 'Remove feed health guard helper'
          git push
