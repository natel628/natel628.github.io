name: Sync live events

# Pulls real Ticketmaster + YouTube listings once a day and commits them as
# sites/whats-happening/data/live.json, so every visitor sees real events
# without pasting their own API keys. Needs two repo secrets:
#   TICKETMASTER_API_KEY  (free key from developer.ticketmaster.com)
#   YOUTUBE_API_KEY       (free key from console.cloud.google.com, YouTube Data API v3)
# Until both exist the job exits quietly and the site keeps its demo data.
# Manually trigger any time from the Actions tab (workflow_dispatch).

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-live
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch listings
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/sync-live.mjs

      - name: Commit live.json
        run: |
          git config user.name 'whats-happening-sync'
          git config user.email 'whats-happening-sync@users.noreply.github.com'
          git add sites/whats-happening/data/live.json
          git diff --cached --quiet && echo 'live.json unchanged' && exit 0
          git commit -m 'data(whats-happening): refresh live events'
          git push
