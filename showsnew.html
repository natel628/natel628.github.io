async function renderUpcoming(main, token) {
  addSkeletonRow(main, 'Upcoming Movies 🎬');
  addSkeletonRow(main, 'New TV Premieres 📺');

  try {
    const todayStr  = todayISO();
    const futureStr = shiftDaysISO(new Date(), 60);
    const startOfToday = new Date();
    startOfToday.setHours(0, 0, 0, 0);

    const gp = state.genre ? { with_genres: state.genre } : {};

    const [movieRes, tvRes] = await Promise.all([
      discoverSafe('/discover/movie', {
        'primary_release_date.gte': todayStr,
        'primary_release_date.lte': futureStr,
        sort_by: 'popularity.desc',
        'vote_count.gte': 0,
        ...gp,
      }),
      discoverSafe('/discover/tv', {
        'air_date.gte': todayStr,
        'air_date.lte': futureStr,
        sort_by: 'popularity.desc',
        'vote_count.gte': 10,
        ...gp,
      }),
    ]);
    if (token !== renderToken) return;

    const fMovies = await filterResults(movieRes.items.map(m => ({ ...m, media_type: 'movie' })));
    const fShows  = await filterResults(tvRes.items.map(t => ({ ...t, media_type: 'tv' })));
    if (token !== renderToken) return;

    main.innerHTML = '';
    if (movieRes.fellBack || tvRes.fellBack) {
      addNotice(
        `No <strong>${esc(providerLabel())}</strong> listings are published for these upcoming dates yet, so everything is shown. ` +
        `Availability usually appears closer to release.`,
        'provider-fallback');
    }

    renderRow(main, 'Upcoming Movies 🎬', fMovies);
    renderRow(main, 'Premiering / On Air Soon 📺', fShows);

    const listSection = document.createElement('div');
    listSection.className = 'section';
    listSection.innerHTML = `
      <div class="section-header"><span class="section-title">Release Schedule — Next 60 Days</span></div>
      <div style="display:flex;flex-direction:column;gap:8px" id="release-list"></div>
    `;
    main.appendChild(listSection);
    const releaseList = document.getElementById('release-list');

    // The row above is driven by episode air dates; the schedule list is
    // driven by premiere dates, so keep them consistent by including both.
    const sorted = [...fMovies, ...fShows]
      .filter(i => {
        const d = i.release_date || i.first_air_date;
        return d && d >= todayStr && d <= futureStr;
      })
      .sort((a, b) => (a.release_date || a.first_air_date).localeCompare(b.release_date || b.first_air_date));

    if (!sorted.length) {
      releaseList.innerHTML = `<p style="color:var(--text-muted);font-size:.85rem;padding:8px 0">No upcoming releases found for the selected filters.</p>`;
    }

    sorted.slice(0, 30).forEach(item => {
      const title    = item.title || item.name;
      const dateStr  = item.release_date || item.first_air_date;
      const date     = formatDate(dateStr);
      const daysAway = Math.round((new Date(dateStr + 'T00:00:00') - startOfToday) / 86400000);
      const daysLabel = daysAway <= 0 ? 'Today!' : daysAway === 1 ? 'Tomorrow' : `in ${daysAway}d`;

      const el = document.createElement('div');
      el.style.cssText = 'display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;cursor:pointer;transition:border-color .15s';
      el.onmouseover = () => el.style.borderColor = 'var(--accent)';
      el.onmouseout  = () => el.style.borderColor = 'var(--border)';
      el.innerHTML = `
        <div style="min-width:90px;text-align:right">
          <div style="font-size:.75rem;color:var(--accent);font-weight:700">${esc(date)}</div>
          <div style="font-size:.68rem;color:var(--text-muted)">${daysLabel}</div>
        </div>
        <div style="flex:1;min-width:0">
          <div style="font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(title)}</div>
          <div style="font-size:.73rem;color:var(--text-muted)">${item.media_type === 'movie' ? '🎬 Movie' : '📺 TV'} ${score(item) ? '· ⭐ ' + score(item) : ''}</div>
        </div>
      `;
      el.addEventListener('click', () => openModal(item.media_type, item.id, item));
      releaseList.appendChild(el);
    });
  } catch (e) {
    if (token !== renderToken) return;
    console.warn('renderUpcoming error:', e);
    main.innerHTML = emptyStateHTML('⚠️', 'Could not load upcoming releases', esc(e.message), 'retry');
  }
}
function debounce(fn, ms = 250) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => fn(...args), ms);
  };
}

  toolbar.innerHTML = `
    <button class="filter-chip${state.wlFilterStatus === 'all' ? ' active' : ''}" data-wl-status="all">All</button>
    ${statuses.map(s => `<button class="filter-chip${state.wlFilterStatus === s ? ' active' : ''}" data-wl-status="${s}">${wlStatusLabel(s)}</button>`).join('')}
    <select class="filter-select" id="wl-sort" title="Sort my list">
      ${Object.entries(WL_SORTS).map(([k, [label]]) => `<option value="${k}"${state.wlSort === k ? ' selected' : ''}>${label}</option>`).join('')}
    </select>
    <input id="wl-search" class="filter-select" type="search" placeholder="Filter my list…" value="${esc(state.wlQuery)}" style="min-width:180px;cursor:text" />
  `;
  main.appendChild(toolbar);

  toolbar.querySelectorAll('[data-wl-status]').forEach(btn => {
    btn.addEventListener('click', () => {
      state.wlFilterStatus = btn.dataset.wlStatus;
      renderView();
    });
  });
  toolbar.querySelector('#wl-sort').addEventListener('change', e => {
    state.wlSort = e.target.value;
    LS.set('wl_sort', state.wlSort);
    renderView();
  });

  const missing = entries.filter(([key]) => !state.mediaDetails[key]?._full).map(([key]) => key);
  if (missing.length) {
    await promiseAllChunked(missing, async key => {
      const [type, idStr] = key.split('_');
      const id = parseInt(idStr);
      try {
        const detail = await tmdb(`/${type}/${id}`);
        state.mediaDetails[key] = {
          ...(state.mediaDetails[key] || {}),
          title: detail.title || detail.name,
          poster_path: detail.poster_path,
          media_type: type,
          id,
          vote_average: detail.vote_average,
          release_date: detail.release_date,
          first_air_date: detail.first_air_date,
          genre_ids: (detail.genres || []).map(g => g.id),
          _full: true,
          _ts: Date.now(),
        };
      } catch (e) { console.warn('Cache fetch error:', e); }
    }, 5);
    saveMediaDetails();
    if (token !== renderToken) return;
  }

  const rows = entries.map(([key, status]) => {
    const d = state.mediaDetails[key] || {};
    const [t, idStr] = key.split('_');
    return {
      key,
      status,
      item:   { ...d, id: d.id || parseInt(idStr), media_type: d.media_type || t },
      title:  d.title || '',
      rating: state.ratings[key] || 0,
      score:  d.vote_average || 0,
      date:   d.release_date || d.first_air_date || '',
      added:  state.wlAdded[key] || 0,
    };
  });

  const sections = document.createElement('div');
  main.appendChild(sections);

  const rebuild = () => {
    sections.innerHTML = '';
    const q = state.wlQuery.toLowerCase();
    const visible = rows.filter(r => {
      if (state.wlFilterStatus !== 'all' && r.status !== state.wlFilterStatus) return false;
      if (q && !r.title.toLowerCase().includes(q)) return false;
      return true;
    });

    if (!visible.length) {
      sections.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>Nothing in your list matches those filters.</p></div>`;
      return;
    }

    if (state.wlSort === 'added') {
      // Default view keeps the familiar grouping by status.
      statuses.forEach(status => {
        const items = visible.filter(r => r.status === status);
        if (!items.length) return;
        buildWatchlistSection(sections, wlStatusLabel(status), items.map(r => r.item));
      });
    } else {
      const sorter = (WL_SORTS[state.wlSort] || WL_SORTS.added)[1];
      buildWatchlistSection(sections, 'My List', [...visible].sort(sorter).map(r => r.item));
    }
  };

  toolbar.querySelector('#wl-search').addEventListener('input', debounce(e => {
    state.wlQuery = e.target.value.trim();
    rebuild();
  }, 180));

  rebuild();
}

/* ── FOR YOU ──────────────────────────────────────────────────────── */
async function renderRecommended(main, token) {
  const hasRatings = Object.keys(state.ratings).length > 0;

  if (!hasRatings) {
    main.innerHTML = emptyStateHTML('✨', 'No taste profile yet',
      'Rate some movies and shows and this view fills in. Drag the slider on any card, or try Quick Rate.',
      `<div class="empty-actions">
        <button class="modal-btn primary" data-action="quickrate">Start Quick Rate</button>
        <button class="modal-btn" data-action="trending">Browse Trending</button>
      </div>`);
    return;
  }

  addSkeletonRow(main, 'Recommended For You ✨');
  addSkeletonRow(main, 'More Like Your Favorites');

  const needGenres = Object.keys(state.ratings)
    .filter(k => !(state.mediaDetails[k]?.genre_ids || []).length)
    .slice(0, 40);

  if (needGenres.length) {
    await promiseAllChunked(needGenres, async key => {
      const [type, idStr] = key.split('_');
      try {
        const detail = await tmdb(`/${type}/${idStr}`);
        state.mediaDetails[key] = {
          ...(state.mediaDetails[key] || {}),
          title: detail.title || detail.name,
          poster_path: detail.poster_path,
          media_type: type,
          id: parseInt(idStr),
          genre_ids: (detail.genres || []).map(g => g.id),
          _full: true,
          _ts: Date.now(),
        };
      } catch (e) { console.warn('Genre backfill error:', e); }
    }, 5);
    saveMediaDetails();
  }

  recomputeAffinity();
  if (token !== renderToken) return;

  const affinity = LS.get('genre_affinity') || {};
  const topGenres = Object.entries(affinity)
    .filter(([, v]) => v > 0)
    .sort(([,a],[,b]) => b - a)
    .slice(0, 3)
    .map(([id]) => id);
  const badGenres = dislikedGenres();

  let fellBack = false;
  const fetchRec = async (mediaType, label) => {
    const params = {
      sort_by: 'vote_average.desc',
      'vote_count.gte': 200,
      page: 1,
    };
    // The genre control is visible on this view, so it must do something:
    // an explicit choice wins over the inferred taste profile.
    const genreParam = state.genre ? state.genre : topGenres.slice(0, 2).join('|');
    if (genreParam) params.with_genres = genreParam;
    if (badGenres.length) params.without_genres = badGenres.slice(0, 3).join(',');

    const path = mediaType === 'movie' ? '/discover/movie' : '/discover/tv';
    const pages = await Promise.all([
      discoverSafe(path, { ...params, page: 1 }),
      discoverSafe(path, { ...params, page: 2 }),
      discoverSafe(path, { ...params, sort_by: 'popularity.desc', page: 1 }),
    ]);
    if (pages.some(p => p.fellBack)) fellBack = true;

    const seen = new Set();
    const results = pages
      .flatMap(p => p.items || [])
      .map(i => ({ ...i, media_type: mediaType }))
      .filter(i => {
        const key = mediaKey(mediaType, i.id);
        if (seen.has(i.id) || state.ratings[key] || state.watchlist[key]) return false;
        seen.add(i.id);
        return true;
      })
      .sort((a, b) => recScore(b, affinity) - recScore(a, affinity))
      .slice(0, 20);

    return { label, results };
  };

  const [recMovies, recTV] = await Promise.all([
    fetchRec('movie', '🎬 Movies For You'),
    fetchRec('tv',    '📺 Shows For You'),
  ]);
  if (token !== renderToken) return;

  main.innerHTML = '';

  if (fellBack) {
    addNotice(`No <strong>${esc(providerLabel())}</strong> titles matched, so these picks are unfiltered by service.`, 'provider-fallback');
  }

  const liked    = topGenreNames(3);
  const disliked = Object.entries(affinity).filter(([,v]) => v < -1).map(([id]) => GENRE_MAP[id]).filter(Boolean).slice(0,2).join(', ');
  const summary = document.createElement('div');
  summary.style.cssText = 'background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:.82rem;display:flex;gap:16px;flex-wrap:wrap;align-items:center';
  summary.innerHTML = `
    <span>📊 <strong>${Object.keys(state.ratings).length}</strong> ratings</span>
    ${liked    ? `<span>❤️ Loves: <strong>${esc(liked)}</strong></span>` : ''}
    ${disliked ? `<span>👎 Avoids: <strong>${esc(disliked)}</strong></span>` : ''}
    ${state.genre ? `<span>🎯 Genre: <strong>${esc(GENRE_MAP[state.genre] || state.genre)}</strong></span>` : ''}
    <button data-action="reset-filters"
      style="margin-left:auto;background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:6px;padding:3px 10px;font-size:.75rem;cursor:pointer">
      Refresh taste profile
    </button>
  `;
  main.appendChild(summary);

  renderRow(main, recMovies.label, recMovies.results, true);
  renderRow(main, recTV.label, recTV.results, true);

  const topRated = Object.entries(state.ratings)
    .filter(([, v]) => v >= 7)
    .sort(([,a],[,b]) => b - a)
    .slice(0, 3);

  for (const [key] of topRated) {
    const [type, idStr] = key.split('_');
    try {
      let title = state.mediaDetails[key]?.title;
      if (!title) {
        const detail = await tmdb(`/${type}/${idStr}`);
        title = detail.title || detail.name;
        state.mediaDetails[key] = { ...state.mediaDetails[key], title, media_type: type, id: parseInt(idStr) };
        saveMediaDetails();
      }
      const data = await tmdb(`/${type}/${idStr}/recommendations`);
      if (token !== renderToken) return;
      const results = (data.results || [])
        .map(i => ({ ...i, media_type: type }))
        .filter(i => !state.ratings[mediaKey(type, i.id)] && !state.watchlist[mediaKey(type, i.id)])
        .slice(0, 12);

      if (results.length) {
        renderRow(main, `Because you loved ${type === 'movie' ? '🎬' : '📺'} ${esc(title)}`, results);
      }
    } catch (e) { console.warn('Recommendations fetch error:', e); }
  }
}

/* ── SEARCH ──────────────────────────────────────────────────────── */
let searchQuery = '';
let searchResults = [];
let recentSearches = LS.get('recent_searches') || [];

function updateSearchChrome() {
  const input = document.getElementById('search-input');
  const clearBtn = document.getElementById('search-clear');
  if (clearBtn) clearBtn.style.display = input && input.value ? 'inline-block' : 'none';

  const el = document.getElementById('recent-searches');
  if (!el) return;
  if (!recentSearches.length) {
    el.classList.remove('show');
    el.innerHTML = '';
    return;
  }
  el.classList.add('show');
  el.innerHTML = '<span>Recent:</span>' + recentSearches.map((q, i) =>
    `<span class="recent-chip" data-recent="${esc(q)}" role="button" tabindex="0">${esc(q)}` +
    `<span class="x" data-recent-remove="${i}" role="button" tabindex="0" aria-label="Remove ${esc(q)}">✕</span></span>`
  ).join('');
}

function rememberSearch(q) {
  const t = (q || '').trim();
  if (!t) return;
  recentSearches = [t, ...recentSearches.filter(x => x.toLowerCase() !== t.toLowerCase())]
    .slice(0, RECENT_SEARCH_MAX);
  LS.set('recent_searches', recentSearches);
  updateSearchChrome();
}

function clearSearch() {
  const input = document.getElementById('search-input');
  if (input) { input.value = ''; input.focus(); }
  searchQuery = '';
  searchResults = [];
  updateSearchChrome();
  if (state.view === 'search') {
    state.view = 'trending';
    renderView();
  }
}

function doSearch() {
  const q = document.getElementById('search-input').value.trim();
  if (!q) return;
  rememberSearch(q);
  searchQuery = q;
  state.searchPage = 1;
  state.view = 'search';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  renderView();
}

// Type-to-search: only kicks in after a short pause and 2+ characters.
const searchAsYouType = debounce(() => {
  const q = document.getElementById('search-input').value.trim();
  if (q.length < 2) return;
  if (q === searchQuery && state.view === 'search') return;
  doSearch();
}, 450);

document.getElementById('search-input').addEventListener('input', () => {
  updateSearchChrome();
  searchAsYouType();
});
document.getElementById('search-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
  else if (e.key === 'Escape') { e.preventDefault(); clearSearch(); }
});

document.getElementById('recent-searches').addEventListener('click', e => {
  const removeEl = e.target.closest('[data-recent-remove]');
  if (removeEl) {
    e.stopPropagation();
    recentSearches.splice(Number(removeEl.dataset.recentRemove), 1);
    LS.set('recent_searches', recentSearches);
    updateSearchChrome();
    return;
  }
  const chip = e.target.closest('[data-recent]');
  if (!chip) return;
  document.getElementById('search-input').value = chip.dataset.recent;
  doSearch();
});

async function loadMoreSearchResults() {
  state.searchPage++;
  try {
    const [movies, shows] = await Promise.all([
      tmdb('/search/movie', { query: searchQuery, page: state.searchPage }),
      tmdb('/search/tv',    { query: searchQuery, page: state.searchPage }),
    ]);
    const newResults = [
      ...(movies.results || []).map(m => ({ ...m, media_type: 'movie' })),
      ...(shows.results  || []).map(t => ({ ...t, media_type: 'tv' })),
    ].sort((a, b) => (b.popularity || 0) - (a.popularity || 0));

    searchResults.push(...newResults);
    const main = document.getElementById('main-content');
    if (!newResults.length) { toast('No more results'); document.getElementById('load-more-btn')?.remove(); return; }

    const existingRow = main.querySelector('.card-row[data-search-row]');
    if (existingRow) {
      newResults.forEach(item => existingRow.appendChild(buildCard(item)));
      const meta = main.querySelector('.search-meta');
      if (meta) meta.textContent = `${searchResults.length} results (through page ${state.searchPage})`;
    } else {
      renderSearchRow(main);
    }
    positionLoadMoreButton(main);
  } catch (e) {
    console.warn('Load more search error:', e);
    toast('Failed to load more results');
  }
}

function positionLoadMoreButton(main) {
  document.getElementById('load-more-btn')?.remove();
  const btn = document.createElement('button');
  btn.id = 'load-more-btn';
  btn.className = 'modal-btn';
  btn.style.cssText = 'display:block;margin:20px auto;padding:10px 24px';
  btn.textContent = 'Load More Results';
  btn.onclick = loadMoreSearchResults;
  main.appendChild(btn);
}

function renderSearchRow(main) {
  const sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = `
    <div class="section-header">
      <span class="section-title">Search results for "${esc(searchQuery)}"</span>
      <span class="search-meta" style="margin-left:auto;font-size:.78rem;color:var(--text-muted)">${searchResults.length} results</span>
    </div>
    <div class="row-wrap">
      <button class="row-scroll-btn left" aria-label="Scroll left">&#8249;</button>
      <div class="card-row" data-search-row></div>
      <button class="row-scroll-btn right" aria-label="Scroll right">&#8250;</button>
    </div>`;
  const row = sec.querySelector('.card-row');
  searchResults.forEach(item => row.appendChild(buildCard(item)));
  main.appendChild(sec);
}

async function renderSearch(main, token) {
  main.innerHTML = '<div class="empty-state"><div class="icon">🔍</div>Searching…</div>';
  try {
    const [movies, shows] = await Promise.all([
      tmdb('/search/movie', { query: searchQuery, page: state.searchPage }),
      tmdb('/search/tv',    { query: searchQuery, page: state.searchPage }),
    ]);
    if (token !== renderToken) return;
    searchResults = [
      ...(movies.results || []).map(m => ({ ...m, media_type: 'movie' })),
      ...(shows.results  || []).map(t => ({ ...t, media_type: 'tv' })),
    ].sort((a, b) => (b.popularity || 0) - (a.popularity || 0));

    main.innerHTML = '';
    if (!searchResults.length) {
      main.innerHTML = `<div class="empty-state"><div class="icon">🔍</div>
        <p><strong>No results for "${esc(searchQuery)}"</strong></p>
        <p style="margin-top:6px;font-size:.85rem">Check the spelling, or try a shorter phrase.</p>
      </div>`;
      return;
    }
    renderSearchRow(main);
    positionLoadMoreButton(main);
  } catch (e) {
    if (token !== renderToken) return;
    console.warn('Search error:', e);
    main.innerHTML = emptyStateHTML('⚠️', 'Search failed', esc(e.message), 'retry');
  }
}

/* ── QUICK RATE ─────────────────────────────────────────────────────── */
const qrPage = { movie: 0, tv: 0 };
const qrSeen = new Set();

async function fetchQuickRateBatch(type, want = 20) {
  const out = [];
  const path = type === 'movie' ? '/discover/movie' : '/discover/tv';
  const minVotes = type === 'movie' ? 100 : 50;
  let tries = 0;

  while (out.length < want && tries < 5 && qrPage[type] < 500) {
    qrPage[type]++; tries++;
    let data;
    try {
      data = await tmdb(path, { sort_by: 'popularity.desc', 'vote_count.gte': minVotes, page: qrPage[type] });
    } catch (e) {
      console.warn('Quick rate batch error:', e);
      break;
    }
    const results = data.results || [];
    if (!results.length) break;

    results.forEach(i => {
      const key = mediaKey(type, i.id);
      if (qrSeen.has(key) || state.ratings[key]) return;
      qrSeen.add(key);
      out.push({ ...i, media_type: type });
    });
  }
  return out;
}

async function renderQuickRate(main, token) {
  addSkeletonRow(main, 'Popular Movies 🎬');
  addSkeletonRow(main, 'Popular TV Shows 📺');

  try {
    qrSeen.clear();
    qrPage.movie = Math.floor(Math.random() * 4);
    qrPage.tv    = Math.floor(Math.random() * 4);

    const [movieItems, tvItems] = await Promise.all([
      fetchQuickRateBatch('movie'),
      fetchQuickRateBatch('tv'),
    ]);
    if (token !== renderToken) return;

    main.innerHTML = '';
    renderQuickRateRow(main, 'Popular Movies 🎬', 'movie', movieItems);
    renderQuickRateRow(main, 'Popular TV Shows 📺', 'tv', tvItems);

    addNotice('Tip: press <strong>1–9</strong> to rate the first card here, <strong>0</strong> for a 10. On a card, <strong>👍</strong> rates it 10 and <strong>👎</strong> rates it 2.', 'qr-tip');
  } catch(e) {
    if (token !== renderToken) return;
    main.innerHTML = emptyStateHTML('⚠️', 'Could not load Quick Rate', esc(e.message), 'retry');
  }
}

function renderQuickRateRow(container, title, type, items) {
  const sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = `
    <div class="section-header"><span class="section-title">${title}</span></div>
    <div class="card-row" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px"></div>
    <div class="qr-empty" style="display:none;color:var(--text-muted);font-size:.85rem;padding:8px 0">Nothing left to rate here — hit Load more.</div>
    <button class="modal-btn qr-more" style="display:block;margin:16px auto 0">Load more</button>`;
  const grid  = sec.querySelector('.card-row');
  const empty = sec.querySelector('.qr-empty');
  const more  = sec.querySelector('.qr-more');

  let loading = false;
  const syncEmpty = () => { empty.style.display = grid.children.length ? 'none' : 'block'; };
  const addItems = list => list.forEach(item => grid.appendChild(buildQuickRateCard(item, onGone)));

  async function loadMore(want) {
    if (loading) return;
    loading = true;
    more.disabled = true;
    try { addItems(await fetchQuickRateBatch(type, want)); }
    catch (e) { console.warn('Quick rate error:', e); toast('Failed to load more'); }
    loading = false;
    more.disabled = false;
    syncEmpty();
  }

  function onGone() {
    syncEmpty();
    if (grid.children.length < 6) loadMore(12);
  }

  more.addEventListener('click', () => loadMore(20));
  addItems(items);
  syncEmpty();
  container.appendChild(sec);
}

function buildQuickRateCard(item, onGone) {
  const type = item.media_type;
  const title = item.title || item.name;
  const poster = item.poster_path ? `${IMG_BASE}${item.poster_path}` : '';
  const year = (item.release_date || item.first_air_date || '').slice(0, 4);

  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = item.id;
  card.dataset.type = type;
  if (item.genre_ids) card.dataset.genres = item.genre_ids.join(',');
  card.style.cssText = 'display:flex;flex-direction:column;gap:8px;flex:initial;transition:opacity .3s, transform .3s';

  card.innerHTML = `
    <div class="qr-poster" style="position:relative;aspect-ratio:2/3;background:var(--surface2);overflow:hidden;cursor:pointer">
      ${poster ? `<img src="${esc(poster)}" alt="" style="width:100%;height:100%;object-fit:cover" loading="lazy" decoding="async">` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-muted)">🎬</div>'}
    </div>
    <div style="padding:0 10px 10px">
      <div style="font-weight:600;font-size:0.85rem;line-height:1.3;margin-bottom:4px">${esc(title)}</div>
      <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:8px">${esc(year)} • ${type === 'movie' ? 'Movie' : 'TV'}</div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="thumbs-btn" data-r="10" title="👍 Loved it (10)" aria-label="Rate ${esc(title)} 10">👍</button>
        <button class="thumbs-btn" data-r="2" title="👎 Not for me (2)" aria-label="Rate ${esc(title)} 2">👎</button>
        <button class="thumbs-btn" data-r="skip" title="Skip — hide without rating" aria-label="Skip ${esc(title)}">⏭</button>
      </div>
    </div>
  `;

  const dismiss = () => {
    card.style.pointerEvents = 'none';
    card.style.opacity = '0';
    card.style.transform = 'scale(.92)';
    setTimeout(() => { card.remove(); if (onGone) onGone(); }, 300);
  };

  const rate = (val, skip = false) => {
    if (skip) { dismiss(); return; }
    setRating(type, item.id, val, item.genre_ids || [], item);
    if (state.simklToken) pushRatingToSimkl(type, item.id, val);
    dismiss();
  };
  // Exposed so the number keys can rate the first card on screen.
  card._qrRate = rate;

  card.querySelector('.qr-poster').addEventListener('click', () => openModal(type, item.id, item));
  card.querySelectorAll('.thumbs-btn').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.r === 'skip') rate(0, true);
    else rate(Number(b.dataset.r));
  }));

  return card;
}
/* ── STATS & STORAGE ───────────────────────────────────────────────── */
function getStorageUsage() {
  let totalBytes = 0;
  for (const key in localStorage) {
    if (Object.prototype.hasOwnProperty.call(localStorage, key)) {
      totalBytes += ((localStorage[key].length + key.length) * 2);
    }
  }
  const maxBytes = 5 * 1024 * 1024;
  return {
    bytes: totalBytes,
    kb: (totalBytes / 1024).toFixed(1),
    percent: Math.min(100, ((totalBytes / maxBytes) * 100)).toFixed(1)
  };
}

function clearCache() {
  _cache.clear();
  _inflight.clear();
  state.mediaDetails = {};
  saveMediaDetails();
  toast('Cache cleared successfully');
  renderView();
}

function renderStats(main) {
  const rated = Object.entries(state.ratings).filter(([, v]) => v > 0);
  const totalRatings = rated.length;
  const totalWatchlist = Object.keys(state.watchlist).length;
  const avgRating = totalRatings > 0
    ? (rated.reduce((a, [, b]) => a + b, 0) / totalRatings).toFixed(1)
    : '0';

  const statusCounts = {};
  Object.values(state.watchlist).forEach(s => {
    statusCounts[s] = (statusCounts[s] || 0) + 1;
  });

  const movieCount = rated.filter(([k]) => k.startsWith('movie_')).length;
  const tvCount = rated.filter(([k]) => k.startsWith('tv_')).length;

  const genreCounts = {};
  const mine = new Set([...Object.keys(state.ratings), ...Object.keys(state.watchlist)]);
  mine.forEach(key => {
    (state.mediaDetails[key]?.genre_ids || []).forEach(gid => {
      if (GENRE_MAP[gid]) genreCounts[gid] = (genreCounts[gid] || 0) + 1;
    });
  });

  const topGenres = Object.entries(genreCounts)
    .sort(([,a], [,b]) => b - a)
    .slice(0, 5)
    .map(([id, count]) => ({ name: GENRE_MAP[id] || `Genre ${id}`, count }));

  const buckets = Array.from({ length: 10 }, (_, i) => ({ rating: i + 1, count: 0 }));
  rated.forEach(([, v]) => {
    const idx = Math.max(1, Math.min(10, Math.round(v))) - 1;
    buckets[idx].count++;
  });
  const maxBucket = Math.max(1, ...buckets.map(b => b.count));

  const storage = getStorageUsage();

  main.innerHTML = `
    <div class="section">
      <div class="section-header"><span class="section-title">Your Viewing Stats</span></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px">
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center">
          <div style="font-size:2.5rem;font-weight:700;color:var(--accent)">${totalRatings}</div>
          <div style="font-size:0.85rem;color:var(--text-muted)">Items Rated</div>
        </div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center">
          <div style="font-size:2.5rem;font-weight:700;color:var(--accent2)">${avgRating}<span style="font-size:1rem;color:var(--text-muted)">/10</span></div>
          <div style="font-size:0.85rem;color:var(--text-muted)">Average Rating</div>
        </div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center">
          <div style="font-size:2.5rem;font-weight:700;color:#1ce783">${totalWatchlist}</div>
          <div style="font-size:0.85rem;color:var(--text-muted)">In Watchlist</div>
        </div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center">
          <div style="font-size:2.5rem;font-weight:700;color:#1a6ef5">${movieCount}</div>
          <div style="font-size:0.85rem;color:var(--text-muted)">Movies Rated</div>
        </div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center">
          <div style="font-size:2.5rem;font-weight:700;color:#f5a623">${tvCount}</div>
          <div style="font-size:0.85rem;color:var(--text-muted)">TV Shows Rated</div>
        </div>
      </div>

      ${totalRatings > 0 ? `
      <div style="margin-bottom:24px">
        <div style="font-size:1rem;font-weight:700;margin-bottom:12px">Rating Distribution</div>
        <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px">
          ${buckets.map(b => `
            <div class="hist-row">
              <span class="hist-label">${b.rating}</span>
              <div class="hist-bar-wrap">
                <div class="hist-bar" style="width:${(b.count / maxBucket) * 100}%;background:${ratingColor(b.rating)}"></div>
              </div>
              <span class="hist-count">${b.count}</span>
            </div>
          `).join('')}
        </div>
      </div>
      ` : ''}

      ${Object.keys(statusCounts).length > 0 ? `
      <div style="margin-bottom:24px">
        <div style="font-size:1rem;font-weight:700;margin-bottom:12px">Watchlist Status</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          ${Object.entries(statusCounts).map(([status, count]) => `
            <div style="background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 16px;display:flex;align-items:center;gap:8px">
              <span style="font-weight:700">${count}</span>
              <span style="color:var(--text-muted)">${wlStatusLabel(status)}</span>
            </div>
          `).join('')}
        </div>
      </div>
      ` : ''}

      ${topGenres.length > 0 ? `
      <div style="margin-bottom:24px">
        <div style="font-size:1rem;font-weight:700;margin-bottom:12px">Top Genres</div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          ${topGenres.map(g => `<span class="genre-tag">${esc(g.name)} (${g.count})</span>`).join('')}
        </div>
      </div>
      ` : ''}

      <div style="margin-top:24px;padding-top:24px;border-top:1px solid var(--border)">
        <div style="font-size:1rem;font-weight:700;margin-bottom:12px">Data & Storage Management</div>
        <div style="background:var(--surface2);padding:12px;border-radius:8px;margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:6px">
            <span>Local Storage Used</span>
            <span>${storage.kb} KB (${storage.percent}%)</span>
          </div>
          <div style="background:var(--border);height:6px;border-radius:3px;overflow:hidden">
            <div style="background:var(--accent);width:${storage.percent}%;height:100%"></div>
          </div>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <button class="modal-btn" onclick="exportData()">📥 Export Data</button>
          <button class="modal-btn" onclick="document.getElementById('import-file').click()">📤 Import Data</button>
          <button class="modal-btn" onclick="clearCache()">🧹 Clear Cache</button>
          <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(this)" />
        </div>
      </div>
    </div>
  `;
}

function exportData() {
  const data = {
    ratings: state.ratings,
    watchlist: state.watchlist,
    wlAdded: state.wlAdded,
    mediaDetails: state.mediaDetails,
    exportDate: new Date().toISOString(),
    version: '1.2'
  };
  downloadBlob(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }),
    `media-calendar-backup-${localISO(new Date())}.json`);
  toast('Data exported successfully');
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!confirm(`Import ${Object.keys(data.ratings || {}).length} ratings and ${Object.keys(data.watchlist || {}).length} watchlist items? This will merge with existing data.`)) return;

      state.ratings = { ...state.ratings, ...(data.ratings || {}) };
      state.watchlist = { ...state.watchlist, ...(data.watchlist || {}) };
      state.wlAdded = { ...state.wlAdded, ...(data.wlAdded || {}) };
      state.mediaDetails = { ...state.mediaDetails, ...(data.mediaDetails || {}) };

      saveRatings();
      saveWatchlist();
      saveMediaDetails();
      recomputeAffinity();
      toast('Data imported successfully');
      renderView();
    } catch (err) {
      toast('Failed to import: Invalid file format');
      console.error(err);
    }
  };
  reader.readAsText(file);
  input.value = '';
}

/* ─────────────────────────────────────────────────────────────────────
   HELPER UTILITIES: RENDER & FILTER PIPELINES
   ───────────────────────────────────────────────────────────────────── */
async function filterResults(items, opts = {}) {
  const { yearServerSide = false } = opts;

  let out = items.filter(i => {
    if (filterVisible('type') && state.filterType !== 'all' && i.media_type !== state.filterType) return false;
    if (filterVisible('genre') && state.genre && !(i.genre_ids || []).includes(parseInt(state.genre, 10))) return false;
    if (filterVisible('hideRated') && state.hideRated && state.ratings[mediaKey(i.media_type, i.id)]) return false;
    // Only re-check the year when the request itself could not express it,
    // otherwise the two checks disagree for re-releases and drop valid items.
    if (filterVisible('year') && state.year && !yearServerSide) {
      const date = i.release_date || i.first_air_date;
      if (!date || !date.startsWith(state.year)) return false;
    }
    return true;
  });

  if (filterVisible('contentRating') && state.contentRating) {
    const need = out.filter(i => state.mediaDetails[mediaKey(i.media_type, i.id)]?.contentRating === undefined);
    if (need.length) {
      await promiseAllChunked(need, async item => {
        item._contentRating = await getContentRating(item.media_type, item.id);
      }, 8);
      saveMediaDetails(); // single write for the whole batch
    }
    out.forEach(item => {
      if (item._contentRating === undefined) {
        item._contentRating = state.mediaDetails[mediaKey(item.media_type, item.id)]?.contentRating || '';
      }
    });
    out = out.filter(i => (i._contentRating || 'NR') === state.contentRating);
  }

  return out;
}

function renderRow(container, title, items, recBadge = false) {
  const sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = `
    <div class="section-header"><span class="section-title">${title}</span></div>
    <div class="row-wrap">
      <button class="row-scroll-btn left" aria-label="Scroll left">&#8249;</button>
      <div class="card-row"></div>
      <button class="row-scroll-btn right" aria-label="Scroll right">&#8250;</button>
    </div>`;

  const row = sec.querySelector('.card-row');

  if (!items.length) {
    const hasFilters = activeFilterCount() > 0;
    sec.querySelector('.row-wrap').outerHTML = `<div class="row-empty">
      <span>No results found${hasFilters ? ' for the current filters' : ''}.</span>
      ${hasFilters ? '<button class="link-btn" data-action="reset-filters">Clear filters</button>' : ''}
    </div>`;
  } else {
    items.forEach(item => {
      const card = buildCard(item);
      if (recBadge) {
        const badge = document.createElement('span');
        badge.className = 'rec-badge';
        badge.style.cssText = 'position:absolute;top:6px;right:6px;';
        badge.textContent = 'For You';
        card.appendChild(badge);
      }
      row.appendChild(card);
    });
  }
  container.appendChild(sec);
}

function addSkeletonRow(container, title) {
  const sec = document.createElement('div');
  sec.className = 'section';
  sec.innerHTML = `<div class="section-header"><span class="section-title">${title}</span></div>
  <div class="card-row">${[...Array(6)].map(() => `<div class="skel-card skeleton"></div>`).join('')}</div>`;
  container.appendChild(sec);
}

const yearFilter = document.getElementById('year-filter');
const currentYear = new Date().getFullYear();
for (let y = currentYear + 1; y >= 1950; y--) {
  const opt = document.createElement('option');
  opt.value = y;
  opt.textContent = y;
  yearFilter.appendChild(opt);
}
yearFilter.addEventListener('change', e => {
  state.year = e.target.value;
  savePrefs();
  syncFilterControls();
  if (filterVisible('year')) renderView();
});

/* Single source of truth for which controls are shown, derived from the same
   map the filter pipeline uses so the two can never disagree. */
function updateFilterVisibility() {
  const show = (id, on) => {
    const el = document.getElementById(id);
    if (el) el.style.display = on ? '' : 'none';
  };
  show('year-filter',     filterVisible('year'));
  show('sort-filter',     filterVisible('sort'));
  show('provider-filter', filterVisible('provider'));
  show('region-filter',   filterVisible('region'));
  show('rating-filter',   filterVisible('contentRating'));
  show('genre-filter',    filterVisible('genre'));
  show('type-label',      filterVisible('type'));
  show('genre-label',     filterVisible('genre'));
  show('hide-rated-label',filterVisible('hideRated'));

  document.querySelectorAll('#filter-row [data-filter-type]').forEach(chip => {
    chip.style.display = filterVisible('type') ? '' : 'none';
  });

  const anyVisible = ['type','genre','provider','contentRating','year','sort','hideRated']
    .some(n => filterVisible(n));
  if (!anyVisible) document.getElementById('filter-reset')?.classList.remove('show');
}

const genreFilter = document.getElementById('genre-filter');
Object.entries(GENRE_MAP)
  .sort(([,a], [,b]) => a.localeCompare(b))
  .forEach(([id, name]) => {
    const opt = document.createElement('option');
    opt.value = id;
    opt.textContent = name;
    genreFilter.appendChild(opt);
  });

document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    state.view = tab.dataset.view;
    renderView();
  });
});

/* ─────────────────────────────────────────────────────────────────────
   INITIALIZATION
   ───────────────────────────────────────────────────────────────────── */
async function refreshSimklIfNeeded() {
  if (!state.simklToken) return;
  try {
    const lastSync = LS.get('simkl_last_sync') || '2000-01-01T00:00:00.000Z';
    const activities = await simklGet('/sync/activities');
    const latest = [
      activities?.all,
      activities?.tv_shows?.all,
      activities?.movies?.all,
      activities?.tv?.all,
      activities?.tv?.rated_at,
      activities?.movies?.rated_at,
    ].filter(Boolean).sort().pop();

    if (!latest || latest > lastSync) {
      await syncSimklLibrary();
    }
    LS.set('simkl_last_sync', new Date().toISOString());
  } catch(e) {
    console.warn('Simkl activity check error:', e);
  }
}

(async function init() {
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('theme-toggle').textContent = state.theme === 'dark' ? '🌙' : '☀️';

  if (TMDB_TOKEN.startsWith('__TMDB')) {
    document.getElementById('config-warning').classList.add('show');
    console.warn('[Media Calendar] TMDB_TOKEN placeholder still present. ' +
      'This is expected if you opened the raw source locally. ' +
      'The CI workflow injects the real token before deploy.');
  }

  syncFilterControls();
  updateSearchChrome();

  const isLocal = window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
  if (isLocal) {
    const btn  = document.getElementById('simkl-btn');
    const user = document.getElementById('simkl-user');
    btn.textContent   = 'Simkl (deploy to enable)';
    btn.style.opacity = '0.4';
    btn.style.cursor  = 'not-allowed';
    btn.onclick       = () => toast('Connect Simkl after deploying');
    user.textContent  = '⚠ Running locally';
    user.style.color  = 'var(--text-muted)';
  } else {
    updateSimklUI();
    await handleSimklCallback();
    await refreshSimklIfNeeded();
  }

  renderView();
})();
</script>
